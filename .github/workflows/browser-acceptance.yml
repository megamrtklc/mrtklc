name: Browser Acceptance Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-acceptance.yml'
      - 'tests/acceptance.mjs'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Wait for Pages deployment
        run: sleep 45
      - name: Run production browser acceptance tests
        env:
          BASE_URL: https://megamrtklc.github.io/mrtklc/
        run: node tests/acceptance.mjs

# Manual verification trigger after responsive hero picture-source deployment (Nov 11, 2026).
