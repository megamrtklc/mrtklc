name: Browser Acceptance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate admin panel markup and JavaScript
        run: |
          node tests/admin-markup-validation.mjs
          node tests/admin-action-contracts.mjs
          node --check admin/admin.js
          node --check app.js
          node --check app.min.js
          node tests/mobile-hero-resource-contract.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run admin browser interaction tests
        run: node tests/admin-browser-interactions.mjs
      - name: Wait for Pages deployment
        if: github.event_name != 'pull_request'
        run: sleep 90
      - name: Run production browser acceptance tests
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: https://megamrtklc.github.io/mrtklc/
        run: node tests/acceptance.mjs

# Manual production verification after mobile hero 500px cap deployment (Nov 11, 2026).
