name: Build compact hero data

on:
  push:
    branches: [main]
    paths:
      - 'filmvediziler.json'
      - 'scripts/build-hero-data.mjs'
      - '.github/workflows/build-hero-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hero-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and commit compact hero feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-hero-data.mjs
            git add hero-data.json index.html
            if git diff --cached --quiet; then
              echo "Hero feed is already current."
              exit 0
            fi
            git commit -m "Generate compact homepage hero data"
            if git push; then
              exit 0
            fi
            echo "Concurrent push detected; retrying from latest main (attempt $attempt)."
          done
          echo "Could not publish hero feed after three attempts."
          exit 1
