name: Deploy CineVerse Admin Worker

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "worker/**"
      - ".github/workflows/deploy-admin-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cineverse-admin-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.CINEVERSE_GITHUB_TOKEN }}
        run: |
          test -n "$CF_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)
          test -n "$GH_TOKEN" || (echo "Missing CINEVERSE_GITHUB_TOKEN repository secret" && exit 1)

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config worker/wrangler.jsonc

      - name: Store GitHub token as encrypted Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CINEVERSE_GITHUB_TOKEN: ${{ secrets.CINEVERSE_GITHUB_TOKEN }}
        run: |
          printf '%s' "$CINEVERSE_GITHUB_TOKEN" | npx --yes wrangler@latest secret put GITHUB_TOKEN --config worker/wrangler.jsonc
