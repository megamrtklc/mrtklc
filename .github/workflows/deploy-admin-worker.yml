name: Deploy CineVerse Admin Worker

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "worker/**"
      - "tests/**"
      - ".github/workflows/deploy-admin-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cineverse-admin-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker and admin source
        run: |
          node --check worker/src/index.js
          node --check admin/admin.js
          node tests/admin-data-validation.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('worker/wrangler.jsonc', 'utf8'))"

      - name: Check deployment secrets
        id: preflight
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.CINEVERSE_GITHUB_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.CINEVERSE_ADMIN_PASSWORD }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$GH_TOKEN" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CINEVERSE_GITHUB_TOKEN and CINEVERSE_ADMIN_PASSWORD repository secrets, then run this workflow again."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify GitHub catalog write permission
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.CINEVERSE_GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.GH_TOKEN;
          if (!token) throw new Error("CINEVERSE_GITHUB_TOKEN tanımlanmamış.");
          const owner = "megamrtklc";
          const repo = "mrtklc";
          const branch = `cineverse-write-check-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const path = `.cineverse-admin-write-check/${branch}.txt`;
          const base = `https://api.github.com/repos/${owner}/${repo}`;
          const headers = {
            authorization: `Bearer ${token}`,
            accept: "application/vnd.github+json",
            "x-github-api-version": "2022-11-28",
            "user-agent": "CineVerse-Admin-Permission-Check",
            "content-type": "application/json"
          };
          async function api(endpoint, method = "GET", body) {
            const response = await fetch(base + endpoint, {
              method,
              headers,
              ...(body ? { body: JSON.stringify(body) } : {})
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(`GitHub yazma yetkisi kontrolü başarısız (${response.status}): ${payload.message || response.statusText}`);
            }
            return payload;
          }
          let branchCreated = false;
          try {
            const main = await api("/git/ref/heads/main");
            await api("/git/refs", "POST", {
              ref: `refs/heads/${branch}`,
              sha: main.object.sha
            });
            branchCreated = true;
            const created = await api(`/contents/${path.split("/").map(encodeURIComponent).join("/")}`, "PUT", {
              message: "Verify CineVerse admin GitHub write permission",
              content: Buffer.from("temporary permission check").toString("base64"),
              branch
            });
            await api(`/contents/${path.split("/").map(encodeURIComponent).join("/")}`, "DELETE", {
              message: "Clean up CineVerse admin permission check",
              sha: created.content.sha,
              branch
            });
            console.log("PASS: CINEVERSE_GITHUB_TOKEN geçici dalda dosya oluşturup silebiliyor; Contents yazma yetkisi doğrulandı.");
          } finally {
            if (branchCreated) {
              try {
                await api(`/git/refs/heads/${encodeURIComponent(branch)}`, "DELETE");
                console.log("PASS: Geçici kontrol dalı temizlendi.");
              } catch (error) {
                console.error("Geçici kontrol dalı temizlenemedi:", error.message);
                process.exitCode = 1;
              }
            }
          }
          NODE

      - name: Provision security database and apply migrations
        if: steps.preflight.outputs.configured == 'true'
        id: security_db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));const a=Array.isArray(x)?x:(x.result||[]);const d=a.find(v=>v.name==='cineverse-admin-security');if(d)process.stdout.write(d.uuid||d.id||'');")
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@latest d1 create cineverse-admin-security
            npx --yes wrangler@latest d1 list --json > /tmp/d1-list.json
            DB_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));const a=Array.isArray(x)?x:(x.result||[]);const d=a.find(v=>v.name==='cineverse-admin-security');if(d)process.stdout.write(d.uuid||d.id||'');")
          fi
          if [ -z "$DB_ID" ]; then echo "::error::Security D1 database could not be provisioned."; exit 1; fi
          node - "$DB_ID" <<'NODE'
          const fs=require('node:fs');
          const base=JSON.parse(fs.readFileSync('worker/wrangler.jsonc','utf8'));
          base.d1_databases=[{binding:'SECURITY_DB',database_name:'cineverse-admin-security',database_id:process.argv[2],migrations_dir:'migrations'}];
          fs.writeFileSync('worker/wrangler.generated.json',JSON.stringify(base,null,2));
          NODE
          npx --yes wrangler@latest d1 migrations apply cineverse-admin-security --remote --config worker/wrangler.generated.json

      - name: Diagnose security database schema
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for table in admin_credentials admin_sessions admin_login_events admin_security_settings admin_app_secrets; do
            echo "--- $table ---"
            npx --yes wrangler@latest d1 execute cineverse-admin-security --remote --command="PRAGMA table_info($table)" --config worker/wrangler.generated.json --json
          done
          echo "--- Safe row-count diagnostics ---"
          npx --yes wrangler@latest d1 execute cineverse-admin-security --remote --command="SELECT (SELECT COUNT(*) FROM admin_credentials) AS credential_rows, (SELECT COUNT(*) FROM admin_security_settings) AS settings_rows, (SELECT COUNT(*) FROM admin_app_secrets) AS signing_secret_rows" --config worker/wrangler.generated.json --json

      - name: Deploy Worker
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config worker/wrangler.generated.json

      - name: Validate administrator password length
        if: steps.preflight.outputs.configured == 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.CINEVERSE_ADMIN_PASSWORD }}
        run: |
          if [ ${#ADMIN_PASSWORD} -lt 10 ]; then echo "::error::CINEVERSE_ADMIN_PASSWORD must be at least 10 characters."; exit 1; fi

      - name: Store administrator password as encrypted Worker secret
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.CINEVERSE_ADMIN_PASSWORD }}
        run: printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@latest secret put ADMIN_PASSWORD --config worker/wrangler.generated.json

      - name: Store GitHub token as encrypted Worker secret
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CINEVERSE_GITHUB_TOKEN: ${{ secrets.CINEVERSE_GITHUB_TOKEN }}
        run: |
          printf '%s' "$CINEVERSE_GITHUB_TOKEN" | npx --yes wrangler@latest secret put GITHUB_TOKEN --config worker/wrangler.generated.json
