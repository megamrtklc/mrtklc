name: Deploy CineVerse Admin Worker

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - "worker/**"
      - ".github/workflows/deploy-admin-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cineverse-admin-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker and admin source
        run: |
          node --check worker/src/index.js
          node --check admin/admin.js
          node -e "JSON.parse(require('node:fs').readFileSync('worker/wrangler.jsonc', 'utf8'))"

      - name: Check deployment secrets
        id: preflight
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.CINEVERSE_GITHUB_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.CINEVERSE_ADMIN_PASSWORD }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$GH_TOKEN" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CINEVERSE_GITHUB_TOKEN and CINEVERSE_ADMIN_PASSWORD repository secrets, then run this workflow again."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config worker/wrangler.jsonc

      - name: Validate administrator password length
        if: steps.preflight.outputs.configured == 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.CINEVERSE_ADMIN_PASSWORD }}
        run: |
          if [ ${#ADMIN_PASSWORD} -lt 20 ]; then echo "::error::CINEVERSE_ADMIN_PASSWORD must be at least 20 characters."; exit 1; fi

      - name: Store administrator password as encrypted Worker secret
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.CINEVERSE_ADMIN_PASSWORD }}
        run: printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@latest secret put ADMIN_PASSWORD --config worker/wrangler.jsonc

      - name: Rotate session signing secret
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: openssl rand -hex 32 | npx --yes wrangler@latest secret put SESSION_SECRET --config worker/wrangler.jsonc

      - name: Store GitHub token as encrypted Worker secret
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CINEVERSE_GITHUB_TOKEN: ${{ secrets.CINEVERSE_GITHUB_TOKEN }}
        run: |
          printf '%s' "$CINEVERSE_GITHUB_TOKEN" | npx --yes wrangler@latest secret put GITHUB_TOKEN --config worker/wrangler.jsonc
