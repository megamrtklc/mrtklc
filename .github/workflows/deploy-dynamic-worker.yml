name: Deploy MRTSINEMA dynamic Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.assetsignore'
      - 'filmvediziler.json'
      - 'catalog-lite.json'
      - 'catalog-cast.json'
      - 'index.html'
      - 'app.js'
      - 'styles.css'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare deployment credentials
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployment."
            exit 0
          fi
      - name: Deploy dynamic site to Cloudflare Workers
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.166.0"
          command: deploy --config wrangler.jsonc
      - name: Smoke-test deployed dynamic pages
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        run: |
          BASE="https://mrtsinema-dynamic.megamrtklc.workers.dev"
          curl -fsS "$BASE/film/adalet-2/" | grep -q 'rel="canonical"'
          curl -fsS "$BASE/oyuncu/haluk-bilginer/" | grep -q 'ProfilePage'
          curl -fsS "$BASE/sitemap.xml" | grep -q '/film/adalet-2/'
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/film/adalet-2.html")
          test "$STATUS" = "301"
