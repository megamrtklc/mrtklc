name: Lighthouse Performance Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-audit.yml'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    name: Lighthouse mobile and desktop audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.14.0

      - name: Wait for Pages deployment
        run: sleep 45

      - name: Audit mobile experience
        run: |
          lhci autorun \
            --collect.url=https://megamrtklc.github.io/mrtklc/ \
            --collect.numberOfRuns=3 \
            --upload.target=temporary-public-storage

      - name: Print mobile audit scores
        run: node scripts/print-lighthouse-scores.mjs .lighthouseci

      - name: Audit desktop experience
        run: |
          lhci autorun \
            --collect.url=https://megamrtklc.github.io/mrtklc/ \
            --collect.numberOfRuns=3 \
            --collect.settings.preset=desktop \
            --upload.target=temporary-public-storage

      - name: Print desktop audit scores
        run: node scripts/print-lighthouse-scores.mjs .lighthouseci

