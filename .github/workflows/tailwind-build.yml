name: Build Tailwind CSS Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tailwind-build.yml'
      - 'tailwind.config.js'
      - 'src/tailwind.css'
      - 'index.html'
      - 'app.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tailwind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tailwind CLI
        run: npm install --no-save tailwindcss@3.4.17 terser
      - name: Build and commit production assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npx tailwindcss -c tailwind.config.js -i ./src/tailwind.css -o ./tailwind.css --minify
            npx terser app.js --compress --mangle --output app.min.js
            wc -c tailwind.css app.js app.min.js
            git add tailwind.css app.min.js
            if git diff --cached --quiet; then
              echo "Compiled assets are already current."
              exit 0
            fi
            git commit -m "Build production Tailwind CSS"
            if git push; then
              exit 0
            fi
            echo "Concurrent push detected; rebuilding from latest main (attempt $attempt)."
          done
          echo "Could not publish compiled assets after three attempts."
          exit 1
      - name: Upload compiled CSS
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-css-build
          path: tailwind.css
          if-no-files-found: error
          retention-days: 7
