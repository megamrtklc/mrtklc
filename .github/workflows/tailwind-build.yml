name: Build Tailwind CSS Artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tailwind-build.yml'
      - 'tailwind.config.js'
      - 'src/tailwind.css'
      - 'index.html'
      - 'app.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tailwind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tailwind CLI
        run: npm install --no-save tailwindcss@3.4.17 terser
      - name: Build production CSS
        run: npx tailwindcss -c tailwind.config.js -i ./src/tailwind.css -o ./tailwind.css --minify
      - name: Minify application JavaScript
        run: npx terser app.js --compress --mangle --output app.min.js
      - name: Report production asset sizes
        run: wc -c tailwind.css app.js app.min.js
      - name: Commit compiled CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailwind.css app.min.js
          if git diff --cached --quiet; then
            echo "Compiled CSS is unchanged."
            exit 0
          fi
          git commit -m "Build production Tailwind CSS"
          git fetch origin main
          git rebase origin/main
          git push
      - name: Upload compiled CSS
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-css-build
          path: tailwind.css
          if-no-files-found: error
          retention-days: 7
