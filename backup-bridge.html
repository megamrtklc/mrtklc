<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Perde güvenli yedek aktarımı</title>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#17191f;color:#eee;font:14px system-ui,sans-serif">
  <p id="status">Perde kişisel kayıtları güvenli şekilde aktarılıyor…</p>
<script>
(() => {
  'use strict';
  const ADMIN_ORIGIN = 'https://cineverse-admin.megamrtklc.workers.dev';
  const PREFIXES = ['cine_', 'perde_'];

  function readMatchingStorage(storage) {
    const values = {};
    try {
      for (let index = 0; index < storage.length; index += 1) {
        const key = storage.key(index);
        if (key && PREFIXES.some(prefix => key.startsWith(prefix))) {
          values[key] = storage.getItem(key);
        }
      }
    } catch (error) {
      return { error: 'Tarayıcı kayıtları okunamadı: ' + String(error && error.message || error) };
    }
    return values;
  }

  function replaceMatchingStorage(storage, incoming, previous) {
    if (!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) {
      throw new Error('Yedek tarayıcı verisi geçersiz.');
    }
    const entries = Object.entries(incoming);
    if (entries.some(([key, value]) =>
      typeof key !== 'string' ||
      !PREFIXES.some(prefix => key.startsWith(prefix)) ||
      typeof value !== 'string'
    )) {
      throw new Error('Yedekte izin verilmeyen kayıt anahtarı veya veri biçimi var.');
    }
    if (!previous || previous.error) throw new Error('Geri alma için önceki kayıt kopyası bulunamadı.');
    Object.keys(previous).forEach(key => storage.removeItem(key));
    entries.forEach(([key, value]) => storage.setItem(key, value));
  }

  function respond(target, type, requestId, payload) {
    target.postMessage({ type, requestId, ...payload }, ADMIN_ORIGIN);
    const status = document.getElementById('status');
    if (status) status.textContent = payload.error ? 'Aktarım tamamlanamadı.' : 'Aktarım tamamlandı. Bu pencere kapanıyor…';
    setTimeout(() => { try { window.close(); } catch (_) {} }, 350);
  }

  window.addEventListener('message', event => {
    if (event.origin !== ADMIN_ORIGIN || event.source !== window.opener) return;
    if (!event.data || typeof event.data.requestId !== 'string' || event.data.requestId.length > 160) return;

    if (event.data.type === 'PERDE_BACKUP_EXPORT_REQUEST') {
      const localStorageData = readMatchingStorage(window.localStorage);
      const sessionStorageData = readMatchingStorage(window.sessionStorage);
      if (localStorageData.error || sessionStorageData.error) {
        respond(event.source, 'PERDE_BACKUP_EXPORT_RESPONSE', event.data.requestId, {
          error: localStorageData.error || sessionStorageData.error
        });
        return;
      }
      respond(event.source, 'PERDE_BACKUP_EXPORT_RESPONSE', event.data.requestId, {
        browserData: { localStorage: localStorageData, sessionStorage: sessionStorageData }
      });
      return;
    }

    if (event.data.type === 'PERDE_BACKUP_RESTORE_REQUEST') {
      const data = event.data.browserData;
      let previousLocal = null;
      let previousSession = null;
      try {
        if (!data || typeof data !== 'object') throw new Error('Yedek tarayıcı verisi bulunamadı.');
        previousLocal = readMatchingStorage(window.localStorage);
        previousSession = readMatchingStorage(window.sessionStorage);
        if (previousLocal.error || previousSession.error) throw new Error(previousLocal.error || previousSession.error);
        replaceMatchingStorage(window.localStorage, data.localStorage || {}, previousLocal);
        replaceMatchingStorage(window.sessionStorage, data.sessionStorage || {}, previousSession);
        respond(event.source, 'PERDE_BACKUP_RESTORE_RESPONSE', event.data.requestId, {
          ok: true,
          previousBrowserData: { localStorage: previousLocal, sessionStorage: previousSession }
        });
      } catch (error) {
        try {
          if (previousLocal && !previousLocal.error) {
            Object.keys(readMatchingStorage(window.localStorage)).forEach(key => window.localStorage.removeItem(key));
            Object.entries(previousLocal).forEach(([key, value]) => window.localStorage.setItem(key, value));
          }
          if (previousSession && !previousSession.error) {
            Object.keys(readMatchingStorage(window.sessionStorage)).forEach(key => window.sessionStorage.removeItem(key));
            Object.entries(previousSession).forEach(([key, value]) => window.sessionStorage.setItem(key, value));
          }
        } catch (rollbackError) {
          respond(event.source, 'PERDE_BACKUP_RESTORE_RESPONSE', event.data.requestId, {
            error: 'Geri yükleme başarısız; otomatik geri alma da tamamlanamadı: ' + String(rollbackError && rollbackError.message || rollbackError)
          });
          return;
        }
        respond(event.source, 'PERDE_BACKUP_RESTORE_RESPONSE', event.data.requestId, {
          error: String(error && error.message || error)
        });
      }
    }
  });

  if (window.opener && !window.opener.closed) {
    window.opener.postMessage({ type: 'PERDE_BACKUP_BRIDGE_READY' }, ADMIN_ORIGIN);
  } else {
    const status = document.getElementById('status');
    if (status) status.textContent = 'Bu aktarım penceresi yönetim panelinden açılmalıdır.';
  }
})();
</script>
</body>
</html>
