<!DOCTYPE html>
<html lang="tr" :class="theme === 'dark' ? 'dark' : ''" x-data="ultimateProApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse Ultimate Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            red: '#E50914',
                            accent: '#F43F5E',
                            dark: '#0B0D11',
                            card: '#161922'
                        },
                        ivory: {
                            50: '#FAF8F5',
                            100: '#F5F2EB',
                            200: '#EBE7DD',
                            card: '#FFFDF9'
                        },
                        slateLight: {
                            50: '#F4F5F7',
                            100: '#EAECEF',
                            200: '#D8DBE2',
                            card: '#FFFFFF'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body :class="getBodyClass()" class="text-gray-900 dark:text-slate-100 font-sans min-h-screen flex flex-col selection:bg-rose-600 selection:text-white transition-colors duration-300">

    <!-- Header / Top Navbar (Full Width) -->
    <header :class="getHeaderClass()" class="sticky top-0 z-50 backdrop-blur-md border-b transition-colors duration-300">
        <div class="w-full px-6 sm:px-12 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <a href="#" @click.prevent="navigateTo('home')" class="flex items-center space-x-2.5 group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-rose-500 flex items-center justify-center shadow-lg shadow-rose-600/30 group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-film text-white text-sm"></i>
                    </div>
                    <span class="text-xl font-black tracking-wider uppercase">CINE<span class="text-rose-600">VERSE</span></span>
                </a>
                
                <nav class="hidden md:flex items-center space-x-6 text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400">
                    <a href="#" @click.prevent="navigateTo('home')" :class="currentPage === 'home' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors">Ana Sayfa</a>
                    <a href="#" @click.prevent="navigateTo('explore')" :class="currentPage === 'explore' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors">Keşfet</a>
                    <a href="#" @click.prevent="navigateTo('watchlist')" :class="currentPage === 'watchlist' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors flex items-center space-x-1.5">
                        <span>İzleme Listem</span>
                        <span class="px-1.5 py-0.2 bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-full text-[10px]" x-text="watchlist.length"></span>
                    </a>
                </nav>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="relative hidden sm:block">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" x-model="searchQuery" placeholder="Film veya dizi ara..." :class="getSearchClass()" class="border rounded-lg pl-9 pr-3 py-1.5 text-xs text-gray-900 dark:text-gray-200 placeholder-gray-500 focus:outline-none focus:border-rose-600 w-60 transition-all">
                </div>

                <!-- 3'LÜ TEMA SEÇİCİ DROPDOWN -->
                <div class="relative" x-data="{ openThemeMenu: false }">
                    <button @click="openThemeMenu = !openThemeMenu" :class="getButtonClass()" class="px-3 h-9 rounded-lg border flex items-center space-x-2 text-xs font-bold transition-colors shadow-sm">
                        <i :class="getThemeIcon()"></i>
                        <span class="hidden sm:inline" x-text="getThemeName()"></span>
                        <i class="fa-solid fa-chevron-down text-[10px] opacity-70"></i>
                    </button>

                    <div x-show="openThemeMenu" @click.away="openThemeMenu = false" class="absolute right-0 mt-2 w-48 bg-white dark:bg-[#161922] border border-gray-200 dark:border-gray-800 rounded-xl shadow-xl py-2 z-50 space-y-1">
                        <button @click="setTheme('ivory'); openThemeMenu = false;" class="w-full text-left px-4 py-2 text-xs font-semibold flex items-center space-x-2.5 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200">
                            <i class="fa-solid fa-sun text-amber-500"></i>
                            <span>Fil Dişi (Sıcak Krem)</span>
                        </button>
                        <button @click="setTheme('slate'); openThemeMenu = false;" class="w-full text-left px-4 py-2 text-xs font-semibold flex items-center space-x-2.5 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200">
                            <i class="fa-solid fa-circle-half-stroke text-sky-500"></i>
                            <span>Modern Gri (Slate)</span>
                        </button>
                        <button @click="setTheme('dark'); openThemeMenu = false;" class="w-full text-left px-4 py-2 text-xs font-semibold flex items-center space-x-2.5 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200">
                            <i class="fa-solid fa-moon text-indigo-400"></i>
                            <span>Karanlık Mod</span>
                        </button>
                    </div>
                </div>

                <!-- Profil Seçici -->
                <div :class="getCardClass()" class="flex items-center space-x-2 border rounded-lg px-2.5 py-1">
                    <img :src="currentProfile.avatar" class="w-6 h-6 rounded-full object-cover">
                    <select x-model="currentProfileId" @change="switchProfile($event.target.value)" class="bg-transparent text-xs font-bold text-gray-900 dark:text-white focus:outline-none cursor-pointer">
                        <template x-for="pro in profiles" :key="pro.id">
                            <option :value="pro.id" x-text="pro.name" class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white"></option>
                        </template>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow w-full">
        
        <!-- ==================== HOME PAGE ==================== -->
        <template x-if="currentPage === 'home'">
            <div class="w-full space-y-10 pb-16">
                
                <!-- HERO BANNER (Tüm Modlar İçin Ortak ve Kusursuz Sinematik Manşet) -->
                <section class="relative w-full bg-gray-950 min-h-[580px] sm:min-h-[640px] flex flex-col justify-between overflow-hidden select-none border-b border-gray-200 dark:border-gray-800/80">
                    
                    <!-- Main Hero Stage -->
                    <div class="relative w-full flex-grow flex items-center px-6 sm:px-12 py-12">
                        <!-- Backdrop Image -->
                        <div class="absolute inset-0 z-0">
                            <img :src="currentHero.backdrop" class="w-full h-full object-cover object-center filter brightness-[0.7]">
                            <!-- Sabit Sinematik Koyu Gradyan Perdesi (Her Modda Görseli ve Yazıyı Mükemmel Gösterir) -->
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/60 to-transparent"></div>
                            <div class="absolute inset-0 bg-gradient-to-r from-gray-950/90 via-gray-950/50 to-transparent"></div>
                        </div>

                        <!-- Left Info Container (Her modda sabit beyaz metinler ve net okunabilirlik) -->
                        <div class="relative z-10 max-w-2xl space-y-4 text-white">
                            <!-- Title -->
                            <h1 class="text-3xl sm:text-5xl lg:text-6xl font-black text-rose-500 tracking-tight leading-none drop-shadow-md" x-text="currentHero.title"></h1>
                            
                            <!-- Star Rating & Year -->
                            <div class="flex items-center space-x-3 text-xs sm:text-sm font-bold">
                                <div class="flex items-center space-x-1 text-amber-400">
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star-half-stroke"></i>
                                </div>
                                <span class="text-amber-400 font-extrabold" x-text="currentHero.rating"></span>
                                <span class="text-gray-400">•</span>
                                <span class="text-gray-200 font-semibold" x-text="currentHero.year"></span>
                                <span class="text-gray-400">•</span>
                                <span class="px-2 py-0.5 bg-rose-600/30 text-rose-300 border border-rose-500/40 rounded text-[10px] font-black uppercase" x-text="currentHero.genre"></span>
                            </div>

                            <!-- Starring -->
                            <p class="text-gray-200 text-xs sm:text-sm">
                                <strong class="text-white font-bold">Starring:</strong> 
                                <span x-text="currentHero.starring"></span>
                            </p>

                            <!-- Introduction -->
                            <p class="text-gray-200 text-xs sm:text-sm leading-relaxed line-clamp-3 max-w-xl">
                                <strong class="text-white font-bold">Introduction:</strong> 
                                <span x-text="currentHero.desc"></span>
                            </p>

                            <!-- Buttons -->
                            <div class="flex items-center space-x-4 pt-3">
                                <button @click="openWatchPage(currentHero)" class="px-8 py-3 bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-600 text-white font-bold text-xs uppercase tracking-wider rounded-full shadow-lg shadow-rose-600/40 transition-all transform hover:scale-105 flex items-center space-x-2.5">
                                    <i class="fa-solid fa-play text-xs"></i>
                                    <span>Play</span>
                                </button>

                                <button @click="toggleWatchlist(currentHero)" class="px-7 py-3 bg-black/40 hover:bg-rose-600/20 border border-rose-500/50 hover:border-rose-500 text-white font-bold text-xs uppercase tracking-wider rounded-full backdrop-blur-md transition-all flex items-center space-x-2">
                                    <i :class="isInWatchlist(currentHero) ? 'fa-solid fa-bookmark text-rose-500' : 'fa-regular fa-bookmark'"></i>
                                    <span x-text="isInWatchlist(currentHero) ? 'Collection (Added)' : 'Collection'"></span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Hero Bottom Thumbnails Carousel -->
                    <div class="relative z-10 w-full bg-gradient-to-t from-black/80 to-transparent pt-4 pb-6 px-6 sm:px-12">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold uppercase tracking-widest text-gray-300">Featured Marvel & Action Collection</span>
                            <div class="flex space-x-1.5">
                                <button @click="scrollHeroThumbs(-1)" class="w-7 h-7 rounded-full bg-black/60 border border-gray-700 hover:bg-rose-600 hover:border-rose-600 text-white flex items-center justify-center text-xs transition-colors">
                                    <i class="fa-solid fa-chevron-left"></i>
                                </button>
                                <button @click="scrollHeroThumbs(1)" class="w-7 h-7 rounded-full bg-black/60 border border-gray-700 hover:bg-rose-600 hover:border-rose-600 text-white flex items-center justify-center text-xs transition-colors">
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>

                        <div id="heroThumbContainer" class="flex items-center space-x-4 overflow-x-auto no-scrollbar scroll-smooth py-1">
                            <template x-for="(item, idx) in heroSlides" :key="item.id">
                                <div @click="selectHeroSlide(idx)" 
                                     :class="currentSlideIndex === idx ? 'ring-2 ring-rose-500 border-rose-500' : 'border-gray-800 opacity-75 hover:opacity-100'"
                                     class="flex-shrink-0 w-32 sm:w-36 cursor-pointer group bg-gray-900 rounded-xl overflow-hidden border p-1.5 transition-all duration-300 shadow-sm">
                                    <div class="w-full aspect-[2/3] rounded-lg overflow-hidden bg-black mb-1.5">
                                        <img :src="item.poster" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                                    </div>
                                    <h4 class="text-[11px] font-bold text-center text-white line-clamp-1 group-hover:text-rose-500 transition-colors" x-text="item.title"></h4>
                                </div>
                            </template>
                        </div>
                    </div>
                </section>

                <!-- Film & Dizi Katalog -->
                <section class="w-full px-6 sm:px-12 space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-200 dark:border-gray-800 pb-4">
                        <div>
                            <h2 class="text-xl font-black uppercase tracking-wider text-gray-900 dark:text-white">Tüm Yapımlar & Trendler</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Tam ekran arşiv kataloğu</p>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <select x-model="quickFilter" :class="getCardClass()" class="border rounded-lg px-3 py-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300 focus:outline-none focus:border-rose-600">
                                <option value="all">Tümü</option>
                                <option value="imdb8">IMDb 8+</option>
                                <option value="series">Diziler</option>
                                <option value="movies">Filmler</option>
                            </select>
                            <select x-model="sortBy" :class="getCardClass()" class="border rounded-lg px-3 py-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300 focus:outline-none focus:border-rose-600">
                                <option value="default">Sıralama: Önerilen</option>
                                <option value="rating">En Yüksek Puan</option>
                                <option value="year">En Yeni Yıl</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-7 gap-4">
                        <template x-for="item in sortedFilteredCatalog" :key="item.id">
                            <div @click="openWatchPage(item)" :class="getCardClass()" class="group rounded-xl overflow-hidden border hover:border-rose-600 transition-all duration-300 cursor-pointer flex flex-col shadow-sm">
                                <div class="relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
                                    <img :src="item.poster" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    <div class="absolute top-2 right-2 bg-black/80 backdrop-blur-md px-2 py-0.5 rounded text-[10px] font-bold text-amber-400 flex items-center space-x-1">
                                        <i class="fa-solid fa-star text-[9px]"></i>
                                        <span x-text="item.rating"></span>
                                    </div>
                                    <button @click.stop="toggleWatchlist(item)" class="absolute top-2 left-2 w-7 h-7 rounded bg-black/70 backdrop-blur-md flex items-center justify-center text-gray-200 hover:text-rose-500 transition-colors">
                                        <i :class="isInWatchlist(item) ? 'fa-solid fa-bookmark text-rose-500' : 'fa-regular fa-bookmark text-xs'"></i>
                                    </button>
                                </div>
                                <div class="p-3 flex flex-col flex-grow justify-between space-y-1">
                                    <div>
                                        <span class="text-[9px] font-bold text-rose-500 uppercase" x-text="item.genre"></span>
                                        <h3 class="font-bold text-xs text-gray-900 dark:text-white line-clamp-1 group-hover:text-rose-500 transition-colors" x-text="item.title"></h3>
                                    </div>
                                    <div class="flex items-center justify-between text-[10px] text-gray-500 dark:text-gray-400 pt-1 border-t border-gray-200 dark:border-gray-800/60">
                                        <span x-text="item.year"></span>
                                        <span x-text="item.duration"></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </section>
            </div>
        </template>

        <!-- ==================== WATCH / DETAIL PAGE ==================== -->
        <template x-if="currentPage === 'watch'">
            <div class="w-full px-6 sm:px-12 pt-6 space-y-6 pb-16">
                <button @click="navigateTo('home')" class="flex items-center space-x-2 text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 hover:text-rose-500 transition-colors">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    <span>Ana Sayfaya Dön</span>
                </button>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    
                    <!-- Left Section -->
                    <div class="lg:col-span-8 space-y-6">
                        
                        <!-- Custom Video Player -->
                        <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-black shadow-2xl border border-gray-200 dark:border-gray-800 group select-none">
                            <video id="customVideoPlayer" 
                                   class="w-full h-full object-cover" 
                                   :poster="selectedItem.backdrop"
                                   @timeupdate="updateVideoProgress"
                                   @ended="videoEnded = true">
                                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                                Tarayıcınız video etiketini desteklemiyor.
                            </video>

                            <!-- Overlay Controls -->
                            <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/95 via-black/80 to-transparent p-4 flex flex-col justify-end space-y-2">
                                <div class="flex items-center justify-between mb-1">
                                    <div class="flex items-center space-x-2">
                                        <span class="px-2.5 py-0.5 rounded bg-rose-600 text-white text-[10px] font-black uppercase" x-text="selectedItem.title"></span>
                                        <span class="text-xs text-gray-300 font-semibold" x-show="selectedItem.type === 'tv'" x-text="'Sezon ' + selectedSeason + ' • Bölüm ' + selectedEpisode"></span>
                                        <span class="text-xs text-gray-300 font-semibold" x-show="selectedItem.type === 'movie'">Sinema Modu</span>
                                    </div>
                                    <button @click="skipIntro()" class="px-3 py-1 rounded bg-white/20 hover:bg-white/30 backdrop-blur-md text-white text-xs font-bold border border-white/30 transition-all flex items-center space-x-1.5">
                                        <i class="fa-solid fa-forward text-[10px]"></i>
                                        <span>Jeneriği Geç</span>
                                    </button>
                                </div>

                                <!-- Progress Bar -->
                                <div class="w-full bg-white/30 h-2 rounded-full cursor-pointer relative overflow-hidden group/bar" @click="seekVideo($event)">
                                    <div class="bg-rose-600 h-full rounded-full transition-all relative" :style="'width: ' + videoProgress + '%'">
                                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-white rounded-full shadow scale-0 group-hover/bar:scale-100 transition-transform"></div>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between text-xs text-gray-200 pt-1">
                                    <div class="flex items-center space-x-3">
                                        <button @click="togglePlay()" class="w-9 h-9 rounded-lg bg-rose-600 hover:bg-rose-700 text-white flex items-center justify-center shadow transition-all hover:scale-105">
                                            <i :class="isPlaying ? 'fa-solid fa-pause text-sm' : 'fa-solid fa-play text-sm ml-0.5'"></i>
                                        </button>
                                        <button @click="skipTime(-10)" class="w-8 h-8 rounded bg-gray-800/80 hover:bg-gray-700 text-white flex items-center justify-center transition-all" title="10s Geri">
                                            <i class="fa-solid fa-rotate-left text-xs"></i>
                                        </button>
                                        <button @click="skipTime(10)" class="w-8 h-8 rounded bg-gray-800/80 hover:bg-gray-700 text-white flex items-center justify-center transition-all" title="10s İleri">
                                            <i class="fa-solid fa-rotate-right text-xs"></i>
                                        </button>
                                        <span class="font-mono text-xs font-bold text-gray-300" x-text="currentTimeFormatted + ' / ' + durationFormatted"></span>
                                    </div>

                                    <div class="flex items-center space-x-2">
                                        <button @click="toggleMute()" class="w-8 h-8 rounded bg-gray-800/80 hover:bg-gray-700 text-white flex items-center justify-center transition-all">
                                            <i :class="isMuted ? 'fa-solid fa-volume-xmark text-xs text-rose-500' : 'fa-solid fa-volume-high text-xs'"></i>
                                        </button>
                                        <button @click="toggleFullscreen()" class="w-8 h-8 rounded bg-gray-800/80 hover:bg-gray-700 text-white flex items-center justify-center transition-all">
                                            <i class="fa-solid fa-expand text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Dizi Sezon Seçimi -->
                        <div x-show="selectedItem.type === 'tv'" :class="getCardClass()" class="p-4 rounded-xl border flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm">
                            <div class="flex items-center space-x-3">
                                <div class="w-9 h-9 rounded-lg bg-rose-600/20 text-rose-500 flex items-center justify-center font-black text-sm">
                                    <i class="fa-solid fa-tv"></i>
                                </div>
                                <div>
                                    <h3 class="text-xs font-black uppercase tracking-wider text-gray-900 dark:text-white">Sezon Seçimi</h3>
                                    <p class="text-[11px] text-gray-500 dark:text-gray-400">İzlemek istediğiniz sezonu belirleyin</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2 w-full sm:w-auto">
                                <select x-model="selectedSeason" :class="getCardClass()" class="border rounded-lg px-4 py-2 text-xs font-bold text-gray-900 dark:text-white focus:outline-none focus:border-rose-600">
                                    <template x-for="s in [1, 2, 3, 4, 5, 6]" :key="s">
                                        <option :value="s" x-text="s + '. Sezon'"></option>
                                    </template>
                                </select>
                            </div>
                        </div>

                        <!-- Sezon Bölümleri -->
                        <div x-show="selectedItem.type === 'tv'" :class="getCardClass()" class="p-5 rounded-2xl border space-y-4 shadow-sm">
                            <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-800 pb-3">
                                <h3 class="text-xs font-black uppercase tracking-wider text-gray-900 dark:text-white flex items-center space-x-2">
                                    <i class="fa-solid fa-film text-rose-600 text-xs"></i>
                                    <span x-text="selectedSeason + '. Sezon Bölümleri'"></span>
                                </h3>
                                <span class="text-xs text-gray-500 dark:text-gray-400 font-semibold" x-text="'Toplam ' + getEpisodesForSeason(selectedSeason).length + ' Bölüm'"></span>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                                <template x-for="ep in paginatedEpisodes" :key="ep.number">
                                    <div @click="selectEpisode(ep.number)" 
                                         :class="selectedEpisode === ep.number ? 'border-rose-600 bg-rose-600/10' : 'border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900 hover:border-gray-300 dark:hover:border-gray-700'"
                                         class="p-2.5 rounded-xl border flex flex-col justify-between cursor-pointer transition-all space-y-2 group">
                                        <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-black border border-gray-200 dark:border-gray-800">
                                            <img :src="ep.still" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                            <span class="absolute bottom-1 right-1 bg-black/80 backdrop-blur px-1.5 py-0.5 rounded text-[9px] font-bold text-gray-300" x-text="ep.duration"></span>
                                        </div>
                                        <div class="space-y-1">
                                            <div class="flex items-center justify-between">

                get paginatedEpisodes() {
                    const eps = this.getEpisodesForSeason(this.selectedSeason);
                    const start = (this.currentEpisodePage - 1) * 8;
                    return eps.slice(start, start + 8);
                },

                get totalEpisodePages() {
                    const eps = this.getEpisodesForSeason(this.selectedSeason);
                    return Math.ceil(eps.length / 8);
                },

                selectEpisode(epNum) {
                    this.selectedEpisode = epNum;
                    const video = document.getElementById('customVideoPlayer');
                    if (video) {
                        video.currentTime = 0;
                        video.play();
                        this.isPlaying = true;
                    }
                },
                
                isPlaying: false,
                isMuted: false,
                videoProgress: 0,
                currentTimeFormatted: '00:00',
                durationFormatted: '00:00',
                videoEnded: false,

                togglePlay() {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video) return;
                    if (video.paused) {
                        video.play();
                        this.isPlaying = true;
                    } else {
                        video.pause();
                        this.isPlaying = false;
                    }
                },

                updateVideoProgress() {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video) return;
                    if (video.duration) {
                        this.videoProgress = (video.currentTime / video.duration) * 100;
                        this.currentTimeFormatted = this.formatTime(video.currentTime);
                        this.durationFormatted = this.formatTime(video.duration);

                        if (this.selectedItem) {
                            let progressMap = JSON.parse(localStorage.getItem('perde_player_progress_v3')) || {};
                            progressMap[this.selectedItem.id] = {
                                time: video.currentTime,
                                duration: video.duration,
                                savedAt: Date.now()
                            };
                            localStorage.setItem('perde_player_progress_v3', JSON.stringify(progressMap));
                        }
                    }
                },

                seekVideo(event) {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video || !video.duration) return;
                    const rect = event.currentTarget.getBoundingClientRect();
                    const pos = (event.clientX - rect.left) / rect.width;
                    video.currentTime = pos * video.duration;
                },

                skipTime(seconds) {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video) return;
                    video.currentTime += seconds;
                },

                skipIntro() {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video) return;
                    video.currentTime += 85;
                },

                toggleMute() {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video) return;
                    video.muted = !video.muted;
                    this.isMuted = video.muted;
                },

                toggleFullscreen() {
                    const playerContainer = document.getElementById('customVideoPlayer')?.parentElement;
                    if (!playerContainer) return;
                    if (!document.fullscreenElement) {
                        playerContainer.requestFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                },

                formatTime(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = Math.floor(seconds % 60);
                    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
                },

                scrollCast(direction) {
                    const container = document.getElementById('castContainer');
                    if (container) {
                        container.scrollBy({ left: 180 * direction, behavior: 'smooth' });
                    }
                },

                scrollSimilar(direction) {
                    const container = document.getElementById('similarContainer');
                    if (container) {
                        container.scrollBy({ left: 180 * direction, behavior: 'smooth' });
                    }
                },

                profiles: [
                    { id: 'pro_1', name: 'Ana Profil', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop' },
                    { id: 'pro_2', name: 'Çocuk Profili', avatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?q=80&w=200&auto=format&fit=crop' }
                ],
                currentProfileId: localStorage.getItem('cine_active_profile') || 'pro_1',

                get currentProfile() {
                    return this.profiles.find(p => p.id === this.currentProfileId) || this.profiles[0];
                },

                switchProfile(id) {
                    this.currentProfileId = id;
                    localStorage.setItem('cine_active_profile', id);
                },

                get watchlist() {
                    let allLists = JSON.parse(localStorage.getItem('cine_profile_watchlists')) || {};
                    return allLists[this.currentProfileId] || [];
                },
                get currentWatchlist() {
                    return this.watchlist;
                },

                toggleWatchlist(item) {
                    let allLists = JSON.parse(localStorage.getItem('cine_profile_watchlists')) || {};
                    if (!allLists[this.currentProfileId]) allLists[this.currentProfileId] = [];
                    let list = allLists[this.currentProfileId];
                    const index = list.findIndex(m => m.id === item.id);
                    if (index > -1) {
                        list.splice(index, 1);
                    } else {
                        list.push(item);
                    }
                    localStorage.setItem('cine_profile_watchlists', JSON.stringify(allLists));
                },

                isInWatchlist(item) {
                    return this.watchlist.some(m => m.id === item.id);
                },

                reviews: JSON.parse(localStorage.getItem('cine_reviews')) || {},

                getReviews(itemId) {
                    return this.reviews[itemId] || [];
                },

                submitReview() {
                    if (!this.userCommentText.trim() || !this.selectedItem) return;
                    if (!this.reviews[this.selectedItem.id]) {
                        this.reviews[this.selectedItem.id] = [];
                    }
                    this.reviews[this.selectedItem.id].unshift({
                        author: this.currentProfile.name,
                        rating: this.userRating,
                        comment: this.userCommentText,
                        date: new Date().toLocaleDateString()
                    });
                    localStorage.setItem('cine_reviews', JSON.stringify(this.reviews));
                    this.userCommentText = '';
                },

                navigateTo(page) {
                    this.currentPage = page;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                openWatchPage(item) {
                    this.selectedItem = item;
                    this.selectedSeason = 1;
                    this.selectedEpisode = 1;
                    this.currentEpisodePage = 1;
                    this.isPlaying = false;
                    this.videoProgress = 0;
                    this.currentPage = 'watch';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    
                    setTimeout(() => {
                        const video = document.getElementById('customVideoPlayer');
                        let progressMap = JSON.parse(localStorage.getItem('perde_player_progress_v3')) || {};
                        if (video && progressMap[item.id]) {
                            video.currentTime = progressMap[item.id].time || 0;
                        }
                    }, 200);
                },

                get sortedFilteredCatalog() {
                    let result = this.catalog.filter(item => {
                        const matchesSearch = item.title.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                              item.genre.toLowerCase().includes(this.searchQuery.toLowerCase());
                        let matchesQuick = true;
                        if (this.quickFilter === 'imdb8') matchesQuick = parseFloat(item.rating) >= 8.0;
                        if (this.quickFilter === 'series') matchesQuick = item.type === 'tv';
                        if (this.quickFilter === 'movies') matchesQuick = item.type === 'movie';
                        return matchesSearch && matchesQuick;
                    });

                    if (this.sortBy === 'rating') {
                        result.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
                    } else if (this.sortBy === 'year') {
                        result.sort((a, b) => parseInt(b.year) - parseInt(a.year));
                    }
                    return result;
                }
            }
        }
