<!DOCTYPE html>
<html lang="tr" :class="theme === 'dark' ? 'dark' : ''" x-data="ultimateProApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse Ultimate Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            red: '#E50914',
                            accent: '#F43F5E',
                            dark: '#0B0D11',
                            card: '#161922'
                        },
                        ivory: {
                            50: '#FAF8F5',
                            100: '#F5F2EB',
                            200: '#EBE7DD',
                            card: '#FFFDF9'
                        },
                        slateLight: {
                            50: '#F4F5F7',
                            100: '#EAECEF',
                            200: '#D8DBE2',
                            card: '#FFFFFF'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body :class="getBodyClass()" class="text-gray-900 dark:text-slate-100 font-sans min-h-screen flex flex-col selection:bg-rose-600 selection:text-white transition-colors duration-300">

    <!-- Header / Top Navbar (Full Width) -->
    <header :class="getHeaderClass()" class="sticky top-0 z-50 backdrop-blur-md border-b transition-colors duration-300">
        <div class="w-full px-6 sm:px-12 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <a href="#" @click.prevent="navigateTo('home')" class="flex items-center space-x-2.5 group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-rose-500 flex items-center justify-center shadow-lg shadow-rose-600/30 group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-film text-white text-sm"></i>
                    </div>
                    <span class="text-xl font-black tracking-wider uppercase">CINE<span class="text-rose-600">VERSE</span></span>
                </a>
                
                <nav class="hidden md:flex items-center space-x-6 text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400">
                    <a href="#" @click.prevent="navigateTo('home')" :class="currentPage === 'home' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors">Ana Sayfa</a>
                    <a href="#" @click.prevent="navigateTo('explore')" :class="currentPage === 'explore' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors">Keşfet</a>
                    <a href="#" @click.prevent="navigateTo('watchlist')" :class="currentPage === 'watchlist' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors flex items-center space-x-1.5">
                        <span>İzleme Listem</span>
                        <span class="px-1.5 py-0.2 bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-full text-[10px]" x-text="watchlist.length"></span>
                    </a>
                </nav>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="relative hidden sm:block">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" x-model="searchQuery" placeholder="Film veya dizi ara..." :class="getSearchClass()" class="border rounded-lg pl-9 pr-3 py-1.5 text-xs text-gray-900 dark:text-gray-200 placeholder-gray-500 focus:outline-none focus:border-rose-600 w-60 transition-all">
                </div>

                <!-- 3'LÜ TEMA SEÇİCİ DROPDOWN -->
                <div class="relative" x-data="{ openThemeMenu: false }">
                    <button @click="openThemeMenu = !openThemeMenu" :class="getButtonClass()" class="px-3 h-9 rounded-lg border flex items-center space-x-2 text-xs font-bold transition-colors shadow-sm">
                        <i :class="getThemeIcon()"></i>
                        <span class="hidden sm:inline" x-text="getThemeName()"></span>
                        <i class="fa-solid fa-chevron-down text-[10px] opacity-70"></i>
                    </button>

                    <div x-show="openThemeMenu" @click.away="openThemeMenu = false" class="absolute right-0 mt-2 w-48 bg-white dark:bg-[#161922] border border-gray-200 dark:border-gray-800 rounded-xl shadow-xl py-2 z-50 space-y-1">
                        <button @click="setTheme('ivory'); openThemeMenu = false;" class="w-full text-left px-4 py-2 text-xs font-semibold flex items-center space-x-2.5 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200">
                            <i class="fa-solid fa-sun text-amber-500"></i>
                            <span>Fil Dişi (Sıcak Krem)</span>
                        </button>
                        <button @click="setTheme('slate'); openThemeMenu = false;" class="w-full text-left px-4 py-2 text-xs font-semibold flex items-center space-x-2.5 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200">
                            <i class="fa-solid fa-circle-half-stroke text-sky-500"></i>
                            <span>Modern Gri (Slate)</span>
                        </button>
                        <button @click="setTheme('dark'); openThemeMenu = false;" class="w-full text-left px-4 py-2 text-xs font-semibold flex items-center space-x-2.5 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200">
                            <i class="fa-solid fa-moon text-indigo-400"></i>
                            <span>Karanlık Mod</span>
                        </button>
                    </div>
                </div>

                <!-- Profil Seçici -->
                <div :class="getCardClass()" class="flex items-center space-x-2 border rounded-lg px-2.5 py-1">
                    <img :src="currentProfile.avatar" class="w-6 h-6 rounded-full object-cover">
                    <select x-model="currentProfileId" @change="switchProfile($event.target.value)" class="bg-transparent text-xs font-bold text-gray-900 dark:text-white focus:outline-none cursor-pointer">
                        <template x-for="pro in profiles" :key="pro.id">
                            <option :value="pro.id" x-text="pro.name" class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white"></option>
                        </template>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow w-full">
        
        <!-- ==================== HOME PAGE ==================== -->
        <template x-if="currentPage === 'home'">
            <div class="w-full space-y-10 pb-16">
                
                <!-- HERO BANNER (Tüm Modlar İçin Ortak ve Kusursuz Sinematik Manşet) -->
                <section class="relative w-full bg-gray-950 min-h-[580px] sm:min-h-[640px] flex flex-col justify-between overflow-hidden select-none border-b border-gray-200 dark:border-gray-800/80">
                    
                    <!-- Main Hero Stage -->
                    <div class="relative w-full flex-grow flex items-center px-6 sm:px-12 py-12">
                        <!-- Backdrop Image -->
                        <div class="absolute inset-0 z-0">
                            <img :src="currentHero.backdrop" class="w-full h-full object-cover object-center filter brightness-[0.7]">
                            <!-- Sabit Sinematik Koyu Gradyan Perdesi (Her Modda Görseli ve Yazıyı Mükemmel Gösterir) -->
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/60 to-transparent"></div>
                            <div class="absolute inset-0 bg-gradient-to-r from-gray-950/90 via-gray-950/50 to-transparent"></div>
                        </div>

                        <!-- Left Info Container (Her modda sabit beyaz metinler ve net okunabilirlik) -->
                        <div class="relative z-10 max-w-2xl space-y-4 text-white">
                            <!-- Title -->
                            <h1 class="text-3xl sm:text-5xl lg:text-6xl font-black text-rose-500 tracking-tight leading-none drop-shadow-md" x-text="currentHero.title"></h1>
                            
                            <!-- Star Rating & Year -->
                            <div class="flex items-center space-x-3 text-xs sm:text-sm font-bold">
                                <div class="flex items-center space-x-1 text-amber-400">
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star-half-stroke"></i>
                                </div>
                                <span class="text-amber-400 font-extrabold" x-text="currentHero.rating"></span>
                                <span class="text-gray-400">•</span>
                                <span class="text-gray-200 font-semibold" x-text="currentHero.year"></span>
                                <span class="text-gray-400">•</span>
                                <span class="px-2 py-0.5 bg-rose-600/30 text-rose-300 border border-rose-500/40 rounded text-[10px] font-black uppercase" x-text="currentHero.genre"></span>
                            </div>

                            <!-- Starring -->
                            <p class="text-gray-200 text-xs sm:text-sm">
                                <strong class="text-white font-bold">Starring:</strong> 
                                <span x-text="currentHero.starring"></span>
                            </p>

                            <!-- Introduction -->
                            <p class="text-gray-200 text-xs sm:text-sm leading-relaxed line-clamp-3 max-w-xl">
                                <strong class="text-white font-bold">Introduction:</strong> 
                                <span x-text="currentHero.desc"></span>
                            </p>

                            <!-- Buttons -->
                            <div class="flex items-center space-x-4 pt-3">
                                <button @click="openWatchPage(currentHero)" class="px-8 py-3 bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-600 text-white font-bold text-xs uppercase tracking-wider rounded-full shadow-lg shadow-rose-600/40 transition-all transform hover:scale-105 flex items-center space-x-2.5">
                                    <i class="fa-solid fa-play text-xs"></i>
                                    <span>Play</span>
                                </button>

                                <button @click="toggleWatchlist(currentHero)" class="px-7 py-3 bg-black/40 hover:bg-rose-600/20 border border-rose-500/50 hover:border-rose-500 text-white font-bold text-xs uppercase tracking-wider rounded-full backdrop-blur-md transition-all flex items-center space-x-2">
                                    <i :class="isInWatchlist(currentHero) ? 'fa-solid fa-bookmark text-rose-500' : 'fa-regular fa-bookmark'"></i>
                                    <span x-text="isInWatchlist(currentHero) ? 'Collection (Added)' : 'Collection'"></span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Hero Bottom Thumbnails Carousel -->
                    <div class="relative z-10 w-full bg-gradient-to-t from-black/80 to-transparent pt-4 pb-6 px-6 sm:px-12">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold uppercase tracking-widest text-gray-300">Featured Marvel & Action Collection</span>
                            <div class="flex space-x-1.5">
                                <button @click="scrollHeroThumbs(-1)" class="w-7 h-7 rounded-full bg-black/60 border border-gray-700 hover:bg-rose-600 hover:border-rose-600 text-white flex items-center justify-center text-xs transition-colors">
                                    <i class="fa-solid fa-chevron-left"></i>
                                </button>
                                <button @click="scrollHeroThumbs(1)" class="w-7 h-7 rounded-full bg-black/60 border border-gray-700 hover:bg-rose-600 hover:border-rose-600 text-white flex items-center justify-center text-xs transition-colors">
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>

                        <div id="heroThumbContainer" class="flex items-center space-x-4 overflow-x-auto no-scrollbar scroll-smooth py-1">
                            <template x-for="(item, idx) in heroSlides" :key="item.id">
                                <div @click="selectHeroSlide(idx)" 
                                     :class="currentSlideIndex === idx ? 'ring-2 ring-rose-500 border-rose-500' : 'border-gray-800 opacity-75 hover:opacity-100'"
                                     class="flex-shrink-0 w-32 sm:w-36 cursor-pointer group bg-gray-900 rounded-xl overflow-hidden border p-1.5 transition-all duration-300 shadow-sm">
                                    <div class="w-full aspect-[2/3] rounded-lg overflow-hidden bg-black mb-1.5">
                                        <img :src="item.poster" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                                    </div>
                                    <h4 class="text-[11px] font-bold text-center text-white line-clamp-1 group-hover:text-rose-500 transition-colors" x-text="item.title"></h4>
                                </div>
                            </template>
                        </div>
                    </div>
                </section>

                <!-- Film & Dizi Katalog -->
                <section class="w-full px-6 sm:px-12 space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-200 dark:border-gray-800 pb-4">
                        <div>
                            <h2 class="text-xl font-black uppercase tracking-wider text-gray-900 dark:text-white">Tüm Yapımlar & Trendler</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Tam ekran arşiv kataloğu</p>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <select x-model="quickFilter" :class="getCardClass()" class="border rounded-lg px-3 py-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300 focus:outline-none focus:border-rose-600">
                                <option value="all">Tümü</option>
                                <option value="imdb8">IMDb 8+</option>
                                <option value="series">Diziler</option>
                                <option value="movies">Filmler</option>
                            </select>
                            <select x-model="sortBy" :class="getCardClass()" class="border rounded-lg px-3 py-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300 focus:outline-none focus:border-rose-600">
                                <option value="default">Sıralama: Önerilen</option>
                                <option value="rating">En Yüksek Puan</option>
                                <option value="year">En Yeni Yıl</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-7 gap-4">
                        <template x-for="item in sortedFilteredCatalog" :key="item.id">
                            <div @click="openWatchPage(item)" :class="getCardClass()" class="group rounded-xl overflow-hidden border hover:border-rose-600 transition-all duration-300 cursor-pointer flex flex-col shadow-sm">
                                <div class="relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
                                    <img :src="item.poster" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    <div class="absolute top-2 right-2 bg-black/80 backdrop-blur-md px-2 py-0.5 rounded text-[10px] font-bold text-amber-400 flex items-center space-x-1">
                                        <i class="fa-solid fa-star text-[9px]"></i>
                                        <span x-text="item.rating"></span>
                                    </div>
                                    <button @click.stop="toggleWatchlist(item)" class="absolute top-2 left-2 w-7 h-7 rounded bg-black/70 backdrop-blur-md flex items-center justify-center text-gray-200 hover:text-rose-500 transition-colors">
                                        <i :class="isInWatchlist(item) ? 'fa-solid fa-bookmark text-rose-500' : 'fa-regular fa-bookmark text-xs'"></i>
                                    </button>
                                </div>
                                <div class="p-3 flex flex-col flex-grow justify-between space-y-1">
                                    <div>
                                        <span class="text-[9px] font-bold text-rose-500 uppercase" x-text="item.genre"></span>
                                        <h3 class="font-bold text-xs text-gray-900 dark:text-white line-clamp-1 group-hover:text-rose-500 transition-colors" x-text="item.title"></h3>
                                    </div>
                                    <div class="flex items-center justify-between text-[10px] text-gray-500 dark:text-gray-400 pt-1 border-t border-gray-200 dark:border-gray-800/60">
                                        <span x-text="item.year"></span>
                                        <span x-text="item.duration"></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </section>
            </div>
        </template>

        <!-- ==================== WATCH / DETAIL PAGE ==================== -->
        <template x-if="currentPage === 'watch'">
            <div class="w-full px-6 sm:px-12 pt-6 space-y-6 pb-16">
                <button @click="navigateTo('home')" class="flex items-center space-x-2 text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400 hover:text-rose-500 transition-colors">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    <span>Ana Sayfaya Dön</span>
                </button>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    
                    <!-- Left Section -->
                    <div class="lg:col-span-8 space-y-6">
                        
                        <!-- Custom Video Player -->
                        <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-black shadow-2xl border border-gray-200 dark:border-gray-800 group select-none" @mouseenter="showPlayerControls()" @mousemove="showPlayerControls()" @mouseleave="hidePlayerControlsOnLeave()">
                            <video id="customVideoPlayer"
                                   x-show="isDirectVideoUrl(selectedItem.watchUrl)"
                                   class="w-full h-full object-contain"
                                   :src="getPlaybackUrl()"
                                   :poster="selectedItem.backdrop"
                                   preload="metadata"
                                   playsinline
                                   @click="togglePlay(); showPlayerControls()"
                                   @loadedmetadata="updateVideoProgress"
                                   @timeupdate="updateVideoProgress"
                                   @play="isPlaying = true; hasPlaybackStarted = true; schedulePlayerControlsHide()"
                                   @pause="isPlaying = false; showPlayerControls()"
                                   @ended="videoEnded = true"
                                   @error="playbackError = true">
                                Tarayıcınız video etiketini desteklemiyor.
                            </video>
                            <div x-show="isDirectVideoUrl(selectedItem.watchUrl) && !hasPlaybackStarted" class="absolute inset-0 z-10 flex items-center justify-center bg-black cursor-pointer" @click.stop="startPlayback()">
                                <img :src="selectedItem.poster || selectedItem.backdrop" :alt="selectedItem.title + ' kapak görseli'" class="absolute inset-0 w-full h-full object-cover">
                                <div class="absolute inset-0 bg-black/25"></div>
                                <button type="button" @click.stop="startPlayback()" class="relative z-10 flex h-16 w-16 sm:h-20 sm:w-20 items-center justify-center rounded-full border border-white/50 bg-rose-600/90 text-white shadow-2xl backdrop-blur-sm transition-all hover:scale-110 hover:bg-rose-500" :aria-label="selectedItem.title + ' filmini oynat'">
                                    <i class="fa-solid fa-play text-2xl sm:text-3xl ml-1"></i>
                                </button>
                                <div class="absolute bottom-5 left-5 right-5 z-10 text-center text-white drop-shadow-lg">
                                    <div class="text-sm sm:text-base font-black" x-text="selectedItem.title"></div>
                                    <div class="mt-1 text-[10px] sm:text-xs font-semibold tracking-wider text-white/80">OYNATMAK İÇİN TIKLA</div>
                                </div>
                            </div>
                            <div x-show="!isDirectVideoUrl(selectedItem.watchUrl)" class="absolute inset-0 overflow-hidden bg-gray-950 text-white">
                                <img :src="selectedItem.poster || selectedItem.backdrop" :alt="selectedItem.title + ' afişi'" class="absolute inset-0 h-full w-full object-cover opacity-35 blur-[2px] scale-105">
                                <div class="absolute inset-0 bg-gradient-to-r from-gray-950/95 via-gray-950/75 to-gray-950/55"></div>
                                <div class="relative z-10 flex h-full flex-col sm:flex-row items-center justify-center gap-5 p-5 sm:p-8 text-center sm:text-left">
                                    <img :src="selectedItem.poster || selectedItem.backdrop" :alt="selectedItem.title + ' afişi'" class="h-44 sm:h-56 max-w-[38%] rounded-lg object-contain shadow-2xl ring-1 ring-white/15">
                                    <div class="max-w-md space-y-3">
                                        <div class="flex items-center justify-center sm:justify-start gap-2 text-rose-400">
                                            <i class="fa-solid fa-film"></i>
                                            <span class="text-[10px] font-black uppercase tracking-[0.2em]">CineVerse • Oynatıcı</span>
                                        </div>
                                        <h3 class="text-lg sm:text-xl font-black" x-text="selectedItem.title"></h3>
                                        <p class="text-xs leading-relaxed text-gray-300" x-text="selectedItem.watchUrl ? 'Bu kaynak yerleşik oynatıcıda açılamıyor. Harici platformdan izlemek için bağlantıyı açabilirsin.' : 'Bu yapım için henüz bir izleme bağlantısı eklenmemiş. Afiş, oynatıcı alanında kapak görseli olarak gösteriliyor.'"></p>
                                        <a x-show="selectedItem.watchUrl" :href="selectedItem.watchUrl" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 rounded-lg bg-rose-600 px-4 py-2 text-xs font-bold text-white hover:bg-rose-700">Kaynağı Aç <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                                    </div>
                                </div>
                            </div>

                            <div x-show="playbackError && isDirectVideoUrl(selectedItem.watchUrl)" class="absolute inset-x-0 top-4 mx-auto w-fit rounded-lg bg-red-950/90 px-4 py-2 text-xs font-semibold text-white shadow-lg">
                                Video kaynağı yüklenemedi. Bağlantıyı veya dosya erişimini kontrol et.
                            </div>

                            <!-- Overlay Controls -->
                            <div x-show="isDirectVideoUrl(selectedItem.watchUrl) && hasPlaybackStarted && playerControlsVisible" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0 translate-y-2" @click.stop class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/95 via-black/80 to-transparent p-4 flex flex-col justify-end space-y-2">
                                <div class="flex items-center justify-between mb-1">
                                    <div class="flex items-center space-x-2">
                                        <span class="px-2.5 py-0.5 rounded bg-rose-600 text-white text-[10px] font-black uppercase" x-text="selectedItem.title"></span>
                                        <span class="text-xs text-gray-300 font-semibold" x-show="selectedItem.type === 'tv'" x-text="'Sezon ' + selectedSeason + ' • Bölüm ' + selectedEpisode"></span>
                                        <span class="inline-flex items-center gap-1 rounded bg-emerald-500/20 border border-emerald-400/40 px-2 py-0.5 text-[10px] font-bold text-emerald-300"><i class="fa-solid fa-clapperboard"></i> SİNEMA MODU AKTİF</span>
                                    </div>
                                    <button @click="skipIntro()" class="px-3 py-1 rounded bg-white/20 hover:bg-white/30 backdrop-blur-md text-white text-xs font-bold border border-white/30 transition-all flex items-center space-x-1.5">
                                        <i class="fa-solid fa-forward text-[10px]"></i>
                                        <span>Jeneriği Geç</span>
                                    </button>
                                </div>

                                <!-- Progress Bar -->
                                <div class="w-full bg-white/30 h-2 hover:h-3 rounded-full cursor-pointer relative overflow-hidden group/bar transition-all duration-150" @click="seekVideo($event)">
                                    <div class="bg-rose-600 h-full rounded-full transition-all relative" :style="'width: ' + videoProgress + '%'">
                                        <div class="absolute right-0 top-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-white rounded-full shadow scale-0 group-hover/bar:scale-100 transition-transform"></div>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between text-xs text-gray-200 pt-1">
                                    <div class="flex items-center space-x-3">
                                        <button @click="togglePlay()" class="w-9 h-9 rounded-lg bg-rose-600 hover:bg-rose-700 text-white flex items-center justify-center shadow transition-all hover:scale-105">
                                            <i :class="isPlaying ? 'fa-solid fa-pause text-sm' : 'fa-solid fa-play text-sm ml-0.5'"></i>
                                        </button>

                            </div>

                <div x-show="currentWatchlist.length === 0" :class="getCardClass()" class="text-center py-16 rounded-2xl border max-w-md mx-auto space-y-4 shadow-sm">
                    <i class="fa-regular fa-bookmark text-4xl text-rose-600"></i>
                    <h3 class="font-bold text-base text-gray-900 dark:text-white">İzleme Listesi Boş</h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Beğendiğiniz yapımları 'Collection / Listeye Ekle' butonuna basarak ekleyebilirsiniz.</p>
                    <button @click="navigateTo('home')" class="px-6 py-2.5 bg-rose-600 text-white rounded-xl text-xs font-bold uppercase tracking-wider shadow hover:bg-rose-700 transition-colors">Ana Sayfaya Dön</button>

    <!-- Footer (Full Width) -->
    <footer :class="getHeaderClass()" class="border-t py-6 mt-auto w-full px-6 sm:px-12 transition-colors duration-300">
        <div class="w-full flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-gray-500 dark:text-gray-400">
            <div class="flex items-center space-x-2">
                <span class="font-black uppercase tracking-widest text-gray-900 dark:text-white text-base">CINE<span class="text-rose-600">VERSE</span></span>
                <span :class="getCardClass()" class="text-[10px] px-2 py-0.5 rounded text-gray-600 dark:text-gray-400 border">PRO</span>
            </div>
            <div class="flex space-x-6 font-bold uppercase tracking-wider text-[11px]">
                <a href="#" @click.prevent="navigateTo('home')" class="hover:text-black dark:hover:text-white transition-colors">Ana Sayfa</a>
                <a href="#" @click.prevent="navigateTo('explore')" class="hover:text-black dark:hover:text-white transition-colors">Keşfet</a>

    <!-- Script Application Logic -->
    <script>
        function ultimateProApp() {
            return {
                currentPage: 'home',
                searchQuery: '',
                quickFilter: 'all',
                sortBy: 'default',
                selectedItem: null,
                currentSlideIndex: 0,
                userRating: 8,
                userCommentText: '',
                selectedSeason: 1,
                selectedEpisode: 1,
                currentEpisodePage: 1,
                
                theme: localStorage.getItem('cine_theme_v3') || 'ivory',
                
                get isDarkMode() {
                    return this.theme === 'dark';
                },

                setTheme(newTheme) {
                    this.theme = newTheme;
                    localStorage.setItem('cine_theme_v3', newTheme);
                },

                getBodyClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-50';
                    if (this.theme === 'slate') return 'bg-slateLight-50';
                    return 'bg-[#0b0d11]';
                },

                getHeaderClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-100/95 border-ivory-200';
                    if (this.theme === 'slate') return 'bg-slateLight-100/95 border-slateLight-200';
                    return 'bg-[#0f1115]/95 border-gray-800/80';
                },

                getCardClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-card border-ivory-200';
                    if (this.theme === 'slate') return 'bg-slateLight-card border-slateLight-200';
                    return 'bg-[#161922] border-gray-800';
                },

                getSearchClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-200 border-ivory-200';
                    if (this.theme === 'slate') return 'bg-slateLight-200 border-slateLight-200';
                    return 'bg-gray-900 border-gray-800';
                },

                getButtonClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-200 border-ivory-200 text-gray-800';
                    if (this.theme === 'slate') return 'bg-slateLight-200 border-slateLight-200 text-gray-800';
                    return 'bg-gray-900 border-gray-800 text-amber-400';
                },

                getThemeIcon() {
                    if (this.theme === 'ivory') return 'fa-solid fa-sun text-amber-500 text-xs';
                    if (this.theme === 'slate') return 'fa-solid fa-circle-half-stroke text-sky-500 text-xs';
                    return 'fa-solid fa-moon text-indigo-400 text-xs';
                },

                getThemeName() {
                    if (this.theme === 'ivory') return 'Fil Dişi';
                    if (this.theme === 'slate') return 'Modern Gri';
                    return 'Karanlık';
                },
                
                catalog: [],
                catalogLoading: true,
                catalogError: null,
                tmdbApiKey: '3108265ab3fdbf3af14175edf64a9c7f',
                tmdbLanguage: 'tr-TR',
                tmdbDetailsCache: {},
                tmdbDetailsLoading: false,
                tmdbDetailsError: '',

                async fetchTmdb(path) {
                    const separator = path.includes('?') ? '&' : '?';
                    const response = await fetch('https://api.themoviedb.org/3/' + path + separator + 'api_key=' + this.tmdbApiKey + '&language=' + this.tmdbLanguage);
                    if (!response.ok) throw new Error('TMDB isteği başarısız (HTTP ' + response.status + ')');
                    return response.json();
                },

                async fetchTmdbDetails(item) {
                    if (!item || !item.tmdbId) return;
                    const cacheKey = item.type + ':' + item.tmdbId;
                    if (this.tmdbDetailsCache[cacheKey]) {
                        Object.assign(item, this.tmdbDetailsCache[cacheKey]);
                        return;
                    }

                    this.tmdbDetailsLoading = true;
                    this.tmdbDetailsError = '';
                    try {
                        const mediaType = item.type === 'tv' ? 'tv' : 'movie';
                        const details = await this.fetchTmdb(mediaType + '/' + item.tmdbId + '?append_to_response=credits,videos');
                        const credits = details.credits || {};
                        const cast = (credits.cast || []).slice(0, 20).map((person, index) => ({
                            id: person.id,
                            name: person.name || '',
                            character: person.character || '',
                            profile: person.profile_path ? 'https://image.tmdb.org/t/p/w185' + person.profile_path : '',
                            order: person.order ?? index
                        }));
                        const crew = credits.crew || [];
                        const director = mediaType === 'movie'
                            ? (crew.find(person => person.job === 'Director')?.name || item.director || '')
                            : (crew.find(person => person.job === 'Executive Producer')?.name || item.director || '');
                        const videos = details.videos?.results || [];
                        const trailer = videos.find(video => video.site === 'YouTube' && video.type === 'Trailer');
                        const poster = details.poster_path ? 'https://image.tmdb.org/t/p/w500' + details.poster_path : item.poster;
                        const backdrop = details.backdrop_path ? 'https://image.tmdb.org/t/p/w1280' + details.backdrop_path : item.backdrop;
                        const genres = (details.genres || []).map(genre => genre.name).join(' / ');
                        const seasonData = {};
                        let realSeasons = [];

                        if (mediaType === 'tv' && Array.isArray(details.seasons)) {
                            realSeasons = details.seasons.filter(season => season.season_number > 0);
                            const seasonResults = await Promise.all(realSeasons.map(async season => {
                                try {
                                    const seasonDetails = await this.fetchTmdb('tv/' + item.tmdbId + '/season/' + season.season_number);
                                    return [season.season_number, (seasonDetails.episodes || []).map(episode => ({
                                        number: episode.episode_number,
                                        title: episode.name || ('Bölüm ' + episode.episode_number),
                                        desc: episode.overview || 'Bu bölüm için açıklama bulunmuyor.',
                                        duration: episode.runtime ? episode.runtime + ' dk' : '',
                                        still: episode.still_path ? 'https://image.tmdb.org/t/p/w500' + episode.still_path : poster
                                    }))];
                                } catch (error) {
                                    console.warn('TMDB sezon verisi alınamadı:', season.season_number, error);
                                    return [season.season_number, []];
                                }
                            }));
                            seasonResults.forEach(([seasonNumber, episodes]) => { seasonData[seasonNumber] = episodes; });
                        }

                        const enriched = {
                            poster,
                            image: poster,
                            backdrop,
                            desc: details.overview || item.desc,
                            tmdbOverview: details.overview || item.tmdbOverview,
                            rating: String(details.vote_average ?? item.rating),
                            tmdbRating: String(details.vote_average ?? item.tmdbRating),
                            year: String((details.release_date || details.first_air_date || item.year || '')).slice(0, 4),
                            duration: mediaType === 'movie'
                                ? (details.runtime ? details.runtime + ' dk' : item.duration)
                                : (details.episode_run_time?.[0] ? details.episode_run_time[0] + ' dk / bölüm' : item.duration),
                            genre: genres || item.genre,
                            category: genres || item.category,
                            country: (details.production_countries || details.origin_country || []).map(country => typeof country === 'string' ? country : country.name).join(', ') || item.country,
                            director,
                            originalTitle: details.original_title || details.original_name || item.originalTitle,
                            tmdbCast: cast.length ? cast : (item.tmdbCast || []),
                            starring: cast.slice(0, 3).map(person => person.name).filter(Boolean).join(' / ') || item.starring,
                            trailerUrl: trailer ? 'https://www.youtube.com/watch?v=' + trailer.key : item.trailerUrl,
                            seasons: mediaType === 'tv' ? realSeasons.length : item.seasons,
                            episodes: mediaType === 'tv' ? realSeasons.reduce((sum, season) => sum + Number(season.episode_count || 0), 0) : item.episodes,
                            tmdbEpisodesBySeason: seasonData,
                            tmdbDetailsLoaded: true
                        };
                        this.tmdbDetailsCache[cacheKey] = enriched;
                        Object.assign(item, enriched);
                        if (this.selectedItem?.id === item.id) Object.assign(this.selectedItem, enriched);
                    } catch (error) {
                        this.tmdbDetailsError = error.message || 'TMDB verileri alınamadı.';
                        console.error('TMDB veri eşitleme hatası:', error);
                    } finally {
                        this.tmdbDetailsLoading = false;
                    }
                },

                async init() {
                    try {
                        const response = await fetch('./filmvediziler.json', { cache: 'no-cache' });
                        if (!response.ok) {
                            throw new Error('Katalog dosyası yüklenemedi (HTTP ' + response.status + ')');
                        }

                        const data = await response.json();
                        const sourceCatalog = Array.isArray(data) ? data : data.catalog;

                        if (!Array.isArray(sourceCatalog)) {
                            throw new Error('JSON dosyasında geçerli bir catalog listesi bulunamadı.');
                        }

                        this.catalog = sourceCatalog.map((item) => {
                            const cast = Array.isArray(item.tmdbCast) && item.tmdbCast.length
                                ? item.tmdbCast
                                : (Array.isArray(item.cast) ? item.cast.map((person, index) => ({
                                    name: typeof person === 'string' ? person : (person.name || ''),
                                    character: typeof person === 'string' ? '' : (person.character || ''),
                                    profile: typeof person === 'string' ? '' : (person.profile || ''),
                                    order: index
                                })) : []);

                            const genreText = item.genre || item.tmdbGenres || item.category || '';

                            return {
                                ...item,
                                id: item.id || item.tmdbId || item.title,
                                title: item.title || item.tmdbTitle || item.originalTitle || 'İsimsiz yapım',
                                type: item.type === 'tv' || item.type === 'series' ? 'tv' : 'movie',
                                category: item.category || item.tmdbGenres || genreText,
                                genre: String(genreText).split('/')[0].trim(),
                                rating: String(item.rating ?? item.tmdbRating ?? '0'),
                                year: String(item.year || item.tmdbReleaseDate || '').slice(0, 4),
                                duration: item.duration || item.tmdbRuntime || '',
                                country: item.country || item.tmdbCountries || '',
                                countryFlag: item.countryFlag || '',
                                poster: item.poster || item.tmdbPoster || item.image || '',
                                backdrop: item.backdrop || item.tmdbBackdrop || item.tmdbPoster || item.image || '',
                                starring: item.starring || cast.slice(0, 3).map(person => person.name).filter(Boolean).join(' / '),
                                desc: item.desc || item.tmdbOverview || '',
                                director: item.director || item.tmdbDirector || '',
                                originalTitle: item.originalTitle || item.tmdbOriginalTitle || item.title || '',
                                tmdbCast: cast,
                                trailerUrl: item.trailerUrl || item.tmdbTrailerUrl || '',
                                seasons: item.seasons ?? item.tmdbSeasons ?? null,
                                episodes: item.episodes ?? item.tmdbEpisodes ?? null
                            };
                        });

                        this.currentSlideIndex = 0;
                    } catch (error) {
                        this.catalogError = error.message || 'Bilinmeyen katalog hatası';
                        console.error('Perde katalog yükleme hatası:', error);
                    } finally {
                        this.catalogLoading = false;
                    }
                },

                get heroSlides() {
                    return this.catalog;
                },

                get currentHero() {
                    return this.heroSlides[this.currentSlideIndex] || this.heroSlides[0];
                },

                selectHeroSlide(idx) {
                    this.currentSlideIndex = idx;
                },

                scrollHeroThumbs(dir) {
                    const container = document.getElementById('heroThumbContainer');
                    if (container) {
                        container.scrollBy({ left: dir * 220, behavior: 'smooth' });
                    }
                },

                getSeasonOptions() {
                    const count = Number(this.selectedItem?.seasons || 0);
                    return Array.from({ length: Math.max(0, count) }, (_, index) => index + 1);
                },

                getEpisodesForSeason(seasonNum) {
                    return this.selectedItem?.tmdbEpisodesBySeason?.[seasonNum] || [];
                },

                get paginatedEpisodes() {
                    const eps = this.getEpisodesForSeason(this.selectedSeason);
                    const start = (this.currentEpisodePage - 1) * 8;
                    return eps.slice(start, start + 8);
                },

                get totalEpisodePages() {
                    const eps = this.getEpisodesForSeason(this.selectedSeason);
                    return Math.ceil(eps.length / 8);
                },

                getEpisodeTracking() {
                    const all = JSON.parse(localStorage.getItem('cine_episode_tracking_v1') || '{}');
                    const key = this.currentProfileId + ':' + (this.selectedItem?.id || '');
                    return all[key] || { watched: {}, last: null };
                },

                saveEpisodeTracking(tracking) {
                    const all = JSON.parse(localStorage.getItem('cine_episode_tracking_v1') || '{}');
                    const key = this.currentProfileId + ':' + (this.selectedItem?.id || '');
                    all[key] = tracking;
                    localStorage.setItem('cine_episode_tracking_v1', JSON.stringify(all));
                },

                isEpisodeWatched(seasonNum, epNum) {
                    const tracking = this.getEpisodeTracking();
                    return (tracking.watched?.[seasonNum] || []).includes(Number(epNum));
                },

                getWatchedEpisodeCount(seasonNum) {
                    return (this.getEpisodeTracking().watched?.[seasonNum] || []).length;
                },

                getSeasonProgress(seasonNum) {
                    const total = this.getEpisodesForSeason(seasonNum).length;
                    return total ? Math.round(this.getWatchedEpisodeCount(seasonNum) / total * 100) : 0;
                },

                getLastWatchedEpisode() {
                    return this.getEpisodeTracking().last;
                },

                toggleEpisodeWatched(epNum) {
                    const tracking = this.getEpisodeTracking();
                    if (!tracking.watched) tracking.watched = {};
                    const seasonKey = String(this.selectedSeason);
                    const watched = tracking.watched[seasonKey] || [];
                    const index = watched.indexOf(Number(epNum));
                    if (index >= 0) {
                        watched.splice(index, 1);
                        if (tracking.last?.season === Number(this.selectedSeason) && tracking.last?.episode === Number(epNum)) tracking.last = null;
                    } else {
                        watched.push(Number(epNum));
                        tracking.last = { season: Number(this.selectedSeason), episode: Number(epNum), updatedAt: Date.now() };
                    }
                    tracking.watched[seasonKey] = watched;
                    this.saveEpisodeTracking(tracking);
                },

                continueLastWatchedEpisode() {
                    const last = this.getLastWatchedEpisode();
                    if (!last) return;
                    this.selectedSeason = Number(last.season);
                    this.selectedEpisode = Number(last.episode);
                    this.currentEpisodePage = Math.floor((Number(last.episode) - 1) / 8) + 1;
                },

                goToNextEpisode() {
                    const episodes = this.getEpisodesForSeason(this.selectedSeason);
                    const next = episodes.find(ep => ep.number > this.selectedEpisode);
                    if (next) {
                        this.selectedEpisode = next.number;
                        this.currentEpisodePage = Math.floor((next.number - 1) / 8) + 1;
                    } else {
                        const nextSeason = this.selectedSeason + 1;
                        const nextSeasonEpisodes = this.getEpisodesForSeason(nextSeason);
                        if (nextSeasonEpisodes.length) {
                            this.selectedSeason = nextSeason;
                            this.selectedEpisode = nextSeasonEpisodes[0].number;
                            this.currentEpisodePage = 1;
                        }
                    }
                },

                selectEpisode(epNum) {
                    this.selectedEpisode = epNum;
                    const video = document.getElementById('customVideoPlayer');
                    if (video && this.isDirectVideoUrl(this.selectedItem?.watchUrl)) {
                        video.currentTime = 0;
                        video.play().catch(() => { this.playbackError = true; });
                    }
                },
                
                isPlaying: false,
                isMuted: false,
                volumeLevel: 1,
                previousVolumeLevel: 1,
                videoProgress: 0,
                currentTimeFormatted: '00:00',
                durationFormatted: '00:00',
                videoEnded: false,
                playbackError: false,
                hasPlaybackStarted: false,
                playerControlsVisible: true,
                playerControlsTimer: null,

                showPlayerControls() {
                    this.playerControlsVisible = true;
                    if (this.playerControlsTimer) clearTimeout(this.playerControlsTimer);
                    if (this.isPlaying) this.schedulePlayerControlsHide();
                },

                schedulePlayerControlsHide() {
                    if (this.playerControlsTimer) clearTimeout(this.playerControlsTimer);
                    if (!this.isPlaying) return;
                    this.playerControlsTimer = setTimeout(() => {
                        if (this.isPlaying) this.playerControlsVisible = false;
                    }, 2200);
                },

                hidePlayerControlsOnLeave() {
                    if (this.playerControlsTimer) clearTimeout(this.playerControlsTimer);
                    this.playerControlsVisible = !this.isPlaying;
                },

                isDirectVideoUrl(url) {
                    return typeof url === 'string' && /\.mp4(?:$|[?#])/i.test(url);
                },

                getPlaybackUrl() {
                    return this.selectedItem && this.isDirectVideoUrl(this.selectedItem.watchUrl)
                        ? this.selectedItem.watchUrl
                        : '';
                },

                startPlayback() {
                    this.hasPlaybackStarted = true;
                    this.playerControlsVisible = true;
                    this.togglePlay();
                },

                togglePlay() {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video || !this.isDirectVideoUrl(this.selectedItem?.watchUrl)) return;
                    if (video.paused) {
                        video.play().catch(() => { this.playbackError = true; });
                    } else {
                        video.pause();
                    }
                },

                updateVideoProgress() {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video) return;
                    if (video.duration) {
                        this.videoProgress = (video.currentTime / video.duration) * 100;
                        this.currentTimeFormatted = this.formatTime(video.currentTime);
                        this.durationFormatted = this.formatTime(video.duration);

                        if (this.selectedItem) {
                            let progressMap = JSON.parse(localStorage.getItem('perde_player_progress_v3')) || {};
                            progressMap[this.selectedItem.id] = {
                                time: video.currentTime,
                                duration: video.duration,
                                savedAt: Date.now()
                            };
                            localStorage.setItem('perde_player_progress_v3', JSON.stringify(progressMap));
                        }
                    }
                },

                seekVideo(event) {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video || !video.duration) return;
                    const rect = event.currentTarget.getBoundingClientRect();
                    const pos = (event.clientX - rect.left) / rect.width;
                    video.currentTime = pos * video.duration;
                },

                skipTime(seconds) {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video) return;
                    video.currentTime += seconds;
                },

                skipIntro() {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video) return;
                    video.currentTime += 85;
                },

                setVideoVolume(value) {
                    const video = document.getElementById('customVideoPlayer');
                    const nextVolume = Math.max(0, Math.min(1, Number(value)));
                    this.volumeLevel = nextVolume;
                    if (nextVolume > 0) this.previousVolumeLevel = nextVolume;
                    if (video) {
                        video.volume = nextVolume;
                        video.muted = nextVolume === 0;
                    }
                    this.isMuted = nextVolume === 0;
                },

                toggleMute() {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video) return;
                    if (video.muted || this.volumeLevel === 0) {
                        const restoredVolume = this.previousVolumeLevel || 0.5;
                        this.volumeLevel = restoredVolume;
                        video.volume = restoredVolume;
                        video.muted = false;
                        this.isMuted = false;
                    } else {
                        this.previousVolumeLevel = this.volumeLevel;
                        video.muted = true;
                        this.isMuted = true;
                    }
                },

                toggleFullscreen() {
                    const playerContainer = document.getElementById('customVideoPlayer')?.parentElement;
                    if (!playerContainer) return;
                    if (!document.fullscreenElement) {
                        playerContainer.requestFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                },

                formatTime(seconds) {
                    const m = Math.floor(seconds / 60);
                    const s = Math.floor(seconds % 60);
                    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
                },

                scrollCast(direction) {
                    const container = document.getElementById('castContainer');
                    if (container) {
                        container.scrollBy({ left: 180 * direction, behavior: 'smooth' });
                    }
                },

                scrollSimilar(direction) {
                    const container = document.getElementById('similarContainer');
                    if (container) {
                        container.scrollBy({ left: 180 * direction, behavior: 'smooth' });
                    }
                },

                profiles: [
                    { id: 'pro_1', name: 'Ana Profil', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop' },
                    { id: 'pro_2', name: 'Çocuk Profili', avatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?q=80&w=200&auto=format&fit=crop' }
                ],
                currentProfileId: localStorage.getItem('cine_active_profile') || 'pro_1',

                get currentProfile() {
                    return this.profiles.find(p => p.id === this.currentProfileId) || this.profiles[0];
                },

                switchProfile(id) {
                    this.currentProfileId = id;
                    localStorage.setItem('cine_active_profile', id);
                },

                get watchlist() {
                    let allLists = JSON.parse(localStorage.getItem('cine_profile_watchlists')) || {};
                    return allLists[this.currentProfileId] || [];
                },
                get currentWatchlist() {
                    return this.watchlist;
                },

                toggleWatchlist(item) {
                    let allLists = JSON.parse(localStorage.getItem('cine_profile_watchlists')) || {};
                    if (!allLists[this.currentProfileId]) allLists[this.currentProfileId] = [];
                    let list = allLists[this.currentProfileId];
                    const index = list.findIndex(m => m.id === item.id);
                    if (index > -1) {
                        list.splice(index, 1);
                    } else {
                        list.push(item);
                    }
                    localStorage.setItem('cine_profile_watchlists', JSON.stringify(allLists));
                },

                isInWatchlist(item) {
                    return this.watchlist.some(m => m.id === item.id);
                },

                reviews: JSON.parse(localStorage.getItem('cine_reviews')) || {},

                getReviews(itemId) {
                    return this.reviews[itemId] || [];
                },

                submitReview() {
                    if (!this.userCommentText.trim() || !this.selectedItem) return;
                    if (!this.reviews[this.selectedItem.id]) {
                        this.reviews[this.selectedItem.id] = [];
                    }
                    this.reviews[this.selectedItem.id].unshift({
                        author: this.currentProfile.name,
                        rating: this.userRating,
                        comment: this.userCommentText,
                        date: new Date().toLocaleDateString()
                    });
                    localStorage.setItem('cine_reviews', JSON.stringify(this.reviews));
                    this.userCommentText = '';
                },

                navigateTo(page) {
                    this.currentPage = page;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                openWatchPage(item) {
                    this.selectedItem = item;
                    this.selectedSeason = 1;
                    this.selectedEpisode = 1;
                    this.currentEpisodePage = 1;
                    this.isPlaying = false;
                    this.hasPlaybackStarted = false;
                    this.playerControlsVisible = true;
                    this.videoProgress = 0;
                    this.playbackError = false;
                    this.tmdbDetailsError = '';
                    this.currentPage = 'watch';
                    this.fetchTmdbDetails(item);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    
                    setTimeout(() => {
                        const video = document.getElementById('customVideoPlayer');
                        let progressMap = JSON.parse(localStorage.getItem('perde_player_progress_v3')) || {};
                        if (video && progressMap[item.id]) {
                            video.currentTime = progressMap[item.id].time || 0;
                        }
                    }, 200);
                },

                get sortedFilteredCatalog() {
                    let result = this.catalog.filter(item => {
                        const matchesSearch = item.title.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                              item.genre.toLowerCase().includes(this.searchQuery.toLowerCase());
                        let matchesQuick = true;
                        if (this.quickFilter === 'imdb8') matchesQuick = parseFloat(item.rating) >= 8.0;
                        if (this.quickFilter === 'series') matchesQuick = item.type === 'tv';
                        if (this.quickFilter === 'movies') matchesQuick = item.type === 'movie';
                        return matchesSearch && matchesQuick;
                    });

                    if (this.sortBy === 'rating') {
                        result.sort((a, b) => parseFloat(b.rating) - parseFloat(a.rating));
                    } else if (this.sortBy === 'year') {
                        result.sort((a, b) => parseInt(b.year) - parseInt(a.year));
                    }
                    return result;
                }
            }
        }
    </script>
</body>
</html>
