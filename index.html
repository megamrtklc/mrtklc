<!DOCTYPE html>
<html lang="tr" :class="theme === 'dark' ? 'dark' : (theme === 'ivory' ? 'theme-ivory' : 'theme-slate')" x-data="ultimateProApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse Ultimate Pro</title>
    <!-- Kritik harici kaynaklara erken bağlantı -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
    <!-- Tailwind CSS: HTML ayrıştırmasını bloke etmeden yükle -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            red: '#E50914',
                            accent: '#F43F5E',
                            dark: '#0B0D11',
                            card: '#161922'
                        },
                        ivory: {
                            50: '#FAF8F5',
                            100: '#F5F2EB',
                            200: '#EBE7DD',
                            card: '#FFFDF9'
                        },
                        slateLight: {
                            50: '#F4F5F7',
                            100: '#EAECEF',
                            200: '#D8DBE2',
                            card: '#FFFFFF'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Açık temalar: sabit Tailwind gri/beyaz yardımcı sınıflarını tema paletine uyarla. */
        .theme-ivory {
            --theme-surface: #FFFDF9;
            --theme-surface-muted: #F5F2EB;
            --theme-surface-soft: #EBE7DD;
            --theme-border: #E2DDD2;
            --theme-border-strong: #D4CDBF;
            --theme-text-primary: #29261F;
            --theme-text-secondary: #49443C;
            --theme-text-muted: #696359;
            --theme-text-subtle: #777166;
        }
        .theme-slate {
            --theme-surface: #FFFFFF;
            --theme-surface-muted: #F4F5F7;
            --theme-surface-soft: #EAECEF;
            --theme-border: #D8DBE2;
            --theme-border-strong: #C6CBD4;
            --theme-text-primary: #20242B;
            --theme-text-secondary: #39414C;
            --theme-text-muted: #596270;
            --theme-text-subtle: #68717F;
        }

        .theme-ivory .bg-white, .theme-slate .bg-white { background-color: var(--theme-surface); }
        .theme-ivory .bg-gray-50, .theme-slate .bg-gray-50 { background-color: var(--theme-surface-muted); }
        .theme-ivory .bg-gray-100, .theme-slate .bg-gray-100 { background-color: var(--theme-surface-muted); }
        .theme-ivory .bg-gray-200, .theme-slate .bg-gray-200 { background-color: var(--theme-surface-soft); }

        .theme-ivory .text-gray-900, .theme-slate .text-gray-900 { color: var(--theme-text-primary); }
        .theme-ivory .text-gray-800, .theme-slate .text-gray-800 { color: var(--theme-text-secondary); }
        .theme-ivory .text-gray-700, .theme-slate .text-gray-700 { color: var(--theme-text-secondary); }
        .theme-ivory .text-gray-600, .theme-slate .text-gray-600 { color: var(--theme-text-muted); }
        .theme-ivory .text-gray-500, .theme-slate .text-gray-500 { color: var(--theme-text-muted); }
        .theme-ivory .text-gray-400, .theme-slate .text-gray-400 { color: var(--theme-text-subtle); }

        .theme-ivory .border-gray-100, .theme-slate .border-gray-100,
        .theme-ivory .border-gray-200, .theme-slate .border-gray-200 { border-color: var(--theme-border); }
        .theme-ivory .border-gray-300, .theme-slate .border-gray-300 { border-color: var(--theme-border-strong); }
    </style>
</head>
<body :class="getBodyClass()" class="text-gray-900 dark:text-slate-100 font-sans min-h-screen flex flex-col selection:bg-rose-600 selection:text-white transition-colors duration-300">

    <!-- Header / Top Navbar (Full Width) -->
    <header x-data="{ mobileMenuOpen: false }" :class="getHeaderClass()" class="sticky top-0 z-50 backdrop-blur-md border-b transition-colors duration-300">
        <div class="w-full px-4 sm:px-12 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 lg:space-x-8">
                <a href="#" @click.prevent="navigateTo('home')" class="flex items-center space-x-2.5 group">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-rose-500 flex items-center justify-center shadow-lg shadow-rose-600/30 group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-film text-white text-sm"></i>
                    </div>
                    <span class="text-xl font-black tracking-wider uppercase max-[360px]:hidden">CINE<span class="text-rose-600">VERSE</span></span>
                </a>
                
                <nav class="hidden lg:flex items-center space-x-6 text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400">
                    <a href="#" @click.prevent="navigateTo('home')" :class="currentPage === 'home' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors">Ana Sayfa</a>
                    <a href="#" @click.prevent="navigateTo('explore')" :class="currentPage === 'explore' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors">Keşfet</a>
                    <a href="#" @click.prevent="navigateTo('video-links')" :class="currentPage === 'video-links' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors flex items-center gap-1.5">
                        <span>Video Bağlantıları</span>
                        <span class="px-1.5 py-0.5 rounded-full bg-rose-500/15 text-rose-600 dark:text-rose-400 text-[10px]" x-text="watchableCatalog.length"></span>
                    </a>
                    <a href="#" @click.prevent="navigateTo('watchlist')" :class="currentPage === 'watchlist' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors flex items-center space-x-1.5">
                        <span>İzleme Listem</span>
                        <span class="px-1.5 py-0.2 bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-full text-[10px]" x-text="watchlist.length"></span>
                    </a>
                    <a href="#" @click.prevent="navigateTo('stats')" :class="currentPage === 'stats' ? 'text-rose-500' : 'hover:text-black dark:hover:text-white'" class="transition-colors">İstatistikler</a>
                </nav>
            </div>
            
            <div class="flex items-center space-x-1 sm:space-x-4">
                <button @click="mobileMenuOpen = !mobileMenuOpen" :aria-expanded="mobileMenuOpen.toString()" aria-label="Menüyü aç veya kapat" class="lg:hidden w-9 h-9 rounded-lg border border-gray-300 dark:border-gray-700 flex items-center justify-center text-gray-700 dark:text-gray-200 hover:text-rose-500 transition-colors">
                    <i :class="mobileMenuOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars'"></i>
                </button>
                <div class="relative hidden xl:block">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input type="text" x-model="searchQuery" placeholder="Film veya dizi ara..." :class="getSearchClass()" class="border rounded-lg pl-9 pr-3 py-1.5 text-xs text-gray-900 dark:text-gray-200 placeholder-gray-500 focus:outline-none focus:border-rose-600 w-60 transition-all">
                </div>

                <!-- 3'LÜ TEMA SEÇİCİ DROPDOWN -->
                <div class="relative" x-data="{ openThemeMenu: false }">
                    <button @click="openThemeMenu = !openThemeMenu" :aria-label="'Tema seçimi: ' + getThemeName()" :class="getButtonClass()" class="px-2 sm:px-3 h-9 rounded-lg border flex items-center space-x-2 text-xs font-bold transition-colors shadow-sm">
                        <i :class="getThemeIcon()"></i>
                        <span class="hidden sm:inline" x-text="getThemeName()"></span>
                        <i class="fa-solid fa-chevron-down text-[10px] opacity-70"></i>
                    </button>

                    <div x-show="openThemeMenu" @click.away="openThemeMenu = false" class="absolute right-0 mt-2 w-48 bg-white dark:bg-[#161922] border border-gray-200 dark:border-gray-800 rounded-xl shadow-xl py-2 z-50 space-y-1">
                        <button @click="setTheme('ivory'); openThemeMenu = false;" class="w-full text-left px-4 py-2 text-xs font-semibold flex items-center space-x-2.5 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200">
                            <i class="fa-solid fa-sun text-amber-500"></i>
                            <span>Fil Dişi (Sıcak Krem)</span>
                        </button>
                        <button @click="setTheme('slate'); openThemeMenu = false;" class="w-full text-left px-4 py-2 text-xs font-semibold flex items-center space-x-2.5 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200">
                            <i class="fa-solid fa-circle-half-stroke text-sky-500"></i>
                            <span>Modern Gri (Slate)</span>
                        </button>
                        <button @click="setTheme('dark'); openThemeMenu = false;" class="w-full text-left px-4 py-2 text-xs font-semibold flex items-center space-x-2.5 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200">
                            <i class="fa-solid fa-moon text-indigo-400"></i>
                            <span>Karanlık Mod</span>
                        </button>
                    </div>
                </div>

                <!-- Profil Seçici -->
                <div :class="getCardClass()" class="flex items-center space-x-1 sm:space-x-2 border rounded-lg px-1.5 sm:px-2.5 py-1">
                    <img alt="Profil fotoğrafı" @error="handleImageError($event)" decoding="async" loading="eager" :src="currentProfile.avatar" class="hidden sm:block w-6 h-6 rounded-full object-cover">
                    <select x-model="currentProfileId" aria-label="Aktif profili seç" @change="switchProfile($event.target.value)" class="bg-transparent text-xs font-bold text-gray-900 dark:text-white focus:outline-none cursor-pointer max-w-[76px] sm:max-w-none">
                        <template x-for="pro in profiles" :key="pro.id">
                            <option :value="pro.id" x-text="pro.name" class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white"></option>
                        </template>
                    </select>
                </div>
            </div>
        </div>
        <div x-show="mobileMenuOpen" x-transition.origin.top.right @click.away="mobileMenuOpen = false" class="lg:hidden absolute top-full right-3 left-3 sm:left-auto sm:w-80 mt-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#161922] shadow-2xl p-3 z-50">
            <div class="relative mb-3">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" x-model="searchQuery" @keydown.enter="navigateTo('explore'); mobileMenuOpen = false" placeholder="Film veya dizi ara..." :class="getSearchClass()" class="w-full border rounded-lg pl-9 pr-3 py-2.5 text-sm text-gray-900 dark:text-gray-200 placeholder-gray-500 focus:outline-none focus:border-rose-600">
            </div>
            <nav class="grid grid-cols-1 gap-1 text-sm font-bold text-gray-700 dark:text-gray-200">
                <a href="#" @click.prevent="navigateTo('home'); mobileMenuOpen = false" class="rounded-lg px-3 py-3 hover:bg-gray-100 dark:hover:bg-gray-800">Ana Sayfa</a>
                <a href="#" @click.prevent="navigateTo('explore'); mobileMenuOpen = false" class="rounded-lg px-3 py-3 hover:bg-gray-100 dark:hover:bg-gray-800">Keşfet</a>
                <a href="#" @click.prevent="navigateTo('video-links'); mobileMenuOpen = false" class="rounded-lg px-3 py-3 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-between"><span>Video Bağlantıları</span><span class="text-xs text-rose-500" x-text="watchableCatalog.length"></span></a>
                <a href="#" @click.prevent="navigateTo('watchlist'); mobileMenuOpen = false" class="rounded-lg px-3 py-3 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-between"><span>İzleme Listem</span><span class="text-xs text-rose-500" x-text="watchlist.length"></span></a>
                <a href="#" @click.prevent="navigateTo('stats'); mobileMenuOpen = false" class="rounded-lg px-3 py-3 hover:bg-gray-100 dark:hover:bg-gray-800">İstatistikler</a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow w-full">
        
        <!-- ==================== HOME PAGE ==================== -->
        <template x-if="currentPage === 'home'">
            <div class="w-full space-y-10 pb-16">
                
                <!-- HERO BANNER (Tüm Modlar İçin Ortak ve Kusursuz Sinematik Manşet) -->
                <section class="relative w-full bg-gray-950 min-h-[580px] sm:min-h-[640px] flex flex-col justify-between overflow-hidden select-none border-b border-gray-200 dark:border-gray-800/80">
                    
                    <!-- Main Hero Stage -->
                    <div class="relative w-full flex-grow flex items-center px-6 sm:px-12 py-12">
                        <!-- Backdrop Image -->
                        <div class="absolute inset-0 z-0">
                            <img :src="currentHero.backdrop" :srcset="getTmdbImageSrcSet(currentHero.backdrop, [780, 1280])" sizes="100vw" :alt="currentHero.title + ' arka plan görseli'" loading="eager" fetchpriority="high" decoding="async" @error="handleImageError($event)" class="w-full h-full object-cover object-center filter brightness-[0.7]">
                            <!-- Sabit Sinematik Koyu Gradyan Perdesi (Her Modda Görseli ve Yazıyı Mükemmel Gösterir) -->
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/60 to-transparent"></div>
                            <div class="absolute inset-0 bg-gradient-to-r from-gray-950/90 via-gray-950/50 to-transparent"></div>
                        </div>

                        <!-- Left Info Container (Her modda sabit beyaz metinler ve net okunabilirlik) -->
                        <div class="relative z-10 max-w-2xl space-y-4 text-white">
                            <!-- Title -->
                            <h1 class="text-3xl sm:text-5xl lg:text-6xl font-black text-rose-500 tracking-tight leading-none drop-shadow-md" x-text="currentHero.title"></h1>
                            
                            <!-- Star Rating & Year -->
                            <div class="flex items-center space-x-3 text-xs sm:text-sm font-bold">
                                <div class="flex items-center space-x-1 text-amber-400">
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star-half-stroke"></i>
                                </div>
                                <span class="text-amber-400 font-extrabold" x-text="currentHero.rating"></span>
                                <span class="text-gray-400">•</span>
                                <span class="text-gray-200 font-semibold" x-text="currentHero.year"></span>
                                <span class="text-gray-400">•</span>
                                <span class="px-2 py-0.5 bg-rose-600/30 text-rose-300 border border-rose-500/40 rounded text-[10px] font-black uppercase" x-text="currentHero.genre"></span>
                            </div>

                            <!-- Starring -->
                            <p class="text-gray-200 text-xs sm:text-sm">
                                <strong class="text-white font-bold">Starring:</strong> 
                                <span x-text="currentHero.starring"></span>
                            </p>

                            <!-- Introduction -->
                            <p class="text-gray-200 text-xs sm:text-sm leading-relaxed line-clamp-3 max-w-xl">
                                <strong class="text-white font-bold">Introduction:</strong> 
                                <span x-text="currentHero.desc"></span>
                            </p>

                            <!-- Buttons -->
                            <div class="flex items-center space-x-4 pt-3">
                                <button @click="openWatchPage(currentHero)" class="px-8 py-3 bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-600 text-white font-bold text-xs uppercase tracking-wider rounded-full shadow-lg shadow-rose-600/40 transition-all transform hover:scale-105 flex items-center space-x-2.5">
                                    <i class="fa-solid fa-play text-xs"></i>
                                    <span>Play</span>
                                </button>

                                <button @click="toggleWatchlist(currentHero)" class="px-7 py-3 bg-black/40 hover:bg-rose-600/20 border border-rose-500/50 hover:border-rose-500 text-white font-bold text-xs uppercase tracking-wider rounded-full backdrop-blur-md transition-all flex items-center space-x-2">
                                    <i :class="isInWatchlist(currentHero) ? 'fa-solid fa-bookmark text-rose-500' : 'fa-regular fa-bookmark'"></i>
                                    <span x-text="isInWatchlist(currentHero) ? 'Collection (Added)' : 'Collection'"></span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Hero Bottom Thumbnails Carousel -->
                    <div class="relative z-10 w-full bg-gradient-to-t from-black/80 to-transparent pt-4 pb-6 px-6 sm:px-12">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-bold uppercase tracking-widest text-gray-300">Featured Marvel & Action Collection</span>
                            <div class="flex space-x-1.5">
                                <button @click="scrollHeroThumbs(-1)" aria-label="Önceki öne çıkan yapım" class="w-7 h-7 rounded-full bg-black/60 border border-gray-700 hover:bg-rose-600 hover:border-rose-600 text-white flex items-center justify-center text-xs transition-colors">
                                    <i class="fa-solid fa-chevron-left"></i>
                                </button>
                                <button @click="scrollHeroThumbs(1)" aria-label="Sonraki öne çıkan yapım" class="w-7 h-7 rounded-full bg-black/60 border border-gray-700 hover:bg-rose-600 hover:border-rose-600 text-white flex items-center justify-center text-xs transition-colors">
                                    <i class="fa-solid fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>

                        <div id="heroThumbContainer" class="flex items-center space-x-4 overflow-x-auto no-scrollbar scroll-smooth py-1">
                            <template x-for="(item, idx) in heroSlides" :key="item.id">
                                <div @click="selectHeroSlide(idx)" 
                                     :class="currentSlideIndex === idx ? 'ring-2 ring-rose-500 border-rose-500' : 'border-gray-800 opacity-75 hover:opacity-100'"
                                     class="flex-shrink-0 w-32 sm:w-36 cursor-pointer group bg-gray-900 rounded-xl overflow-hidden border p-1.5 transition-all duration-300 shadow-sm">
                                    <div class="w-full aspect-[2/3] rounded-lg overflow-hidden bg-black mb-1.5">
                                        <img :alt="item.title" @error="handleImageError($event)" decoding="async" loading="lazy" :src="item.poster" :srcset="getTmdbImageSrcSet(item.poster)" sizes="(max-width: 640px) 45vw, (max-width: 768px) 30vw, (max-width: 1024px) 18vw, 14vw" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                                    </div>
                                    <div class="text-[11px] font-bold text-center text-white line-clamp-1 group-hover:text-rose-500 transition-colors" x-text="item.title"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </section>

                <!-- Kişiselleştirilmiş Öneriler -->
                <section class="w-full px-6 sm:px-12 space-y-5">
                    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 border-b border-gray-200 dark:border-gray-800 pb-4">
                        <div>
                            <p class="text-[10px] font-black uppercase tracking-[0.22em] text-rose-500 mb-1">SANA ÖZEL • <span x-text="currentProfile.name"></span></p>
                            <h2 class="text-xl sm:text-2xl font-black uppercase tracking-wider text-gray-900 dark:text-white">İzleme Zevkine Göre</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">İzleme geçmişin ve listene eklediğin yapımlardan yola çıkarak seçildi</p>
                        </div>
                        <span class="text-[10px] font-bold text-rose-500" x-text="personalizedRecommendations.length + ' öneri'"></span>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-8 gap-3 sm:gap-4">
                        <template x-for="item in personalizedRecommendations" :key="'personal-' + item.id">
                            <button @click="openWatchPage(item)" :class="getCardClass()" class="group min-w-0 text-left rounded-xl overflow-hidden border hover:border-rose-500/60 hover:-translate-y-1 transition-all duration-300 shadow-sm">
                                <div class="relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
                                    <img @error="handleImageError($event)" :src="item.poster || item.image" :srcset="getTmdbImageSrcSet(item.poster || item.image)" sizes="(max-width: 640px) 45vw, (max-width: 768px) 30vw, (max-width: 1024px) 18vw, 14vw" :alt="item.title" loading="lazy" decoding="async" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    <span class="absolute top-2 left-2 rounded bg-black/75 text-white text-[8px] font-black uppercase px-1.5 py-1" x-text="item.type === 'series' ? 'Dizi' : 'Film'"></span>
                                    <span class="absolute bottom-2 right-2 rounded bg-black/75 text-amber-400 text-[9px] font-black px-1.5 py-1"><i class="fa-solid fa-star mr-1"></i><span x-text="item.rating || '—'"></span></span>
                                </div>
                                <div class="p-2.5 space-y-1">
                                    <h3 class="text-[11px] font-bold text-gray-900 dark:text-white line-clamp-2 group-hover:text-rose-500 transition-colors" x-text="item.title"></h3>
                                    <p class="text-[9px] text-gray-500 dark:text-gray-400" x-text="(item.year || '') + (item.genre ? ' • ' + item.genre : '')"></p>
                                </div>
                            </button>
                        </template>
                    </div>
                    <p x-show="!personalizedRecommendations.length" class="text-xs text-gray-500 dark:text-gray-400 py-5 text-center">Önerileri kişiselleştirmek için birkaç yapım izlemeye başlayabilir veya izleme listene ekleyebilirsin.</p>
                </section>

                <!-- Film & Dizi Katalog -->
                <section class="w-full px-6 sm:px-12 space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-gray-200 dark:border-gray-800 pb-4">
                        <div>
                            <h2 class="text-xl font-black uppercase tracking-wider text-gray-900 dark:text-white">Tüm Yapımlar & Trendler</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Tam ekran arşiv kataloğu</p>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <select x-model="quickFilter" aria-label="Yapım türü filtresi" :class="getCardClass()" class="border rounded-lg px-3 py-1.5 text-xs font-semibold text-gray-700 dark:text-gray-300 focus:outline-none focus:border-rose-600">
                                <option value="all">Tümü</option>
                                <option value="imdb8">IMDb 8+</option>
                                <option value="series">Diziler</option>
                                <option value="movies">Filmler</option>

    <!-- Script Application Logic -->
    <script>
        function safeStorageRead(key, fallback = null) {
            try {
                const raw = localStorage.getItem(key);
                if (raw === null || raw === '') return fallback;
                try { return JSON.parse(raw); } catch (_) { return raw; }
            } catch (error) { console.warn('Yerel kayıt okunamadı:', key, error); return fallback; }
        }
        function safeStorageWrite(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); return true; }
            catch (error) { console.warn('Yerel kayıt kaydedilemedi:', key, error); return false; }
        }

        function ultimateProApp() {
            return {
                getTmdbImageSrcSet(url, widths = [185, 342, 500]) {
                    if (typeof url !== 'string') return '';
                    const match = url.match(/^(https:\/\/image\.tmdb\.org\/t\/p\/)(?:w\d+|original)(\/.*)$/);
                    if (!match) return '';
                    return widths.map(width => `${match[1]}w${width}${match[2]} ${width}w`).join(', ');
                },

                handleImageError(event) {
                    const image = event && event.target;
                    if (!image || image.dataset.perdeFallbackApplied) return;
                    image.dataset.perdeFallbackApplied = 'true';
                    const placeholder = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480"><rect width="320" height="480" fill="#171923"/><g fill="none" stroke="#555b6b" stroke-width="8"><rect x="104" y="176" width="112" height="84" rx="10"/><path d="m116 244 34-35 24 22 18-18 20 24"/></g><text x="160" y="310" fill="#9ca3af" font-size="18" text-anchor="middle" font-family="Arial,sans-serif">Görsel yok</text></svg>';
                    image.src = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(placeholder);
                },

                currentPage: 'home',
                searchQuery: '',
                quickFilter: 'all',
                sortBy: 'default',
                discoveryType: 'all',
                discoveryGenre: 'all',
                discoveryCountry: 'all',
                discoveryPlatform: 'all',
                discoveryRating: '0',
                discoveryYearFrom: '',
                discoveryYearTo: '',
                selectedItem: null,
                currentSlideIndex: 0,
                userRating: 8,
                userCommentText: '',
                selectedSeason: 1,
                selectedEpisode: 1,
                currentEpisodePage: 1,
                
                theme: ['ivory','slate','dark'].includes(safeStorageRead('cine_theme_v3','ivory')) ? safeStorageRead('cine_theme_v3','ivory') : 'ivory',
                
                get isDarkMode() {
                    return this.theme === 'dark';
                },

                setTheme(newTheme) {
                    this.theme = newTheme;
                    safeStorageWrite('cine_theme_v3', newTheme);
                },

                getBodyClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-50';
                    if (this.theme === 'slate') return 'bg-slateLight-50';
                    return 'bg-[#0b0d11]';
                },

                getHeaderClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-100/95 border-ivory-200';
                    if (this.theme === 'slate') return 'bg-slateLight-100/95 border-slateLight-200';
                    return 'bg-[#0f1115]/95 border-gray-800/80';
                },

                getCardClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-card border-ivory-200';
                    if (this.theme === 'slate') return 'bg-slateLight-card border-slateLight-200';
                    return 'bg-[#161922] border-gray-800';
                },

                getDiscoveryTileClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-100 border-ivory-200';
                    if (this.theme === 'slate') return 'bg-slateLight-100 border-slateLight-200';
                    return 'bg-white/[0.03] border-gray-700/80';
                },

                getDiscoveryEmptyClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-100 border-ivory-200 text-gray-600';
                    if (this.theme === 'slate') return 'bg-slateLight-100 border-slateLight-200 text-gray-600';
                    return 'bg-white/[0.03] border-gray-700 text-gray-400';
                },

                getDiscoveryTrackClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-200';
                    if (this.theme === 'slate') return 'bg-slateLight-200';
                    return 'bg-gray-700';
                },

                getMutedTextClass() {
                    if (this.theme === 'ivory' || this.theme === 'slate') return 'text-gray-600';
                    return 'text-gray-400';
                },

                getSearchClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-200 border-ivory-200';
                    if (this.theme === 'slate') return 'bg-slateLight-200 border-slateLight-200';
                    return 'bg-gray-900 border-gray-800';
                },

                getButtonClass() {
                    if (this.theme === 'ivory') return 'bg-ivory-200 border-ivory-200 text-gray-800';
                    if (this.theme === 'slate') return 'bg-slateLight-200 border-slateLight-200 text-gray-800';
                    return 'bg-gray-900 border-gray-800 text-amber-400';
                },

                getThemeIcon() {
                    if (this.theme === 'ivory') return 'fa-solid fa-sun text-amber-500 text-xs';
                    if (this.theme === 'slate') return 'fa-solid fa-circle-half-stroke text-sky-500 text-xs';
                    return 'fa-solid fa-moon text-indigo-400 text-xs';
                },

                getThemeName() {
                    if (this.theme === 'ivory') return 'Fil Dişi';
                    if (this.theme === 'slate') return 'Modern Gri';
                    return 'Karanlık';
                },
                
                catalog: [],
                catalogLoading: true,
                catalogError: null,
                tmdbApiKey: '3108265ab3fdbf3af14175edf64a9c7f',
                tmdbLanguage: 'tr-TR',
                tmdbDetailsCache: {},
                tmdbDetailsLoading: false,
                tmdbSeasonLoading: false,
                tmdbSeasonRequests: {},
                tmdbDetailsError: '',

                async fetchTmdb(path) {
                    const separator = path.includes('?') ? '&' : '?';
                    const response = await fetch('https://api.themoviedb.org/3/' + path + separator + 'api_key=' + this.tmdbApiKey + '&language=' + this.tmdbLanguage);
                    if (!response.ok) throw new Error('TMDB isteği başarısız (HTTP ' + response.status + ')');
                    return response.json();
                },

                async loadSeasonEpisodes(seasonNumber, targetItem = this.selectedItem) {
                    const season = Number(seasonNumber);
                    if (!targetItem || targetItem.type !== 'tv' || !targetItem.tmdbId || !Number.isInteger(season) || season < 1) return;
                    if (!targetItem.tmdbEpisodesBySeason || typeof targetItem.tmdbEpisodesBySeason !== 'object') {
                        targetItem.tmdbEpisodesBySeason = {};
                    }
                    if (Object.prototype.hasOwnProperty.call(targetItem.tmdbEpisodesBySeason, season)) return;

                    const requestKey = String(targetItem.id) + ':' + season;
                    if (this.tmdbSeasonRequests[requestKey]) return this.tmdbSeasonRequests[requestKey];

                    this.tmdbSeasonLoading = true;
                    const request = (async () => {
                        try {
                            const seasonDetails = await this.fetchTmdb('tv/' + targetItem.tmdbId + '/season/' + season);
                            const episodes = (seasonDetails.episodes || []).map(episode => ({
                                number: episode.episode_number,
                                title: episode.name || ('Bölüm ' + episode.episode_number),
                                desc: episode.overview || 'Bu bölüm için açıklama bulunmuyor.',
                                duration: episode.runtime ? episode.runtime + ' dk' : '',
                                still: episode.still_path
                                    ? 'https://image.tmdb.org/t/p/w500' + episode.still_path
                                    : (targetItem.poster || '')
                            }));
                            targetItem.tmdbEpisodesBySeason[season] = episodes;
                            if (this.selectedItem?.id === targetItem.id) {
                                this.selectedItem.tmdbEpisodesBySeason = targetItem.tmdbEpisodesBySeason;
                            }
                        } catch (error) {
                            console.warn('TMDB sezon verisi alınamadı:', season, error);
                            targetItem.tmdbEpisodesBySeason[season] = [];
                        } finally {
                            delete this.tmdbSeasonRequests[requestKey];
                            this.tmdbSeasonLoading = Object.keys(this.tmdbSeasonRequests).length > 0;
                        }
                    })();
                    this.tmdbSeasonRequests[requestKey] = request;
                    return request;
                },

                async fetchTmdbDetails(item) {
                    if (!item || !item.tmdbId) return;
                    const cacheKey = item.type + ':' + item.tmdbId;
                    if (this.tmdbDetailsCache[cacheKey]) {
                        Object.assign(item, this.tmdbDetailsCache[cacheKey]);
                        if (item.type === 'tv') await this.loadSeasonEpisodes(this.selectedSeason || 1, item);
                        return;
                    }

                    this.tmdbDetailsLoading = true;
                    this.tmdbDetailsError = '';
                    try {
                        const mediaType = item.type === 'tv' ? 'tv' : 'movie';
                        const details = await this.fetchTmdb(mediaType + '/' + item.tmdbId + '?append_to_response=credits,videos');
                        const realSeasons = mediaType === 'tv'
                            ? (Array.isArray(details.seasons) ? details.seasons.filter(season => Number(season.season_number) > 0) : [])
                            : [];
                        const credits = details.credits || {};
                        const cast = (credits.cast || []).slice(0, 20).map((person, index) => ({
                            id: person.id,
                            name: person.name || '',
                            character: person.character || '',
                            profile: person.profile_path ? 'https://image.tmdb.org/t/p/w185' + person.profile_path : '',
                            order: person.order ?? index
                        }));
                        const crew = credits.crew || [];
                        const director = mediaType === 'movie'
                            ? (crew.find(person => person.job === 'Director')?.name || item.director || '')
                            : (crew.find(person => person.job === 'Executive Producer')?.name || item.director || '');
                        const videos = details.videos?.results || [];
                        const trailer = videos.find(video => video.site === 'YouTube' && video.type === 'Trailer');
                        const poster = details.poster_path ? 'https://image.tmdb.org/t/p/w500' + details.poster_path : item.poster;
                        const backdrop = details.backdrop_path ? 'https://image.tmdb.org/t/p/w1280' + details.backdrop_path : item.backdrop;
                        const genres = (details.genres || []).map(genre => genre.name).join(' / ');
                        const enriched = {
                            poster,
                            image: poster,
                            backdrop,
                            desc: details.overview || item.desc,
                            tmdbOverview: details.overview || item.tmdbOverview,
                            rating: String(details.vote_average ?? item.rating),
                            tmdbRating: String(details.vote_average ?? item.tmdbRating),
                            year: String((details.release_date || details.first_air_date || item.year || '')).slice(0, 4),
                            duration: mediaType === 'movie'
                                ? (details.runtime ? details.runtime + ' dk' : item.duration)
                                : (details.episode_run_time?.[0] ? details.episode_run_time[0] + ' dk / bölüm' : item.duration),
                            genre: genres || item.genre,
                            category: genres || item.category,
                            country: (details.production_countries || details.origin_country || []).map(country => typeof country === 'string' ? country : country.name).join(', ') || item.country,
                            director,
                            originalTitle: details.original_title || details.original_name || item.originalTitle,
                            tmdbCast: cast.length ? cast : (item.tmdbCast || []),
                            starring: cast.slice(0, 3).map(person => person.name).filter(Boolean).join(' / ') || item.starring,

                    if (video.duration) {
                        this.videoProgress = (video.currentTime / video.duration) * 100;
                        this.currentTimeFormatted = this.formatTime(video.currentTime);

                seekVideo(event) {
                    const video = document.getElementById('customVideoPlayer');
                    if (!video || !video.duration) return;
                    const rect = event.currentTarget.getBoundingClientRect();
                    const pos = (event.clientX - rect.left) / rect.width;
                    video.currentTime = pos * video.duration;

                skipTime(seconds) {
                    const video = document.getElementById('customVideoPlayer');

                        this.volumeLevel = restoredVolume;
                        video.volume = restoredVolume;
                        video.muted = false;
                        this.isMuted = false;

                getRouteHash(page = this.currentPage, item = this.selectedItem) {

                syncRouteToUrl(page = this.currentPage, item = this.selectedItem) {
                    const nextHash = this.getRouteHash(page, item);

                        window.history.replaceState(null, '', window.location.pathname + window.location.search + nextHash);

                restoreRouteFromUrl() {
                    const hash = window.location.hash || '';
                    const match = hash.match(/^#\/watch\/(.+)$/);
                    if (match) {
                        const itemId = decodeURIComponent(match[1]);
                        const item = this.catalog.find(entry => String(entry.id) === itemId);
                        if (item) {

                    }

                    const pageMatch = hash.match(/^#\/([^/?#]+)$/);
                    const page = pageMatch ? decodeURIComponent(pageMatch[1]) : 'home';
                    const allowedPages = ['home', 'explore', 'video-links', 'watchlist', 'stats'];

                get viewingStats() {
                    const safeRead = key => {
                        try { const value = safeStorageRead(key, {}); return value && typeof value === 'object' && !Array.isArray(value) ? value : {}; }
                        catch (error) { console.warn('İstatistik kaydı okunamadı:', key, error); return {}; }
                    };
                    const progressMap = this.profileMovieProgress;
                    const progressItems = Object.entries(progressMap).map(([id, saved]) => {
                        const item = this.catalog.find(entry => String(entry.id) === String(id));
                        const time = Math.max(0, Number(saved?.time) || 0);
                        const duration = Math.max(0, Number(saved?.duration) || 0);
                        if (!item || item.type !== 'movie' || !duration || !time) return null;
                        const percent = Math.min(100, time / duration * 100);
                        return { item, time, duration, percent, status: percent >= 90 ? 'Tamamlandı' : 'İzlemeye devam edebilirsin', savedAt: Number(saved.savedAt) || 0 };
                    }).filter(Boolean).sort((a, b) => b.savedAt - a.savedAt);
                    const episodeMap = safeRead('cine_episode_tracking_v1');
                    let watchedEpisodes = 0;
                    Object.entries(episodeMap).forEach(([key, value]) => {
                        if (!key.startsWith(this.currentProfileId + ':')) return;
                        Object.values(value?.watched || {}).forEach(list => {
                            if (Array.isArray(list)) watchedEpisodes += new Set(list.map(Number)).size;
                        });
                    });
                    const completed = progressItems.filter(entry => entry.percent >= 90);
                    const inProgress = progressItems.filter(entry => entry.percent > 0 && entry.percent < 90);
                    const totalSeconds = progressItems.reduce((sum, entry) => sum + entry.time, 0);
                    const minutes = Math.floor(totalSeconds / 60);
                    const savedTimeLabel = minutes >= 60
                        ? Math.floor(minutes / 60) + ' sa ' + (minutes % 60) + ' dk'
                        : minutes + ' dk';
                    const genreCounts = {};
                    completed.forEach(entry => {
                        String(entry.item.category || entry.item.genre || 'Diğer').split(/[\/;,]/).map(value => value.trim()).filter(Boolean).forEach(genre => {
                            genreCounts[genre] = (genreCounts[genre] || 0) + 1;
                        });
                    });
                    const topGenresRaw = Object.entries(genreCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
                    const maxGenre = Math.max(1, ...topGenresRaw.map(entry => entry[1]));
                    const topGenres = topGenresRaw.map(([name, count]) => ({ name, count, percent: count / maxGenre * 100 }));
                    return {
                        completedMovies: completed.length,
                        inProgressMovies: inProgress.length,
                        watchedEpisodes,
                        savedTimeLabel,
                        progressItems: progressItems.slice(0, 8),
                        topGenres
                    };
                },

                getSimilarItems(item) {
                    if (!item) return [];
                    const tokens = value => String(value || '').split(/[\/;,]/).map(part => this.normalizeSearchText(part)).filter(Boolean);
                    const sourceGenres = new Set([...tokens(item.category), ...tokens(item.genre)]);
                    const sourceCast = new Set((item.tmdbCast || item.cast || []).slice(0, 12).map(person => this.normalizeSearchText(typeof person === 'string' ? person : person.name)).filter(Boolean));
                    const sourceCountries = new Set(tokens(item.country));
                    const sourceYear = Number.parseInt(item.year, 10) || 0;
                    const sourceRating = Number.parseFloat(item.rating) || 0;

                    return this.catalog.filter(candidate => candidate.id !== item.id).map(candidate => {
                        const candidateGenres = new Set([...tokens(candidate.category), ...tokens(candidate.genre)]);
                        const candidateCast = (candidate.tmdbCast || candidate.cast || []).slice(0, 12).map(person => this.normalizeSearchText(typeof person === 'string' ? person : person.name)).filter(Boolean);
                        const candidateCountries = tokens(candidate.country);
                        let score = 0;
                        candidateGenres.forEach(genre => { if (sourceGenres.has(genre)) score += 5; });
                        candidateCast.forEach(name => { if (sourceCast.has(name)) score += 2; });
                        if (item.director && candidate.director && this.normalizeSearchText(item.director) === this.normalizeSearchText(candidate.director)) score += 4;
                        candidateCountries.forEach(country => { if (sourceCountries.has(country)) score += 1; });
                        if (item.type === candidate.type) score += 1;
                        const year = Number.parseInt(candidate.year, 10) || 0;
                        if (sourceYear && year) {
                            const distance = Math.abs(sourceYear - year);
                            if (distance <= 3) score += 2;
                            else if (distance <= 7) score += 1;
                        }
                        const rating = Number.parseFloat(candidate.rating) || 0;
                        if (sourceRating && rating && Math.abs(sourceRating - rating) <= 1) score += 1;
                        return { item: candidate, score };
                    }).sort((a, b) => b.score - a.score || a.item.title.localeCompare(b.item.title, 'tr')).slice(0, 12).map(entry => entry.item);
                },

                get personalizedRecommendations() {
                    const safeRead = key => {
                        try {
                            const value = safeStorageRead(key, {});
                            return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
                        } catch (error) {
                            console.warn('Kişiselleştirilmiş öneri verisi okunamadı:', key, error);
                            return {};
                        }
                    };
                    const tokens = value => String(value || '').split(/[\\/;,]/).map(part => this.normalizeSearchText(part)).filter(Boolean);
                    const profileId = this.currentProfileId;
                    const progress = this.profileMovieProgress;
                    const episodes = safeRead('cine_episode_tracking_v1');
                    const history = new Map();

                    Object.entries(progress).forEach(([id, saved]) => {
                        const item = this.catalog.find(entry => String(entry.id) === String(id));
                        const time = Math.max(0, Number(saved?.time) || 0);
                        if (item && time >= 300) history.set(String(item.id), { item, weight: 1 + Math.min(time / 3600, 2) });
                    });

                    Object.entries(episodes).forEach(([key, tracking]) => {
                        if (!key.startsWith(profileId + ':')) return;
                        const id = key.slice(profileId.length + 1);
                        const item = this.catalog.find(entry => String(entry.id) === String(id));
                        if (!item) return;
                        const watchedCount = Object.values(tracking?.watched || {}).reduce((sum, list) => sum + (Array.isArray(list) ? new Set(list.map(Number)).size : 0), 0);
                        if (watchedCount > 0) {
                            const previous = history.get(String(item.id));
                            history.set(String(item.id), { item, weight: Math.max(previous?.weight || 0, 1 + Math.min(watchedCount / 5, 3)) });
                        }
                    });

                    const watchlistItems = this.watchlist.map(saved => this.catalog.find(item => String(item.id) === String(saved.id))).filter(Boolean);
                    watchlistItems.forEach(item => {
                        if (!history.has(String(item.id))) history.set(String(item.id), { item, weight: 1.5 });
                    });

                    if (!history.size) {
                        return [...this.catalog]
                            .filter(item => item && item.id != null)
                            .sort((a, b) => (Number.parseFloat(b.rating) || 0) - (Number.parseFloat(a.rating) || 0))
                            .slice(0, 8);
                    }

                    const preferences = { genres: new Map(), types: new Map(), countries: new Map(), directors: new Map() };
                    history.forEach(({ item, weight }) => {
                        tokens(item.category || item.genre).forEach(value => preferences.genres.set(value, (preferences.genres.get(value) || 0) + weight));
                        if (item.type) preferences.types.set(item.type, (preferences.types.get(item.type) || 0) + weight);
                        tokens(item.country).forEach(value => preferences.countries.set(value, (preferences.countries.get(value) || 0) + weight * 0.35));
                        const director = this.normalizeSearchText(item.director);
                        if (director) preferences.directors.set(director, (preferences.directors.get(director) || 0) + weight * 0.8);
                    });

                    const excluded = new Set([...history.keys(), ...this.watchlist.map(item => String(item.id))]);
                    return this.catalog
                        .filter(item => item && item.id != null && !excluded.has(String(item.id)))
                        .map(item => {
                            let score = 0;
                            tokens(item.category || item.genre).forEach(value => score += (preferences.genres.get(value) || 0) * 3);
                            score += (preferences.types.get(item.type) || 0) * 0.5;
                            tokens(item.country).forEach(value => score += preferences.countries.get(value) || 0);
                            const director = this.normalizeSearchText(item.director);
                            if (director) score += preferences.directors.get(director) || 0;
                            score += Math.max(0, Number.parseFloat(item.rating) || 0) * 0.12;
                            return { item, score };
                        })
                        .sort((a, b) => b.score - a.score || a.item.title.localeCompare(b.item.title, 'tr'))
                        .slice(0, 8)
                        .map(entry => entry.item);
                },


                get personalizedDiscoveryGenres() {
                    const read = key => {
                        try {
                            const value = safeStorageRead(key, {});
                            return value && typeof value === 'object' && !Array.isArray(value) ? value : {};
                        } catch (error) {
                            console.warn('Keşif tercihleri okunamadı:', key, error);
                            return {};
                        }
                    };
                    const normalize = value => this.normalizeSearchText(value);
                    const counts = new Map();
                    const addItem = (item, weight) => {
                        if (!item) return;
                        const genres = [...new Set(String(item.category || item.genre || '').split(/[\\/;,]/).map(normalize).filter(Boolean))];
                        genres.forEach(genre => {
                            const existing = counts.get(genre) || { name: genre, score: 0 };
                            existing.score += weight;
                            counts.set(genre, existing);
                        });
                    };
                    const progress = this.profileMovieProgress;
                    Object.entries(progress).forEach(([id, saved]) => {
                        const item = this.catalog.find(entry => String(entry.id) === String(id));
                        const seconds = Math.max(0, Number(saved?.time) || 0);
                        if (item && seconds >= 300) addItem(item, 1 + Math.min(seconds / 3600, 2));
                    });
                    const episodeMap = read('cine_episode_tracking_v1');
                    Object.entries(episodeMap).forEach(([key, tracking]) => {
                        if (!key.startsWith(this.currentProfileId + ':')) return;
                        const id = key.slice(this.currentProfileId.length + 1);
                        const item = this.catalog.find(entry => String(entry.id) === String(id));
                        const count = Object.values(tracking?.watched || {}).reduce((sum, list) => sum + (Array.isArray(list) ? new Set(list.map(Number)).size : 0), 0);
                        if (item && count > 0) addItem(item, 1 + Math.min(count / 5, 3));
                    });
                    this.watchlist.forEach(saved => {
                        const item = this.catalog.find(entry => String(entry.id) === String(saved.id));
                        if (item) addItem(item, 1.5);
                    });
                    return [...counts.values()]
                        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, 'tr'))
                        .slice(0, 4)
                        .map(entry => ({
                            ...entry,
                            label: entry.name.charAt(0).toLocaleUpperCase('tr-TR') + entry.name.slice(1),
                            count: this.catalog.filter(item => String(item.category || item.genre || '').split(/[\\/;,]/).some(value => normalize(value) === entry.name)).length
                        }));
                },

                selectPersonalizedGenre(genre) {
                    this.searchQuery = '';
                    this.discoveryType = 'all';
                    this.discoveryCountry = 'all';
                    this.discoveryPlatform = 'all';
                    this.discoveryRating = '0';
                    this.discoveryYearFrom = '';
                    this.discoveryYearTo = '';
                    this.quickFilter = 'all';
                    this.sortBy = 'default';
                    this.discoveryGenre = genre;
                },

                get watchableCatalog() {
                    return this.catalog.filter(item => typeof item.watchUrl === 'string' && item.watchUrl.trim().length > 0);
                },

                get sortedFilteredCatalog() {
                    const query = this.normalizeSearchText(this.searchQuery);
                    let result = this.catalog.filter(item => {
                        const castNames = (item.tmdbCast || item.cast || []).map(person => typeof person === 'string' ? person : [person.name, person.character].filter(Boolean).join(' ')).join(' ');
                        const searchable = [
                            item.title, item.originalTitle, item.genre, item.category, item.desc,
                            item.director, item.starring, item.country, castNames, item.awards,
                            ...(Array.isArray(item.platform) ? item.platform : [item.platform || ''])
                        ].join(' ');
                        const matchesSearch = !query || this.normalizeSearchText(searchable).includes(query);
                        const matchesType = this.discoveryType === 'all' || item.type === this.discoveryType;
                        const genres = String(item.category || item.genre || '').split(/[\/;,]/).map(value => this.normalizeSearchText(value));
                        const matchesGenre = this.discoveryGenre === 'all' || genres.includes(this.normalizeSearchText(this.discoveryGenre)) || this.normalizeSearchText(item.genre) === this.normalizeSearchText(this.discoveryGenre);
                        const countries = String(item.country || '').split(/[,\/;]/).map(value => this.normalizeSearchText(value));
                        const matchesCountry = this.discoveryCountry === 'all' || countries.includes(this.normalizeSearchText(this.discoveryCountry));
                        const platforms = Array.isArray(item.platform) ? item.platform : (item.platform ? [item.platform] : []);
                        const matchesPlatform = this.discoveryPlatform === 'all' || platforms.some(value => this.normalizeSearchText(value) === this.normalizeSearchText(this.discoveryPlatform));
                        const rating = Number.parseFloat(item.rating) || 0;
                        const matchesRating = rating >= (Number(this.discoveryRating) || 0);
                        const year = Number.parseInt(item.year, 10) || 0;
                        const matchesYearFrom = !this.discoveryYearFrom || (year > 0 && year >= Number(this.discoveryYearFrom));
                        const matchesYearTo = !this.discoveryYearTo || (year > 0 && year <= Number(this.discoveryYearTo));
                        let matchesQuick = true;
                        if (this.quickFilter === 'imdb8') matchesQuick = rating >= 8;
                        if (this.quickFilter === 'series') matchesQuick = item.type === 'tv';
                        if (this.quickFilter === 'movies') matchesQuick = item.type === 'movie';
                        return matchesSearch && matchesType && matchesGenre && matchesCountry && matchesPlatform && matchesRating && matchesYearFrom && matchesYearTo && matchesQuick;
                    });

                    if (this.sortBy === 'rating') result.sort((a, b) => (Number.parseFloat(b.rating) || 0) - (Number.parseFloat(a.rating) || 0));
                    else if (this.sortBy === 'year') result.sort((a, b) => (Number.parseInt(b.year, 10) || 0) - (Number.parseInt(a.year, 10) || 0));
                    else if (this.sortBy === 'oldest') result.sort((a, b) => (Number.parseInt(a.year, 10) || 9999) - (Number.parseInt(b.year, 10) || 9999));
                    else if (this.sortBy === 'title') result.sort((a, b) => a.title.localeCompare(b.title, 'tr'));
                    return result;
                }
            }
        }
    </script>
