<!--
  Perde Koleksiyonlar sayfası.
  Yayımlanmış seçkileri bağımsız, gecikmeli bir sayfada listeler; seçim açıldığında koleksiyondaki tüm yapımları gösterir.
-->
<template x-if="currentPage === 'collections'">
    <div x-data="{ query: '', selectedId: '', sortMode: 'featured' }" class="w-full px-4 sm:px-8 lg:px-12 pt-7 sm:pt-9 pb-16 space-y-7">
        <template x-if="!selectedId">
            <div class="space-y-7">
                <header class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                    <div class="min-w-0">
                        <p class="text-[10px] font-black uppercase tracking-[.24em] text-rose-600 dark:text-rose-400">PERDE • ÖZEL SEÇKİLER</p>
                        <h1 class="mt-2 text-2xl sm:text-3xl font-black tracking-tight text-gray-900 dark:text-white">Koleksiyonlar</h1>
                        <p class="mt-2 max-w-2xl text-xs sm:text-sm leading-relaxed text-gray-500 dark:text-gray-400">Editör seçkilerini keşfet, koleksiyonların içindeki tüm film ve dizilere göz at.</p>
                    </div>
                    <span class="shrink-0 text-xs font-bold text-gray-500 dark:text-gray-400"><b class="text-rose-600 dark:text-rose-400" x-text="publishedCollections.length"></b> yayımlanmış koleksiyon</span>
                </header>

                <div class="flex flex-col sm:flex-row gap-3">
                    <label class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-sm text-gray-400"></i>
                        <input x-model.trim="query" type="search" placeholder="Koleksiyon adı veya açıklama ara…" class="w-full rounded-xl border border-gray-200 bg-white py-3 pl-10 pr-4 text-sm text-gray-900 outline-none transition focus:border-rose-500 dark:border-gray-700 dark:bg-[#151922] dark:text-white">
                    </label>
                    <select x-model="sortMode" aria-label="Koleksiyon sıralaması" class="rounded-xl border border-gray-200 bg-white px-4 py-3 text-xs font-bold text-gray-700 outline-none focus:border-rose-500 dark:border-gray-700 dark:bg-[#151922] dark:text-gray-200">
                        <option value="featured">Öne çıkan sırası</option>
                        <option value="name">İsme göre A–Z</option>
                        <option value="count">Yapım sayısı</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-5">
                    <template x-for="collection in publishedCollections.filter(item => !query || normalizeSearchText(item.title + ' ' + (item.description || '')).includes(normalizeSearchText(query))).slice().sort((a,b) => sortMode === 'name' ? a.title.localeCompare(b.title, 'tr') : sortMode === 'count' ? b.items.length - a.items.length : 0)" :key="'collection-browser-' + collection.id">
                        <button type="button" @click="selectedId = String(collection.id); window.scrollTo({top:0,behavior:'smooth'})" class="group min-w-0 overflow-hidden rounded-2xl border border-gray-200 bg-white text-left shadow-sm transition duration-300 hover:-translate-y-1 hover:border-rose-500/50 hover:shadow-xl dark:border-white/10 dark:bg-[#151922]">
                            <div class="relative aspect-[4/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
                                <template x-if="collection.coverMode === 'mix'">
                                    <div class="grid h-full w-full grid-cols-2 grid-rows-2 gap-0.5">
                                        <template x-for="coverItem in collection.coverItems" :key="'browser-cover-'+collection.id+'-'+coverItem.id">
                                            <img :src="coverItem.poster || coverItem.image || coverItem.backdrop || coverItem.tmdbPoster" :alt="coverItem.title" loading="lazy" decoding="async" class="h-full w-full min-h-0 min-w-0 object-cover">
                                        </template>
                                    </div>
                                </template>
                                <template x-if="collection.coverMode === 'auto'">
                                    <img :src="collection.coverItems[0]?.poster || collection.coverItems[0]?.image || collection.coverItems[0]?.backdrop || collection.coverItems[0]?.tmdbPoster" :alt="collection.title" loading="lazy" decoding="async" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
                                </template>
                                <template x-if="collection.coverMode === 'url'">
                                    <img :src="collection.image || collection.cover || collection.backdrop" :alt="collection.title" loading="lazy" decoding="async" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
                                </template>
                                <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-transparent to-transparent"></div>
                                <span class="absolute bottom-3 left-3 rounded-full border border-white/20 bg-black/55 px-2.5 py-1 text-[9px] font-black text-white backdrop-blur" x-text="collection.items.length + ' YAPIM'"></span>
                            </div>
                            <div class="space-y-2 p-3.5 sm:p-4">
                                <h2 class="line-clamp-2 text-sm sm:text-base font-black leading-snug text-gray-900 dark:text-white" x-text="collection.title"></h2>
                                <p x-show="collection.description" class="line-clamp-2 min-h-[2.5em] text-[10px] sm:text-xs leading-relaxed text-gray-500 dark:text-gray-400" x-text="collection.description"></p>
                                <span class="inline-flex items-center gap-1.5 pt-1 text-[10px] font-black uppercase tracking-wide text-rose-600 dark:text-rose-400">Koleksiyonu keşfet <i class="fa-solid fa-arrow-right transition-transform group-hover:translate-x-1"></i></span>
                            </div>
                        </button>
                    </template>
                </div>

                <div x-show="publishedCollections.filter(item => !query || normalizeSearchText(item.title + ' ' + (item.description || '')).includes(normalizeSearchText(query))).length === 0" class="rounded-2xl border border-dashed border-gray-300 px-6 py-14 text-center dark:border-gray-700">
                    <i class="fa-solid fa-layer-group text-2xl text-gray-400"></i>
                    <p class="mt-3 text-sm font-bold text-gray-700 dark:text-gray-200">Eşleşen koleksiyon bulunamadı</p>
                    <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Arama ifadesini değiştirebilir veya temizleyebilirsin.</p>
                    <button type="button" @click="query = ''" class="mt-4 rounded-lg border border-gray-300 px-4 py-2 text-xs font-bold text-gray-700 hover:border-rose-500 dark:border-gray-600 dark:text-gray-200">Aramayı temizle</button>
                </div>
            </div>
        </template>

        <template x-if="selectedId">
            <div class="space-y-6">
                <button type="button" @click="selectedId = ''; window.scrollTo({top:0,behavior:'smooth'})" class="inline-flex items-center gap-2 rounded-lg border border-gray-200 px-3 py-2 text-xs font-bold text-gray-600 transition hover:border-rose-500 hover:text-rose-600 dark:border-gray-700 dark:text-gray-300">
                    <i class="fa-solid fa-arrow-left"></i> Tüm koleksiyonlar
                </button>
                <template x-if="publishedCollections.find(item => String(item.id) === selectedId)">
                    <div class="space-y-6">
                        <header class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-5 rounded-2xl border border-gray-200 bg-white p-4 sm:p-5 dark:border-white/10 dark:bg-[#151922]">
                            <div class="h-28 w-24 shrink-0 overflow-hidden rounded-xl bg-gray-100 dark:bg-gray-900">
                                <template x-if="publishedCollections.find(item => String(item.id) === selectedId).coverMode === 'mix'">
                                    <div class="grid h-full w-full grid-cols-2 grid-rows-2 gap-0.5">
                                        <template x-for="coverItem in publishedCollections.find(item => String(item.id) === selectedId).coverItems" :key="'detail-cover-'+coverItem.id">
                                            <img :src="coverItem.poster || coverItem.image || coverItem.backdrop || coverItem.tmdbPoster" alt="" class="h-full w-full object-cover">
                                        </template>
                                    </div>
                                </template>
                                <template x-if="publishedCollections.find(item => String(item.id) === selectedId).coverMode === 'auto'">
                                    <img :src="publishedCollections.find(item => String(item.id) === selectedId).coverItems[0]?.poster || publishedCollections.find(item => String(item.id) === selectedId).coverItems[0]?.image || publishedCollections.find(item => String(item.id) === selectedId).coverItems[0]?.backdrop || publishedCollections.find(item => String(item.id) === selectedId).coverItems[0]?.tmdbPoster" alt="" class="h-full w-full object-cover">
                                </template>
                                <template x-if="publishedCollections.find(item => String(item.id) === selectedId).coverMode === 'url'">
                                    <img :src="publishedCollections.find(item => String(item.id) === selectedId).image || publishedCollections.find(item => String(item.id) === selectedId).cover || publishedCollections.find(item => String(item.id) === selectedId).backdrop" alt="" class="h-full w-full object-cover">
                                </template>
                            </div>
                            <div class="min-w-0">
                                <p class="text-[10px] font-black uppercase tracking-[.22em] text-rose-600 dark:text-rose-400">PERDE • KOLEKSİYON</p>
                                <h1 class="mt-1 text-xl sm:text-2xl font-black text-gray-900 dark:text-white" x-text="publishedCollections.find(item => String(item.id) === selectedId).title"></h1>
                                <p class="mt-2 text-xs leading-relaxed text-gray-500 dark:text-gray-400" x-text="publishedCollections.find(item => String(item.id) === selectedId).description || 'Bu koleksiyonda senin için seçilmiş film ve diziler yer alıyor.'"></p>
                                <p class="mt-2 text-[10px] font-bold text-rose-600 dark:text-rose-400" x-text="publishedCollections.find(item => String(item.id) === selectedId).items.length + ' yapım'"></p>
                            </div>
                        </header>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
                            <template x-for="(item,index) in publishedCollections.find(entry => String(entry.id) === selectedId).items" :key="'collection-detail-item-'+selectedId+'-'+item.id">
                                <button type="button" @click="openWatchPage(item)" class="group min-w-0 overflow-hidden rounded-xl border border-gray-200 bg-white text-left shadow-sm transition hover:-translate-y-0.5 hover:border-rose-500/60 dark:border-white/10 dark:bg-[#151922]">
                                    <div class="relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
                                        <img :src="item.poster || item.image || item.backdrop || item.tmdbPoster" :srcset="getTmdbImageSrcSet(item.poster || item.image || item.backdrop || item.tmdbPoster, [185,342,500])" sizes="(max-width:639px) 44vw, (max-width:1023px) 28vw, 18vw" :alt="item.title" loading="lazy" decoding="async" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105">
                                        <span class="absolute left-2 top-2 rounded bg-black/75 px-1.5 py-1 text-[8px] font-black text-white" x-text="item.type === 'tv' || item.type === 'series' ? 'DİZİ' : 'FİLM'"></span>
                                        <span class="absolute bottom-2 right-2 rounded bg-black/80 px-1.5 py-1 text-[9px] font-black text-amber-300"><i class="fa-solid fa-star mr-1"></i><span x-text="Number(item.rating || item.tmdbRating) > 0 ? Number(item.rating || item.tmdbRating).toFixed(1) : '—'"></span></span>
                                    </div>
                                    <div class="p-2.5"><h2 class="line-clamp-2 text-[11px] sm:text-xs font-extrabold leading-snug text-gray-900 dark:text-white" x-text="item.title"></h2><p class="mt-1 text-[9px] text-gray-500 dark:text-gray-400" x-text="item.year || ''"></p></div>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
                <div x-show="!publishedCollections.some(item => String(item.id) === selectedId)" class="rounded-xl border border-dashed border-gray-300 p-8 text-center text-sm text-gray-500 dark:border-gray-700">Bu koleksiyon artık yayımlanmıyor.</div>
            </div>
        </template>
    </div>
</template>
