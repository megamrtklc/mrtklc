<!--
  Perde ana sayfa parçası: İzlemeye Devam Et bölümünün HTML içeriği.
  Ana kapsayıcı homepage.html içinde kalır; bu dosya görünür alana yaklaşınca yüklenir.
-->

                    <div class="home-continue-heading flex items-end justify-between gap-3 pb-3">
                        <div class="min-w-0">
                            <p class="text-[10px] font-black uppercase tracking-[0.22em] text-rose-700 dark:text-rose-400 mb-1">KALDIĞIN YERDEN</p>
                            <h2 class="text-xl sm:text-2xl font-black uppercase tracking-wider text-gray-900 dark:text-white">İzlemeye Devam Et</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1"><span x-text="currentProfile.name"></span> profiline ait izleme ilerlemesi</p>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="home-continue-count text-[10px] font-bold text-gray-500 dark:text-gray-400" x-text="homeSectionReady.continue ? continueWatchingItems.length + ' yapım' : ''"></span>
                            <button type="button" @click="navigateTo('library')" class="home-continue-all text-[10px] font-black text-rose-500 hover:text-rose-400 ml-1 whitespace-nowrap">Tümünü Gör <i class="fa-solid fa-arrow-right ml-1"></i></button>
                        </div>
                    </div>
                    <div id="home-continue-rail" class="home-card-rail home-continue-rail">
                        <template x-for="entry in (homeSectionReady.continue ? continueWatchingItems.slice(0,30) : [])" :key="'continue-' + entry.kind + '-' + entry.item.id">
                            <button type="button" @click="resumeLibraryItem(entry)" :class="getCardClass()" class="home-rail-card home-continue-card group min-w-0 flex flex-col text-left rounded-xl overflow-hidden border transition-all duration-300">
                                <div class="home-continue-poster relative w-full aspect-video overflow-hidden bg-gray-100 dark:bg-gray-900">
                                    <img :alt="entry.item.title" @error="handleImageError($event)" decoding="async" loading="lazy" :src="entry.item.backdrop || entry.item.backdropPath || entry.item.image || entry.item.poster || entry.item.tmdbPoster" :srcset="getTmdbImageSrcSet(entry.item.backdrop || entry.item.backdropPath || entry.item.image || entry.item.poster || entry.item.tmdbPoster, [185, 342, 500])" sizes="(max-width:639px) 19vw, (max-width:1023px) 22vw, 19vw" class="home-continue-image absolute inset-0 w-full h-full object-cover transition-transform duration-700">
                                    <div class="home-continue-shade absolute inset-0"></div>
                                    <span class="home-continue-type absolute top-1.5 left-1.5 rounded-md bg-black/70 text-white text-[8px] font-black uppercase tracking-wider px-1.5 py-1" x-text="entry.kind === 'series' ? 'DİZİ' : 'FİLM'"></span>
                                    <span class="home-continue-play absolute left-1/2 top-1/2 w-11 h-11 -translate-x-1/2 -translate-y-1/2 rounded-full flex items-center justify-center text-white"><i class="fa-solid fa-play text-sm ml-0.5"></i></span>
                                </div>
                                <div class="home-continue-copy flex flex-1 min-w-0 flex-col justify-between gap-2 p-2.5">
                                    <div class="min-w-0">
                                        <h3 class="text-xs sm:text-sm font-extrabold text-gray-900 dark:text-white line-clamp-2" x-text="entry.item.title"></h3>
                                        <p class="home-continue-original mt-0.5 text-[10px] leading-snug text-gray-500 dark:text-gray-400 line-clamp-1" x-show="entry.item.originalTitle && entry.item.originalTitle !== entry.item.title" x-text="'Original: ' + entry.item.originalTitle"></p>
                                        <div class="mt-1 flex items-center justify-between gap-2 min-w-0">
                                            <p class="home-continue-label text-[10px] leading-snug text-gray-500 dark:text-gray-400 line-clamp-1 min-w-0" x-text="entry.label"></p>
                                            <span class="home-continue-imdb shrink-0 inline-flex items-center gap-1 rounded px-1.5 py-0.5 text-[9px] font-black text-amber-600 dark:text-amber-400" x-show="entry.item.ratingCount || entry.item.rating || entry.item.tmdbRating"><i class="fa-brands fa-imdb text-[11px]"></i><span x-text="(String(entry.item.ratingCount || '').match(/[0-9]+(?:\\.[0-9]+)?/) || [entry.item.rating || entry.item.tmdbRating || '—'])[0]"></span></span>
                                        </div>
                                    </div>
                                    <div class="space-y-1.5">
                                        <div class="home-continue-progress h-1.5 rounded-full overflow-hidden"><div class="home-continue-progress-fill h-full rounded-full" :style="'width:' + entry.percent + '%'"></div></div>
                                        <div class="flex items-center justify-between gap-1 text-[9px] text-gray-500 dark:text-gray-400">
                                            <span class="min-w-0 line-clamp-1" x-text="entry.kind === 'series' ? entry.watchedCount + (entry.total ? ' / ' + entry.total + ' bölüm' : ' bölüm izlendi') : Math.floor(entry.time / 60) + ' dk izlendi'"></span>
                                            <span class="font-black text-amber-500 tabular-nums shrink-0" x-text="entry.percent + '%'"></span>
                                        </div>
                                    </div>
                                </div>
                            </button>
                        </template>
                    </div>
                    <div class="home-continue-controls flex items-center justify-center gap-3 pt-1">
                        <button type="button" @click="scrollHomeCards('home-continue-rail',-1)" aria-label="Önceki izleme kayıtları" class="home-rail-arrow"><i class="fa-solid fa-chevron-left"></i></button>
                        <span class="text-[9px] font-bold tracking-wider text-gray-400 uppercase">Diğer yapımlar</span>
                        <button type="button" @click="scrollHomeCards('home-continue-rail',1)" aria-label="Sonraki izleme kayıtları" class="home-rail-arrow"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
