<!--
  Perde ana sayfa parçası: Seri Filmler bölümünün HTML içeriği.
  Ana kapsayıcı homepage.html içinde kalır; bu dosya görünür alana yaklaşınca yüklenir.
-->

                    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 border-b border-gray-200/70 dark:border-white/10 pb-4">
                        <div><p class="text-[10px] font-black uppercase tracking-[0.22em] text-rose-600 dark:text-rose-400 mb-1.5">BİRLİKTE İZLE, SERİYİ TAMAMLA</p><h2 class="text-xl sm:text-2xl font-black uppercase tracking-wider text-gray-900 dark:text-white">Seri Filmler</h2><p class="mt-2 text-xs text-gray-500 dark:text-gray-400">Favori film serilerini tek yerde keşfet.</p></div>
                        <button type="button" @click="navigateTo('franchises')" class="inline-flex items-center gap-2 self-start sm:self-auto text-xs font-bold text-rose-600 dark:text-rose-400 hover:gap-3 transition-all">Tüm serileri gör <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                        <template x-for="franchise in (homeSectionReady.franchises ? featuredFranchises.slice(0, 8) : [])" :key="'home-franchise-'+franchise.id">
                            <button type="button" @click="openFranchise(franchise)" class="group relative min-w-0 overflow-hidden rounded-2xl border border-gray-200 dark:border-white/10 bg-white dark:bg-[#151922] text-left shadow-sm transition duration-300 hover:-translate-y-1 hover:border-rose-500/50 hover:shadow-xl">
                                <div class="relative overflow-hidden bg-gray-900" style="aspect-ratio:16/6"><img :src="franchise.backdrop || franchise.poster" :srcset="getTmdbImageSrcSet(franchise.backdrop || franchise.poster, [342, 500, 780])" sizes="(max-width: 639px) calc((100vw - 60px) / 2), calc((100vw - 144px) / 4)" :alt="franchise.title" loading="lazy" decoding="async" class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105"><div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div><span class="hidden sm:inline-flex absolute left-3 top-3 rounded-full border border-white/20 bg-black/45 px-2.5 py-1 text-[9px] font-black uppercase tracking-wider text-white backdrop-blur">FİLM SERİSİ</span><div class="absolute inset-x-3 bottom-3 hidden sm:block"><h3 class="text-sm sm:text-base font-black text-white line-clamp-1" x-text="franchise.title"></h3><p class="mt-1 text-[10px] font-semibold text-white/75" x-text="franchise.count + ' film · ' + franchise.firstYear + (franchise.lastYear !== franchise.firstYear ? '–' + franchise.lastYear : '')"></p></div></div>
                                <div class="hidden sm:flex items-center justify-between gap-2 px-3 py-2.5"><span class="truncate text-[10px] text-gray-500 dark:text-gray-400" x-text="franchise.description"></span><i class="fa-solid fa-arrow-right shrink-0 text-xs text-rose-500 transition-transform group-hover:translate-x-1"></i></div><div class="sm:hidden px-3 py-2.5"><h3 class="text-sm font-black text-gray-900 dark:text-white line-clamp-1" x-text="franchise.title"></h3><p class="mt-1 text-[10px] font-semibold text-gray-500 dark:text-gray-400" x-text="franchise.count + ' film · ' + franchise.firstYear + (franchise.lastYear !== franchise.firstYear ? '–' + franchise.lastYear : '')"></p></div>
                            </button>
                        </template>
                    </div>
