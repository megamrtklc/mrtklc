<!--
  Perde ana sayfa parçası: İzlediklerim bölümünün HTML içeriği.
  Ana kapsayıcı homepage.html içinde kalır; bu dosya görünür alana yaklaşınca yüklenir.
-->

                    <div class="flex items-end justify-between gap-3 border-b border-gray-200 dark:border-gray-800 pb-3"><div><p class="text-[10px] font-black uppercase tracking-[0.2em] text-emerald-600 dark:text-emerald-400">İZLEME GEÇMİŞİ</p><h2 class="mt-1 text-xl sm:text-2xl font-black text-gray-900 dark:text-white">İzlediklerim</h2><p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Tamamladığın film ve diziler</p></div><span class="text-[10px] font-bold text-gray-500 dark:text-gray-400" x-text="watchedItems.length + ' yapım'"></span></div>
                    <div id="home-watched-rail" class="home-card-rail home-new-arrivals-rail">
                        <template x-for="(item,index) in watchedItems.slice(0,12)" :key="'home-watched-' + item.id">
                            <div class="contents">
                                <template x-if="index === 0">
<div @click="openWatchPage(item)" :class="getCardClass()" class="home-rail-card home-new-arrival-card home-catalog-card group rounded-xl overflow-hidden border transition-all duration-300 cursor-pointer flex flex-col shadow-sm">
                                        <div class="relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
<span class="absolute top-2 left-2 z-[3] inline-flex items-center gap-1 rounded-md border border-amber-300/35 bg-black/85 px-2 py-1 text-[9px] font-black text-amber-300 shadow-lg backdrop-blur-sm"><i class="fa-solid fa-star text-[8px]"></i><span x-text="(item.rating || item.tmdbRating) ? Number(item.rating || item.tmdbRating).toFixed(1) : '—'"></span></span>

                                            <img :alt="item.title" @error="handleImageError($event)" decoding="async" loading="lazy" :src="getTmdbImageSrcSet(item.poster || item.image || item.tmdbPoster || item.backdrop, [154]).split(' ')[0] || item.poster || item.image || item.tmdbPoster || item.backdrop" :srcset="getTmdbImageSrcSet(item.poster || item.image || item.tmdbPoster || item.backdrop, [154, 185, 260, 312, 342])" sizes="(max-width: 639px) 148px, 178px" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"> <span x-show="item._catalogMissing" class="absolute bottom-2 left-2 z-10 rounded-md border border-amber-300/40 bg-black/85 px-2 py-1 text-[8px] font-black tracking-wide text-amber-200 shadow-lg">KATALOGDA YOK</span>
                                            <span class="absolute top-2 right-2 rounded-md bg-black/80 px-2 py-1 text-[9px] font-black text-white" x-text="item.type === 'tv' || item.type === 'series' ? 'DİZİ' : 'FİLM'"></span>

                                        </div>
                                        <div class="p-3 flex flex-col flex-grow justify-between space-y-1">
                                            <div>
                                                <span class="text-[9px] font-bold text-emerald-600 dark:text-emerald-400 uppercase" x-text="item.genre || item.category || item.tmdbGenres || 'GENEL'"></span>
                                                <h3 class="font-bold text-xs text-gray-900 dark:text-white line-clamp-1 group-hover:text-emerald-500 transition-colors" x-text="item.title"></h3>
                                            </div>
                                            <div class="flex items-center justify-between text-[10px] text-gray-500 dark:text-gray-400 pt-1 border-t border-gray-200 dark:border-gray-800/60">
                                                <span x-text="item.year || item.tmdbReleaseDate?.slice(0,4) || '—'"></span>
                                                <span x-text="item.duration || ''"></span>
                                            </div>
                                        </div>
                                    </div>
                </template>
                                <template x-if="index !== 0">
                                    <div @click="openWatchPage(item)" :class="getCardClass()" class="home-rail-card home-new-arrival-card home-catalog-card group rounded-xl overflow-hidden border transition-all duration-300 cursor-pointer flex flex-col shadow-sm">
                                        <div class="relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
<span class="absolute top-2 left-2 z-[3] inline-flex items-center gap-1 rounded-md border border-amber-300/35 bg-black/85 px-2 py-1 text-[9px] font-black text-amber-300 shadow-lg backdrop-blur-sm"><i class="fa-solid fa-star text-[8px]"></i><span x-text="(item.rating || item.tmdbRating) ? Number(item.rating || item.tmdbRating).toFixed(1) : '—'"></span></span>

                                            <img :alt="item.title" @error="handleImageError($event)" decoding="async" loading="lazy" :src="getTmdbImageSrcSet(item.poster || item.image || item.tmdbPoster || item.backdrop, [154]).split(' ')[0] || item.poster || item.image || item.tmdbPoster || item.backdrop" :srcset="getTmdbImageSrcSet(item.poster || item.image || item.tmdbPoster || item.backdrop, [154, 185, 260, 312, 342])" sizes="(max-width: 639px) 148px, 178px" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"> <span x-show="item._catalogMissing" class="absolute bottom-2 left-2 z-10 rounded-md border border-amber-300/40 bg-black/85 px-2 py-1 text-[8px] font-black tracking-wide text-amber-200 shadow-lg">KATALOGDA YOK</span>
                                            <span class="absolute top-2 right-2 rounded-md bg-black/80 px-2 py-1 text-[9px] font-black text-white" x-text="item.type === 'tv' || item.type === 'series' ? 'DİZİ' : 'FİLM'"></span>

                                        </div>
                                        <div class="p-3 flex flex-col flex-grow justify-between space-y-1">
                                            <div>
                                                <span class="text-[9px] font-bold text-emerald-600 dark:text-emerald-400 uppercase" x-text="item.genre || item.category || item.tmdbGenres || 'GENEL'"></span>
                                                <h3 class="font-bold text-xs text-gray-900 dark:text-white line-clamp-1 group-hover:text-emerald-500 transition-colors" x-text="item.title"></h3>
                                            </div>
                                            <div class="flex items-center justify-between text-[10px] text-gray-500 dark:text-gray-400 pt-1 border-t border-gray-200 dark:border-gray-800/60">
                                                <span x-text="item.year || item.tmdbReleaseDate?.slice(0,4) || '—'"></span>
                                                <span x-text="item.duration || ''"></span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
