<!--
  Perde ana sayfa parçası: İzleme Listem bölümünün HTML içeriği.
  Ana kapsayıcı homepage.html içinde kalır; bu dosya görünür alana yaklaşınca yüklenir.
-->

                    <div class="home-watchlist-heading flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 pb-4">
                        <div>
                            <p class="text-[10px] font-black uppercase tracking-[0.22em] text-rose-700 dark:text-rose-400 mb-1">SONRA İZLE</p>
                            <h2 class="text-xl sm:text-2xl font-black uppercase tracking-wider text-gray-900 dark:text-white">İzleme Listem</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Bir sonraki film veya dizin burada seni bekliyor</p>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="text-[10px] font-bold text-gray-500 dark:text-gray-400 tabular-nums" x-text="homeSectionReady.watchlist ? watchlist.length + ' yapım' : ''"></span>
                            <button type="button" @click="scrollHomeCards('home-watchlist-rail',-1)" aria-label="Önceki listedeki yapımlar" class="home-rail-arrow"><i class="fa-solid fa-chevron-left"></i></button>
                            <button type="button" @click="scrollHomeCards('home-watchlist-rail',1)" aria-label="Sonraki listedeki yapımlar" class="home-rail-arrow"><i class="fa-solid fa-chevron-right"></i></button>
                            <button type="button" @click="navigateTo('watchlist')" class="text-[10px] font-black text-rose-500 hover:text-rose-400 ml-1">Tüm liste <i class="fa-solid fa-arrow-right ml-1"></i></button>
                        </div>
                    </div>
                    <div id="home-watchlist-rail" class="home-card-rail home-watchlist-rail">
                        <template x-for="item in (homeSectionReady.watchlist ? watchlist.slice(0,8) : [])" :key="'home-watchlist-' + item.id">
                            <button type="button" @click="openWatchPage(item)" :class="getCardClass()" class="home-rail-card home-watchlist-card group min-w-0 text-left rounded-xl overflow-hidden border transition-all duration-300">
                                <div class="home-watchlist-poster relative aspect-video overflow-hidden bg-gray-100 dark:bg-gray-900">
                                    <img :alt="item.title" @error="handleImageError($event)" decoding="async" loading="lazy" :src="item.backdrop || item.backdropPath || item.poster || item.image || item.tmdbPoster" :srcset="getTmdbImageSrcSet(item.backdrop || item.backdropPath || item.poster || item.image || item.tmdbPoster)" sizes="(max-width:639px) 84vw, (max-width:1023px) 31vw, 22vw" class="w-full h-full object-cover transition-transform duration-700">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/5 to-transparent"></div>
                                    <span class="absolute top-3 left-3 inline-flex items-center gap-1.5 rounded-full bg-black/65 text-rose-300 px-2.5 py-1.5 backdrop-blur-md"><i class="fa-solid fa-bookmark text-[10px]"></i><span class="text-[8px] font-black tracking-widest">SONRA İZLE</span></span>
                                    <span class="absolute bottom-3 left-3 right-3 text-white text-xs font-extrabold leading-snug line-clamp-2" x-text="item.title"></span>
                                </div>
                                <div class="home-watchlist-copy px-3 py-2.5">
                                    <p class="text-[10px] font-semibold text-gray-500 dark:text-gray-400 line-clamp-1" x-text="item.year || 'İzleme listende'"></p>
                                </div>
                            </button>
                        </template>
                    </div>
