                                <button type="button" @click="favoriteFilter='series'; favoritePage=1" :aria-pressed="favoriteFilter==='series'" :class="favoriteFilter==='series' ? 'bg-amber-400 text-gray-950 border-amber-400' : 'bg-transparent text-gray-500 border-gray-300 dark:border-gray-700 dark:text-gray-300'" class="rounded-full border px-3 py-1.5 text-[10px] font-extrabold transition-colors">Diziler</button>
                            </div>
                            <label class="flex items-center gap-2 text-[10px] font-bold text-gray-500 dark:text-gray-400">
                                <span>Sırala</span>
                                <select x-model="favoriteSort" @change="favoritePage=1" class="min-h-[34px] rounded-lg border border-gray-300 bg-white/80 px-3 text-[10px] font-bold text-gray-700 outline-none transition focus:border-amber-400 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100">
                                    <option value="new">Son eklenenler</option><option value="old">İlk eklenenler</option><option value="rating">IMDb puanı</option><option value="az">İsim (A–Z)</option><option value="year">Yapım yılı</option>
                                </select>
                            </label>
                        </div>
                    </div>
                    <div x-show="filteredFavorites.length" class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-8 gap-4 sm:gap-5 lg:gap-6">
                        <template x-for="item in filteredFavorites.slice((favoritePage - 1) * pageSize, favoritePage * pageSize)" :key="'library-favorite-' + item.id">
                            <button type="button" @click="openWatchPage(item)" :class="getCardClass()" class="group min-w-0 overflow-hidden rounded-xl border text-left hover:border-amber-400/60 transition-colors">
                                <div class="relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
                                    <img :alt="item.title" @error="handleImageError($event)" loading="lazy" decoding="async" :src="item.poster || item.image || item.tmdbPoster || item.backdrop" class="h-full w-full object-cover group-hover:scale-105 transition-transform">
                                    <span class="absolute left-2 top-2 rounded bg-amber-400 px-2 py-1 text-[8px] font-black text-gray-950">FAVORİ</span>
                                    <span class="absolute right-2 top-2 rounded bg-black/75 px-2 py-1 text-[8px] font-black text-white" x-text="item.type === 'tv' || item.type === 'series' ? 'DİZİ' : 'FİLM'"></span>
                                </div>
                                <div class="p-2"><p class="line-clamp-2 text-[10px] font-bold text-gray-900 dark:text-white" x-text="item.title"></p><p class="mt-1 text-[9px] text-gray-500 dark:text-gray-400" x-text="(item.rating || item.tmdbRating) ? '★ ' + Number(item.rating || item.tmdbRating).toFixed(1) : (item.year || '')"></p></div>
                            </button>
                        </template>
                    </div>
                    <div x-show="filteredFavorites.length === 0" class="rounded-xl border border-dashed border-gray-300 dark:border-gray-700 p-6 text-center text-xs text-gray-500 dark:text-gray-400">Bu filtrede henüz favori yapım bulunmuyor.</div>
                    <div x-show="filteredFavorites.length > pageSize" class="flex items-center justify-between gap-3 border-t border-gray-200 pt-3 dark:border-gray-800">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400"><span x-text="(favoritePage - 1) * pageSize + 1"></span>–<span x-text="Math.min(favoritePage * pageSize, filteredFavorites.length)"></span> / <span x-text="filteredFavorites.length"></span> yapım</p>
                        <div class="flex items-center gap-1.5">
                            <button type="button" @click="favoritePage = Math.max(1, favoritePage - 1)" :disabled="favoritePage === 1" class="flex h-8 w-8 items-center justify-center rounded-lg border border-gray-200 text-gray-600 disabled:opacity-35 dark:border-gray-700 dark:text-gray-300" aria-label="Önceki sayfa"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
                            <template x-for="page in Array.from({length: Math.ceil(filteredFavorites.length / pageSize)}, (_, index) => index + 1)" :key="'favorite-page-' + page"><button type="button" @click="favoritePage = page" :aria-current="favoritePage === page ? 'page' : null" :class="favoritePage === page ? 'border-amber-500 bg-amber-500 text-gray-950' : 'border-gray-200 text-gray-600 dark:border-gray-700 dark:text-gray-300'" class="h-8 min-w-8 rounded-lg border px-2 text-[10px] font-bold" x-text="page"></button></template>
                            <button type="button" @click="favoritePage = Math.min(Math.ceil(filteredFavorites.length / pageSize), favoritePage + 1)" :disabled="favoritePage >= Math.ceil(filteredFavorites.length / pageSize)" class="flex h-8 w-8 items-center justify-center rounded-lg border border-gray-200 text-gray-600 disabled:opacity-35 dark:border-gray-700 dark:text-gray-300" aria-label="Sonraki sayfa"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                        </div>
                    </div>
                </section>
            </div>
        </template>
