<!--
  Perde İzleme / Yapım Detay görünümü
  -----------------------------------
  currentPage === 'watch' olduğunda gösterilen oynatıcı, izleme kontrolleri,
  yapım bilgileri, oyuncu kadrosu ve benzer yapımlar alanını içerir.
  Kök Alpine uygulamasının kapsamını kullanır; tek başına çalıştırılmaz.
-->
<!-- ==================== WATCH / DETAIL PAGE ==================== -->
        <template x-if="currentPage === 'watch'">
            <div class="w-full px-6 sm:px-12 pt-2 space-y-6 pb-16" @keydown.escape.window="cinemaMode = false; document.body.style.overflow = ''" @keydown.window="handlePlayerKeydown($event)">
                <div x-show="cinemaMode" x-transition.opacity @click="toggleCinemaMode()" class="fixed inset-0 z-[90] bg-black/95 backdrop-blur-md"></div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

                    <!--
  İzleme sayfasının sol kolonu: video oynatıcı, sezon/bölüm takibi,
  yapım açıklaması, oyuncu kadrosu ve topluluk yorumlarını içerir.
  Ana watch şablonunun Alpine kapsamını kullanır.
-->
                    <!-- Left Section -->
                    <div id="watch-left-column" class="lg:col-span-8 flex flex-col space-y-6">

                        <!-- Custom Video Player -->
                        <div data-watch-card="player" :style="cinemaMode ? 'position:fixed;left:50%;top:50%;right:auto;bottom:auto;margin:0;transform:translate3d(-50%,-50%,0);width:min(80vw,1400px);max-height:88vh;aspect-ratio:16/9;z-index:100;' : 'order: ' + getWatchCardOrder('player')" :class="cinemaMode ? 'rounded-xl border border-white/15 shadow-[0_0_80px_rgba(0,0,0,0.8)]' : 'relative w-full rounded-2xl border border-gray-200 dark:border-gray-800 shadow-2xl'" class="aspect-video overflow-hidden bg-black group select-none transition-all duration-300" @mouseenter="showPlayerControls()" @mousemove="showPlayerControls()" @mouseleave="hidePlayerControlsOnLeave()">
                            <div x-show="cinemaMode && cinemaNoticeVisible" x-transition.opacity.duration.500ms class="pointer-events-none absolute left-3 top-3 z-30 rounded-lg border border-amber-300/50 bg-black/75 px-3 py-1.5 text-[11px] font-extrabold tracking-wide text-amber-200 shadow-lg backdrop-blur-md" role="status" aria-live="polite">Sinema modu : Açık</div>
                            <video id="customVideoPlayer"
                                   x-show="isDirectVideoUrl(getPlaybackUrl())"
                                   class="w-full h-full object-contain [touch-action:manipulation]"
                                   :src="getPlaybackUrl()"
                                   :style="'filter: brightness(' + videoBrightness + ')'"
                                   :poster="selectedItem.backdrop"
                                   preload="metadata"
                                   playsinline
                                   @click="showPlayerControls()"
                                   @loadedmetadata="updateVideoProgress(); applyPlaybackRate(); $event.target.volume = isMuted ? 0 : volumeLevel; $event.target.muted = isMuted"
                                   @timeupdate="updateVideoProgress"
                                   @play="pauseNoticeVisible = false; isPlaying = true; hasPlaybackStarted = true; schedulePlayerSideControls(); showPlaybackFeedback('play', 5000); schedulePlayerControlsHide()"
                                   @pause="pauseNoticeVisible = !$event.target.ended && hasPlaybackStarted; isPlaying = false; revealPlayerSideControls(); showPlayerControls()"
                                   @ended="videoEnded = true; pauseNoticeVisible = false; isPlaying = false; showPlayerControls()"
                                   @error="playbackError = true">
                                Tarayıcınız video etiketini desteklemiyor.
                            </video>
                            <div x-cloak x-show="pauseNoticeVisible && isDirectVideoUrl(getPlaybackUrl())" x-transition.opacity.duration.200ms class="pointer-events-none absolute inset-0 z-10 bg-black/35" aria-hidden="true"></div>

                            <!-- YouTube-style double-tap seek zones -->
                            <div id="cvTapSeekZones" x-show="isDirectVideoUrl(getPlaybackUrl()) && hasPlaybackStarted" class="absolute inset-x-0 top-0 bottom-[76px] z-[11] grid grid-cols-3" style="touch-action:manipulation" aria-label="Çift dokunarak videoyu sar">
                                <div @click="showPlayerControls()" @pointerup.stop="handleSeekTap('backward', $event)"></div>
                                <div @click="showPlayerControls()"></div>
                                <div @click="showPlayerControls()" @pointerup.stop="handleSeekTap('forward', $event)"></div>
                                <div x-cloak x-show="tapSeekSide !== ''" :class="tapSeekPulse ? 'cv-tap-seek-pop' : ''" :style="{ left: tapSeekX + 'px', top: tapSeekY + 'px' }" class="cv-tap-seek-feedback pointer-events-none absolute -translate-x-1/2 -translate-y-1/2 text-center text-white">
                                    <span class="cv-tap-seek-orbit"></span>
                                    <span class="cv-tap-seek-core">
                                        <i x-show="tapSeekSide === 'backward'" class="fa-solid fa-rotate-left"></i>
                                        <i x-show="tapSeekSide === 'forward'" class="fa-solid fa-rotate-right"></i>
                                    </span>
                                    <span class="cv-tap-seek-label"><strong x-text="tapSeekAmount"></strong><span x-show="tapSeekSide === 'backward'"> saniye geri</span><span x-show="tapSeekSide === 'forward'"> saniye ileri</span></span>
                                </div>
                            </div>
                            <div x-show="hasPlaybackStarted && playerControlsVisible && playerSideControlsVisible" x-transition.opacity x-data="{ brightnessOpen: false }" @mouseenter="brightnessOpen = true" @mouseleave="brightnessOpen = false" @click.stop class="absolute top-[45px] left-3 z-40">
                                <button type="button" @click="brightnessOpen = true; showPlayerControls()" @focus="showPlayerControls()" aria-label="Video parlaklığını ayarla" title="Video parlaklığı" class="flex h-10 w-10 items-center justify-center rounded-full border border-white/20 bg-black/65 text-white shadow-lg backdrop-blur-md transition hover:border-amber-300/60 hover:bg-black/85 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-300">
                                    <i class="fa-solid fa-sun"></i>
                                </button>
                                <div x-show="brightnessOpen" x-transition.opacity @click.stop class="absolute left-0 top-12 flex min-w-[54px] flex-col items-center gap-2 rounded-xl border border-white/15 bg-[#10141d]/95 px-3 py-3 text-white shadow-2xl backdrop-blur-xl">
                                    <span class="font-mono text-[10px] font-bold text-amber-200" x-text="Math.round(videoBrightness * 100) + '%'"></span>
                                    <input type="range" min="0.5" max="1.5" step="0.05" :value="videoBrightness" @input="setVideoBrightness($event.target.value); showPlayerControls()" aria-label="Dikey video parlaklığı" title="Video parlaklığı" style="writing-mode:vertical-lr;direction:rtl; width:8px;height:96px; accent-color:#e7c477; touch-action:pan-y;" class="cursor-pointer">
                                    <button type="button" @click="setVideoBrightness(1); showPlayerControls()" class="mt-1 rounded-lg bg-white/10 px-2 py-1 text-[10px] font-bold hover:bg-white/20" aria-label="Parlaklığı sıfırla">Sıfırla</button>
                                </div>
                            </div>
                            <div x-show="hasPlaybackStarted && playerControlsVisible && playerSideControlsVisible" x-transition.opacity x-data="{ volumeOpen: false }" @mouseenter="volumeOpen = true" @mouseleave="volumeOpen = false" @click.stop class="absolute top-[45px] right-3 z-40">
                                <button type="button" @click="volumeOpen = true; showPlayerControls()" @focus="showPlayerControls()" :aria-label="isMuted ? 'Sesi aç' : 'Ses seviyesini ayarla'" :title="isMuted ? 'Sesi Aç' : 'Ses Seviyesi'" class="flex h-10 w-10 items-center justify-center rounded-full border border-white/20 bg-black/65 text-white shadow-lg backdrop-blur-md transition hover:border-amber-300/60 hover:bg-black/85 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-300">
                                    <i :class="isMuted || volumeLevel === 0 ? 'fa-solid fa-volume-xmark' : volumeLevel < 0.5 ? 'fa-solid fa-volume-low' : 'fa-solid fa-volume-high'"></i>
                                </button>
                                <div x-show="volumeOpen" x-transition.opacity @click.stop class="absolute right-0 top-12 flex min-w-[54px] flex-col items-center gap-2 rounded-xl border border-white/15 bg-[#10141d]/95 px-3 py-3 text-white shadow-2xl backdrop-blur-xl">
                                    <span class="font-mono text-[10px] font-bold text-amber-200" x-text="Math.round((isMuted ? 0 : volumeLevel) * 100) + '%'"></span>
                                    <input type="range" min="0" max="1" step="0.01" :value="isMuted ? 0 : volumeLevel" @input="setVideoVolume($event.target.value); showPlayerControls()" aria-label="Dikey ses seviyesi" title="Ses seviyesi" style="writing-mode:vertical-lr;direction:rtl; width:8px;height:96px; accent-color:#e7c477; touch-action:pan-y;" class="cursor-pointer">
                                    <button type="button" @click="toggleMute(); showPlayerControls()" class="mt-1 flex h-8 w-8 items-center justify-center rounded-lg bg-white/10 text-xs hover:bg-white/20" :aria-label="isMuted ? 'Sesi aç' : 'Sesi kapat'">
                                        <i :class="isMuted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high'"></i>
                                    </button>
                                </div>
                            </div>
                            <div x-cloak x-show="isDirectVideoUrl(getPlaybackUrl()) && !hasPlaybackStarted" class="absolute inset-0 z-10 cursor-pointer bg-black" @click.stop="startPlayback()">
                                <img @error="handleImageError($event)" decoding="async" loading="eager" :src="selectedItem.backdrop || selectedItem.poster" :alt="selectedItem.title + ' kapak görseli'" class="absolute inset-0 h-full w-full object-cover object-center brightness-110 saturate-125">
                                <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-black/20"></div>

                                <div class="pointer-events-none absolute bottom-3 left-3 z-20 flex flex-col items-start sm:bottom-5 sm:left-5">
                                    <div x-show="selectedItem.rating !== undefined && selectedItem.rating !== null && selectedItem.rating !== '' && Number(selectedItem.rating) > 0" class="mb-1.5 inline-flex items-center gap-1.5 rounded-md border border-white/15 bg-black/75 px-2 py-1 text-[10px] font-extrabold leading-none text-white shadow-lg backdrop-blur-md sm:text-xs">
                                        <span class="rounded-sm bg-[#f5c518] px-1 py-0.5 text-[9px] font-black text-black">IMDb</span>
                                        <span x-text="Number(selectedItem.rating).toFixed(1)"></span>
                                    </div>
                                    <img @error="handleImageError($event)" decoding="async" loading="eager" :src="selectedItem.poster || selectedItem.backdrop" :alt="selectedItem.title + ' afişi'" class="h-[114px] w-[77px] rounded-lg border border-amber-200/60 object-cover shadow-2xl shadow-black/60 sm:h-[162px] sm:w-[108px] sm:rounded-xl">
                                </div>

                                <button type="button" @click.stop="startPlayback()" class="group absolute left-1/2 top-1/2 z-20 flex h-[76px] w-[76px] -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border border-amber-100 bg-gradient-to-br from-[#fff0c2] via-[#e9c36f] to-[#b9822e] text-[#17130a] shadow-[0_0_24px_rgba(231,196,119,0.38),inset_0_1px_5px_rgba(255,255,255,0.65)] transition duration-500 hover:scale-110 hover:shadow-[0_0_38px_rgba(231,196,119,0.62)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-amber-200 sm:h-[88px] sm:w-[88px]" :aria-label="selectedItem.title + ' filmini oynat'">
                                    <span class="pointer-events-none absolute inset-[-10px] rounded-full border border-amber-200/55 animate-pulse"></span>
                                    <span class="pointer-events-none absolute inset-[-4px] rounded-full border border-white/35"></span>
                                    <i class="fa-solid fa-play relative ml-1 text-2xl drop-shadow-sm sm:text-3xl"></i>
                                </button>

                                <button type="button" @click.stop="watchTrailerOpen = true" class="absolute bottom-3 right-3 z-30 inline-flex min-h-9 items-center gap-2 rounded-lg border border-amber-200/40 bg-black/70 px-3 py-2 text-[11px] font-bold text-white shadow-lg shadow-amber-300/10 backdrop-blur-md transition duration-500 hover:scale-105 hover:border-amber-200/80 hover:bg-black/85 hover:shadow-[0_0_18px_rgba(231,196,119,0.22)] animate-pulse motion-reduce:animate-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-200 sm:bottom-5 sm:right-5 sm:px-4" :aria-label="selectedItem.title + ' fragmanı'">
                                    <i class="fa-solid fa-clapperboard text-amber-200"></i>
                                    <span>Fragman</span>
                                </button>
                            </div>
                            <div x-cloak x-show="!isDirectVideoUrl(getPlaybackUrl())" class="absolute inset-0 overflow-hidden bg-gray-950 text-white">
                                <img @error="handleImageError($event)" decoding="async" loading="eager" :src="selectedItem.backdrop || selectedItem.poster" :alt="selectedItem.title + ' arka plan görseli'" class="cv-no-url-backdrop absolute inset-0 h-full w-full object-cover brightness-110 saturate-125 opacity-70">
                                <div class="pointer-events-none absolute inset-0 bg-gradient-to-br from-gray-950/65 via-gray-950/25 to-gray-950/70"></div>

                                <div class="pointer-events-none absolute bottom-3 left-3 z-20 flex flex-col items-start sm:bottom-5 sm:left-5">
                                    <div x-show="selectedItem.rating !== undefined && selectedItem.rating !== null && selectedItem.rating !== '' && Number(selectedItem.rating) > 0" class="mb-1.5 inline-flex items-center gap-1.5 rounded-md border border-white/15 bg-black/75 px-2 py-1 text-[10px] font-extrabold leading-none text-white shadow-lg backdrop-blur-md sm:text-xs">
                                        <span class="rounded-sm bg-[#f5c518] px-1 py-0.5 text-[9px] font-black text-black">IMDb</span>
                                        <span x-text="Number(selectedItem.rating).toFixed(1)"></span>
                                    </div>
                                    <img @error="handleImageError($event)" decoding="async" loading="eager" :src="selectedItem.poster || selectedItem.backdrop" :alt="selectedItem.title + ' afişi'" class="h-[114px] w-[77px] rounded-lg border border-amber-200/60 object-cover shadow-2xl shadow-black/60 sm:h-[162px] sm:w-[108px] sm:rounded-xl">
                                </div>

                                <div class="absolute left-[104px] right-3 bottom-[62px] z-10 max-h-[46%] overflow-y-auto rounded-lg border border-white/15 bg-black/55 px-3 py-2 text-left shadow-xl backdrop-blur-md sm:left-[140px] sm:right-5 sm:bottom-[62px] sm:rounded-xl sm:px-4 sm:py-3 landscape:top-1/2 landscape:bottom-auto landscape:-translate-y-1/2 landscape:max-w-[min(48%,420px)]">
                                    <div class="mb-1 flex items-center gap-1.5 text-amber-200">
                                        <i class="fa-solid fa-circle-info text-[10px]"></i>
                                        <span class="text-[9px] font-black uppercase tracking-[0.14em] sm:text-[10px]">Oynatıcı bilgisi</span>
                                    </div>
                                    <p class="text-[10px] leading-relaxed text-gray-100 sm:text-xs" x-text="selectedItem.watchUrl ? 'Bu kaynak yerleşik oynatıcıda açılamıyor. Harici platformdan izlemek için bağlantıyı açabilirsin.' : 'Bu yapım için henüz bir izleme bağlantısı eklenmemiş.'"></p>
                                    <a x-show="selectedItem.watchUrl" :href="selectedItem.watchUrl" target="_blank" rel="noopener noreferrer" class="mt-1.5 inline-flex items-center gap-1.5 rounded-lg border border-white/20 bg-white/10 px-2.5 py-1 text-[9px] font-bold text-white transition hover:bg-white/20 sm:mt-2 sm:px-3 sm:py-1.5 sm:text-[10px]">Kaynağı Aç <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                                </div>

                                <button type="button" @click.stop="watchTrailerOpen = true" class="absolute bottom-3 right-3 z-30 inline-flex min-h-9 items-center gap-2 rounded-lg border border-amber-200/40 bg-black/70 px-3 py-2 text-[11px] font-bold text-white shadow-lg shadow-amber-300/10 backdrop-blur-md transition duration-500 hover:scale-105 hover:border-amber-200/80 hover:bg-black/85 hover:shadow-[0_0_18px_rgba(231,196,119,0.22)] animate-pulse motion-reduce:animate-none focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-200 sm:bottom-5 sm:right-5 sm:px-4" :aria-label="selectedItem.title + ' fragmanı'">
                                    <i class="fa-solid fa-clapperboard text-amber-200"></i>
                                    <span>Fragman</span>
                                </button>
                            </div>

                            <div x-show="playbackError && isDirectVideoUrl(getPlaybackUrl())" class="absolute inset-x-0 top-4 left-1/2 z-30 flex w-[min(92%,420px)] -translate-x-1/2 items-center justify-between gap-3 rounded-xl border border-red-400/25 bg-red-950/95 px-4 py-3 text-xs font-semibold text-white shadow-2xl">
                                <span>Video yüklenemedi. Bağlantıyı kontrol edip yeniden deneyebilirsin.</span>
                                <button type="button" @click="startPlayback()" class="shrink-0 rounded-lg bg-white/15 px-3 py-2 font-black hover:bg-white/25">Yeniden Dene</button>
                            </div>
                            <div x-show="videoEnded && selectedItem.type === 'tv'" class="absolute inset-0 z-30 flex items-center justify-center bg-black/65 p-4">
                                <button type="button" @click="goToNextEpisode()" class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-[#e7c477] to-[#b98b38] px-5 py-3 text-sm font-black text-black shadow-xl">
                                    Sonraki Bölüm <i class="fa-solid fa-forward-step"></i>
                                </button>
                            </div>

                            <!-- Centered transport controls with feedback anchored below each button -->
                            <div x-show="isDirectVideoUrl(getPlaybackUrl()) && hasPlaybackStarted && (playerControlsVisible || !isPlaying)" x-transition.opacity @click.stop class="pointer-events-none absolute inset-0 z-20 flex items-center justify-center gap-8 sm:gap-14">
                                <div class="relative flex flex-col items-center">
                                    <button type="button" @click="skipTime(-10); showPlayerControls()" aria-label="10 saniye geri sar" title="10 saniye geri" class="pointer-events-auto flex h-12 w-12 sm:h-16 sm:w-16 flex-col items-center justify-center rounded-full border border-white/20 bg-black/55 text-white shadow-xl backdrop-blur-md transition hover:scale-105 hover:bg-black/80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-amber-300">
                                        <i class="fa-solid fa-rotate-left text-lg sm:text-xl"></i><span class="mt-0.5 text-[9px] font-black">10 SN</span>
                                    </button>
                                    <div x-cloak x-show="playbackFeedbackVisible && playbackFeedback === 'backward'" x-transition.opacity.duration.150ms class="absolute left-1/2 top-full mt-3 -translate-x-1/2 whitespace-nowrap rounded-full border border-white/15 bg-black/75 px-3 py-1.5 text-[10px] font-black tracking-wider text-white shadow-lg backdrop-blur-md">
                                        <i class="fa-solid fa-rotate-left mr-1 text-amber-300"></i>10 SN GERİ
                                    </div>
                                </div>
                                <div class="relative flex flex-col items-center">
                                    <button type="button" @click="togglePlay(); showPlayerControls()" :aria-label="isPlaying ? 'Duraklat' : 'Oynat'" class="pointer-events-auto flex h-14 w-14 sm:h-20 sm:w-20 items-center justify-center rounded-full border border-white/25 bg-black/60 text-white shadow-2xl backdrop-blur-md transition hover:scale-105 hover:bg-black/85 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-amber-300">
                                        <i :class="isPlaying ? 'fa-solid fa-pause text-xl sm:text-2xl' : 'fa-solid fa-play text-xl sm:text-2xl ml-1'"></i>
                                    </button>
                                    <div x-cloak x-show="pauseNoticeVisible || (playbackFeedbackVisible && playbackFeedback === 'play')" x-transition.opacity.duration.150ms class="absolute left-1/2 top-full mt-3 flex -translate-x-1/2 flex-col items-center gap-1.5 whitespace-nowrap rounded-xl border border-white/15 bg-black/80 px-3 py-2 text-white shadow-lg backdrop-blur-md">
                                        <div class="text-[10px] font-black tracking-wider">
                                            <i :class="pauseNoticeVisible ? 'fa-solid fa-pause' : 'fa-solid fa-play'" class="mr-1 text-amber-300"></i>
                                            <span x-text="pauseNoticeVisible ? 'DURAKLATILDI' : 'OYNATILIYOR'"></span>
                                        </div>
                                        <span x-show="pauseNoticeVisible" class="text-[9px] font-medium tracking-normal text-white/75">Devam etmek için "Oynat" butonuna tıkla.</span>
                                    </div>
                                </div>
                                <div class="relative flex flex-col items-center">
                                    <button type="button" @click="skipTime(10); showPlayerControls()" aria-label="10 saniye ileri sar" title="10 saniye ileri" class="pointer-events-auto flex h-12 w-12 sm:h-16 sm:w-16 flex-col items-center justify-center rounded-full border border-white/20 bg-black/55 text-white shadow-xl backdrop-blur-md transition hover:scale-105 hover:bg-black/80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-amber-300">
                                        <i class="fa-solid fa-rotate-right text-lg sm:text-xl"></i><span class="mt-0.5 text-[9px] font-black">10 SN</span>
                                    </button>
                                    <div x-cloak x-show="playbackFeedbackVisible && playbackFeedback === 'forward'" x-transition.opacity.duration.150ms class="absolute left-1/2 top-full mt-3 -translate-x-1/2 whitespace-nowrap rounded-full border border-white/15 bg-black/75 px-3 py-1.5 text-[10px] font-black tracking-wider text-white shadow-lg backdrop-blur-md">
                                        <i class="fa-solid fa-rotate-right mr-1 text-amber-300"></i>10 SN İLERİ
                                    </div>
                                </div>
                            </div>

                            <!-- Overlay Controls -->
                            <div x-show="isDirectVideoUrl(getPlaybackUrl()) && hasPlaybackStarted && (playerControlsVisible || !isPlaying)" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0 translate-y-2" @click.stop style="background:linear-gradient(to top, rgba(0,0,0,.96) 0%, rgba(0,0,0,.82) 38%, rgba(0,0,0,.48) 72%, rgba(0,0,0,0) 100%);padding-top:38px" class="absolute inset-x-0 bottom-0 px-4 pb-1 flex flex-col justify-end space-y-1">
                                <div class="flex items-center justify-between mb-1">
                                    <div class="flex items-center space-x-2">
                                        <span class="px-2.5 py-0.5 rounded bg-rose-600 text-white text-[10px] font-black uppercase" x-text="selectedItem.title"></span>
                                        <span class="text-xs text-gray-300 font-semibold" x-show="selectedItem.type === 'tv'" x-text="'Sezon ' + selectedSeason + ' • Bölüm ' + selectedEpisode"></span>

                                    </div>
                                    <button @click="skipIntro()" class="px-3 py-1 rounded bg-white/20 hover:bg-white/30 backdrop-blur-md text-white text-xs font-bold border border-white/30 transition-all flex items-center space-x-1.5">
                                        <i class="fa-solid fa-forward text-[10px]"></i>
                                        <span>Jeneriği Geç</span>
                                    </button>
                                </div>

                                <!-- Premium seek bar: mouse, touch and remote friendly -->
                                <div class="cv-player-seek-wrap" @click.stop>
                                    <input
                                        class="cv-player-seek"
                                        type="range"
                                        min="0"
                                        max="100"
                                        step="0.1"
                                        :value="videoProgress"
                                        :style="'--cv-seek-progress:' + videoProgress + '%'"
                                        @input="const v = document.getElementById('customVideoPlayer'); if (v && v.duration) { v.currentTime = (Number($event.target.value) / 100) * v.duration; }"
                                        @change="showPlayerControls()"
                                        @focus="showPlayerControls()"
                                        @pointermove="const v = document.getElementById('customVideoPlayer'); const r = $event.currentTarget.getBoundingClientRect(); if (v && v.duration && r.width) $event.currentTarget.title = new Date((($event.clientX-r.left)/r.width)*v.duration*1000).toISOString().slice(14,19)"
                                        aria-label="Video ilerleme çubuğu"
                                        title="İleri veya geri sar">
                                </div>

                                <div class="flex items-center justify-between text-xs text-gray-200 pt-1">
                                    <div class="flex items-center space-x-3">
                                        <span class="font-mono text-xs font-bold text-gray-300" x-text="currentTimeFormatted + ' / ' + durationFormatted"></span>
                                    </div>

                                    <div class="flex items-center gap-2 sm:gap-3">
                                        <div x-data="{ playerMenuOpen: false }" class="relative">

                                            <button type="button" @click="openRelatedDiscoveries('country', country.name, country.code)" class="inline-flex items-center gap-1.5 font-semibold text-gray-800 dark:text-gray-200 hover:text-rose-500 hover:underline underline-offset-4 whitespace-nowrap" :title="country.name + ' yapımlarını keşfet'">
                                                <img x-show="country.flagUrl" :src="country.flagUrl" :alt="country.name + ' bayrağı'" width="20" height="14" loading="lazy" class="h-3.5 w-5 rounded-[2px] border border-black/10 object-cover">
                                                <span x-text="country.name"></span>
                                            </button>
                                        </template>
                                        <span x-show="!getCountryEntries(selectedItem.country).length" class="font-semibold text-gray-500">—</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Oyuncu Kadrosu -->
                        <div data-watch-card="cast" :style="'order: ' + getWatchCardOrder('cast')" :class="getCardClass()" class="p-5 rounded-2xl border space-y-4 shadow-sm" x-show="selectedItem.tmdbCast && selectedItem.tmdbCast.length > 0">
                            <div class="flex items-center justify-between">
                                <h3 class="text-xs font-black uppercase tracking-wider text-gray-900 dark:text-white flex items-center space-x-2">
                                    <i class="fa-solid fa-users text-rose-600 text-xs"></i>
                                    <span>Oyuncu Kadrosu</span>
                                </h3>
                                <div class="flex space-x-1.5">
                                    <button @click="scrollCast(-1)" :class="getCardClass()" class="w-7 h-7 rounded-lg border hover:opacity-80 text-gray-800 dark:text-white flex items-center justify-center text-xs transition-colors">
                                        <i class="fa-solid fa-chevron-left"></i>
                                    </button>
                                    <button @click="scrollCast(1)" :class="getCardClass()" class="w-7 h-7 rounded-lg border hover:opacity-80 text-gray-800 dark:text-white flex items-center justify-center text-xs transition-colors">
                                        <i class="fa-solid fa-chevron-right"></i>
                                    </button>
                                </div>
                            </div>

                            <div id="castContainer" class="flex items-center space-x-3 overflow-x-auto no-scrollbar pb-2 scroll-smooth">
                                <template x-for="actor in (selectedItem.tmdbCast || []).slice(0, 6)" :key="actor.name">
                                    <div @click="actor.id && openActorProfile(actor)" @keydown.enter.prevent="actor.id && openActorProfile(actor)" tabindex="0" role="button" :aria-label="actor.name + ' oyuncu profilini aç'" :class="getCardClass()" class="w-24 flex-shrink-0 p-2.5 rounded-xl border flex flex-col items-center text-center space-y-2 transition-all duration-300 hover:scale-110 hover:border-rose-500 focus:outline-none focus:ring-2 focus:ring-rose-500 cursor-pointer group">
                                        <div class="w-12 h-12 rounded-full bg-gray-200 dark:bg-gray-800 overflow-hidden shadow-md ring-2 ring-gray-300 dark:ring-gray-700 group-hover:ring-rose-500 transition-all">
                                            <img :alt="'Oyuncu fotoğrafı'" @error="handleImageError($event)" decoding="async" loading="lazy" :src="actor.profile || 'https://placehold.co/150x150/161922/ffffff?text=Photo'" :srcset="getTmdbImageSrcSet(actor.profile, [45, 92])" sizes="48px" class="w-full h-full object-cover">
                                        </div>
                                        <div class="w-full">
                                            <h4 class="font-bold text-[11px] text-gray-900 dark:text-white line-clamp-1 group-hover:text-rose-500 transition-colors" x-text="actor.name"></h4>
                                            <p class="text-[9px] text-gray-500 dark:text-gray-400 line-clamp-1" x-text="actor.character"></p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Benzer Yapımlar -->
                        <div data-watch-card="similar" :style="'order: ' + getWatchCardOrder('similar')" :class="getCardClass()" class="p-5 rounded-2xl border space-y-4 shadow-sm">
                            <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-800 pb-3">
                                <h3 class="text-xs font-black uppercase tracking-wider text-gray-900 dark:text-white flex items-center space-x-2">
                                    <i class="fa-solid fa-layer-group text-rose-600 text-xs"></i>
                                    <span>Benzer Yapımlar</span>
                                </h3>
                                <div class="flex space-x-1.5">
                                    <button @click="scrollSimilar(-1)" :class="getCardClass()" class="w-7 h-7 rounded-lg border hover:opacity-80 text-gray-800 dark:text-white flex items-center justify-center text-xs transition-colors">
                                        <i class="fa-solid fa-chevron-left"></i>
                                    </button>
                                    <button @click="scrollSimilar(1)" :class="getCardClass()" class="w-7 h-7 rounded-lg border hover:opacity-80 text-gray-800 dark:text-white flex items-center justify-center text-xs transition-colors">
                                        <i class="fa-solid fa-chevron-right"></i>
                                    </button>
                                </div>
                            </div>

                            <div id="similarContainer" class="flex items-center space-x-3.5 overflow-x-auto no-scrollbar pb-2 scroll-smooth">
                                <template x-for="sim in getSimilarItems(selectedItem)" :key="sim.id">
                                    <div @click="openWatchPage(sim)" :class="getCardClass()" class="w-28 flex-shrink-0 cursor-pointer p-2 rounded-xl border hover:border-gray-300 dark:hover:border-gray-700 transition-colors flex flex-col items-center text-center space-y-2 group">
                                        <div class="w-24 aspect-[2/3] rounded-lg overflow-hidden bg-black shadow-md">
                                            <img :alt="sim.title" @error="handleImageError($event)" decoding="async" loading="lazy" :src="sim.poster" :srcset="getTmdbImageSrcSet(sim.poster, [92, 154, 185])" sizes="96px" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110">
                                        </div>
                                        <h5 class="font-bold text-[11px] text-gray-800 dark:text-white line-clamp-1 w-full group-hover:text-rose-500 transition-colors" x-text="sim.title"></h5>
                                    </div>
                                </template>
                            </div>
                        </div>

                    </div>
                </div>
                </div>


            </div>
        </template>
