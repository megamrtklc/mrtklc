<!--
  Seri filmler rehberi ve seçilen serinin izleme sırası detay görünümü.
  Kök Alpine uygulamasının franchise verilerini ve gezinme metotlarını kullanır.
-->
<template x-if="currentPage === 'franchises'">
            <div class="w-full px-6 sm:px-12 pt-8 space-y-7 pb-16">
                <template x-if="!selectedFranchise">
                    <div class="space-y-7">
                        <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3"><div><p class="text-[10px] font-black uppercase tracking-[0.22em] text-rose-600 dark:text-rose-400 mb-2">PERDE • SERİ REHBERİ</p><h2 class="text-2xl sm:text-3xl font-black uppercase tracking-wide text-gray-900 dark:text-white">Seri Filmler</h2><p class="mt-2 max-w-2xl text-xs sm:text-sm text-gray-500 dark:text-gray-400">Birbirine bağlı filmleri serilerine göre keşfet, izleme sırasını takip et.</p></div><span class="text-xs font-bold text-gray-500 dark:text-gray-400"><b class="text-rose-600 dark:text-rose-400" x-text="franchiseEntries.length"></b> film serisi</span></div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                            <template x-for="franchise in franchiseEntries" :key="'franchise-page-'+franchise.id">
                                <button type="button" @click="openFranchise(franchise)" class="group overflow-hidden rounded-2xl border border-gray-200 dark:border-white/10 bg-white dark:bg-[#151922] text-left shadow-sm transition duration-300 hover:-translate-y-1 hover:border-rose-500/50 hover:shadow-xl">
                                    <div class="relative overflow-hidden bg-gray-900" style="aspect-ratio:16/6"><img :src="franchise.backdrop || franchise.poster" :srcset="getTmdbImageSrcSet(franchise.backdrop || franchise.poster, [342, 500, 780])" sizes="(max-width: 639px) 90vw, (max-width: 1023px) 45vw, 30vw" :alt="franchise.title" loading="lazy" decoding="async" class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105"><div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/15 to-transparent"></div><span class="hidden sm:inline-flex absolute left-3 top-3 rounded-full bg-black/45 px-2.5 py-1 text-[9px] font-black uppercase tracking-wider text-white backdrop-blur">FİLM SERİSİ</span><div class="absolute inset-x-3 bottom-3 hidden sm:block"><h3 class="text-base font-black text-white" x-text="franchise.title"></h3><p class="mt-1 text-[10px] font-semibold text-white/75" x-text="franchise.count + ' film · ' + franchise.firstYear + (franchise.lastYear !== franchise.firstYear ? '–' + franchise.lastYear : '')"></p></div></div>
                                    <div class="hidden sm:flex items-center justify-between gap-2 p-3"><p class="line-clamp-2 text-[10px] leading-relaxed text-gray-500 dark:text-gray-400" x-text="franchise.description"></p><i class="fa-solid fa-arrow-right shrink-0 text-rose-500"></i></div><div class="sm:hidden px-3 py-2.5"><h3 class="text-sm font-black text-gray-900 dark:text-white line-clamp-1" x-text="franchise.title"></h3><p class="mt-1 text-[10px] font-semibold text-gray-500 dark:text-gray-400" x-text="franchise.count + ' film · ' + franchise.firstYear + (franchise.lastYear !== franchise.firstYear ? '–' + franchise.lastYear : '')"></p></div>
                                </button>
                            </template>
                        </div>
                        <div x-show="franchiseEntries.length === 0" class="rounded-2xl border border-dashed border-gray-300 dark:border-gray-700 p-10 text-center text-sm text-gray-500 dark:text-gray-400">Henüz katalogda birden fazla filmi bulunan seri yok.</div>
                    </div>
                </template>
                <template x-if="selectedFranchise">
                    <div class="space-y-7">
                        <button type="button" @click="closeFranchiseDetail()" class="inline-flex items-center gap-2 text-xs font-bold text-gray-500 hover:text-rose-500 transition-colors"><i class="fa-solid fa-arrow-left"></i> Tüm serilere dön</button>
                        <section class="relative isolate overflow-hidden rounded-3xl border border-white/10 bg-[#101319] text-white">
                            <img :src="selectedFranchise.backdrop || selectedFranchise.poster" :alt="selectedFranchise.title" class="absolute inset-0 -z-20 h-full w-full object-cover opacity-45"><div class="absolute inset-0 -z-10 bg-gradient-to-r from-[#090b10] via-[#090b10]/85 to-[#090b10]/25"></div>
                            <div class="max-w-3xl px-6 py-10 sm:px-10 sm:py-14"><p class="text-[10px] font-black uppercase tracking-[0.24em] text-rose-300">PERDE SERİ REHBERİ</p><h2 class="mt-3 text-3xl sm:text-5xl font-black tracking-tight" x-text="selectedFranchise.title"></h2><p class="mt-4 max-w-xl text-sm leading-relaxed text-white/75" x-text="selectedFranchise.description"></p><div class="mt-6 flex flex-wrap gap-2 text-[10px] font-bold text-white/80"><span class="rounded-full border border-white/20 bg-white/10 px-3 py-2" x-text="selectedFranchise.count + ' film'"></span><span class="rounded-full border border-white/20 bg-white/10 px-3 py-2" x-text="selectedFranchise.firstYear + ' – ' + selectedFranchise.lastYear"></span><span class="rounded-full border border-white/20 bg-white/10 px-3 py-2">Vizyon sırası</span></div></div>
                        </section>
                        <div class="flex items-end justify-between gap-3"><div><p class="text-[10px] font-black uppercase tracking-[0.2em] text-rose-500">İZLEME SIRASI</p><h3 class="mt-1 text-xl font-black text-gray-900 dark:text-white">Serideki filmler</h3></div><span class="text-[10px] text-gray-500 dark:text-gray-400">Vizyona göre sıralandı</span></div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-8 gap-3 sm:gap-4">
                            <template x-for="(item,index) in selectedFranchise.items" :key="'franchise-item-'+item.id">
                                <button type="button" @click="openWatchPage(item)" class="group overflow-hidden rounded-2xl border border-gray-200 dark:border-white/10 bg-white dark:bg-[#151922] text-left shadow-sm transition hover:-translate-y-1 hover:shadow-xl">
                                    <div class="relative aspect-[2/3] overflow-hidden bg-gray-900"><img :src="item.poster || item.image" :alt="item.title" loading="lazy" class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105"><span class="absolute left-3 top-3 flex h-7 w-7 items-center justify-center rounded-full bg-black/75 text-xs font-black text-white" x-text="index + 1"></span><span class="absolute bottom-3 right-3 rounded-md bg-black/75 px-2 py-1 text-[10px] font-black text-amber-300" x-text="item.rating || item.tmdbRating || '—'"></span></div>
                                    <div class="space-y-1 p-3"><h4 class="line-clamp-2 text-xs font-extrabold text-gray-900 dark:text-white" x-text="item.title"></h4><p class="text-[10px] text-gray-500 dark:text-gray-400" x-text="item.year + ' · Film'"></p></div>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </template>
