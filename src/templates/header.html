<!-- Perde üst gezinme alanı: marka, masaüstü menüsü, profil ve mobil menü. -->
    <!-- Header / Top Navbar (Full Width) — responsive and contrast verified -->
    <header x-cloak x-show="headerConfigReady && headerConfig.enabled !== false" @scroll.window="headerScrolled = window.scrollY > 40" :class="'sticky top-0 z-50 ' + (currentPage === 'home' && !headerScrolled ? 'home-hero-overlay' : getHeaderClass())" class="backdrop-blur-md border-b transition-colors duration-300">
        <div class="w-full px-4 sm:px-12 md:max-w-[1800px] md:mx-auto md:px-8 lg:px-12 xl:px-16 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 lg:space-x-6 xl:space-x-12">
                <a href="#" @click.prevent="navigateTo('home')" class="flex items-center space-x-0.5 group">
                    <img x-show="headerConfig.logoImage" :src="headerConfig.logoImage" alt="Logo" :width="headerConfig.logoWidth || 32" :height="headerConfig.logoHeight || 32" :style="`width:${headerConfig.logoWidth || 32}px;height:${headerConfig.logoHeight || 32}px;max-width:100%;object-fit:contain;flex:0 0 auto`" class="object-contain">
                    <div x-show="!headerConfig.logoImage && headerConfig.showLogoIcon !== false" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-rose-500 flex items-center justify-center shadow-lg shadow-rose-600/30 group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-film text-white text-sm"></i>
                    </div>
                    <span x-show="(headerConfig.brandPrimary || '').trim() || (headerConfig.brandAccent || '').trim()" class="text-xl font-black tracking-wider uppercase max-[360px]:hidden"><span x-show="(headerConfig.brandPrimary || '').trim()" x-text="headerConfig.brandPrimary"></span><span x-show="(headerConfig.brandAccent || '').trim()" class="text-rose-700 dark:text-rose-400" x-text="headerConfig.brandAccent"></span></span>
                </a>

                <nav class="cv-desktop-nav hidden xl:flex items-center space-x-5 text-[11px] font-bold uppercase tracking-wider text-gray-600 dark:text-gray-400">
                    <a x-show="headerConfig.showHome !== false" href="#" @click.prevent="navigateTo('home')"  :class="isHeaderMenuActive('home') ? 'is-active' : ''" class="transition-colors" x-text="headerConfig.homeLabel || 'Ana Sayfa'">Ana Sayfa</a>
                    <a x-show="headerConfig.showExplore !== false" href="#" @click.prevent="navigateTo('explore')"  :class="isHeaderMenuActive('explore') ? 'is-active' : ''" class="transition-colors" x-text="headerConfig.exploreLabel || 'Keşfet'">Keşfet</a>
                    <a x-show="headerConfig.showFranchises !== false" href="#" @click.prevent="navigateTo('franchises')"  :class="isHeaderMenuActive('franchises') ? 'is-active' : ''" class="transition-colors" x-text="headerConfig.franchisesLabel || 'Seri Filmler'">Seri Filmler</a>
                    <a x-show="headerConfig.showVideo !== false" href="#" @click.prevent="navigateTo('video-links')"  :class="isHeaderMenuActive('video-links') ? 'is-active' : ''" class="transition-colors flex items-center gap-1.5">
                        <span x-text="headerConfig.videoLabel || 'Video Bağlantıları'">Video Bağlantıları</span>
                        <span class="px-1.5 py-0.5 rounded-full bg-rose-500/15 text-rose-600 dark:text-rose-400 text-[10px]" x-text="watchableCatalog.length"></span>
                    </a>
                    <template x-for="(link,index) in (headerConfig.customLinks || [])" :key="'header-custom-'+index">
                        <a href="#" @click.prevent="navigateTo(link.page)"  :class="isHeaderMenuActive(link.page) ? 'is-active' : ''" class="transition-colors" x-text="link.label"></a>
                    </template>
                </nav>
            </div>

            <div class="flex items-center space-x-1 sm:space-x-4">
                <button x-show="headerConfig.showMobileMenu !== false" @click="mobileMenuOpen = !mobileMenuOpen" :aria-expanded="mobileMenuOpen.toString()" aria-label="Menüyü aç veya kapat" class="xl:hidden w-9 h-9 rounded-lg border border-gray-300 dark:border-gray-700 flex items-center justify-center text-gray-700 dark:text-gray-200 hover:text-rose-500 transition-colors">
                    <i :class="mobileMenuOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars'"></i>
                </button>
                <button x-show="headerConfig.showSearch !== false" type="button" @click="openSearchOverlay()" aria-label="Film ve dizi ara" aria-haspopup="dialog" class="cineverse-search-trigger" title="Ara">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                </button>

                <!-- Tek profil menüsü -->
                <div x-show="headerConfig.showProfile !== false" class="relative" x-data="{ openProfileMenu: false }">
                    <button type="button" @click="openProfileMenu = !openProfileMenu" :aria-expanded="openProfileMenu.toString()" aria-label="Hesap menüsünü aç" class="cineverse-profile-trigger">
                        <img alt="Profil fotoğrafı" width="32" height="32" @error="handleImageError($event)" decoding="async" loading="eager" :src="currentProfile.avatar" class="cineverse-profile-avatar">
                        <i :class="openProfileMenu ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down'" class="text-[10px] opacity-70" aria-hidden="true"></i>
                    </button>
                    <div x-cloak x-show="openProfileMenu" x-transition.origin.top.right @click.away="openProfileMenu = false" class="cineverse-header-dropdown cineverse-profile-dropdown absolute right-0 mt-2 w-72 rounded-xl border shadow-2xl py-2 z-50">
                        <div class="px-4 pt-2 pb-3">
                            <p class="text-[10px] font-extrabold uppercase tracking-[.16em] opacity-55">Hesap</p>
                            <p class="mt-1 text-sm font-extrabold" x-text="currentProfile.name"></p>
                        </div>
                        <div class="cineverse-dropdown-divider my-2"></div>
                        <p class="px-4 pb-1 text-[10px] font-extrabold uppercase tracking-[.16em] opacity-55">Kişisel alanın</p>
                        <button type="button" @click="navigateTo('library'); openProfileMenu = false" class="cineverse-dropdown-item">
                            <i class="fa-solid fa-book-open w-4 text-center text-rose-500"></i><span class="flex-1">Kütüphanem</span><span class="text-[10px] opacity-60" x-text="continueWatchingItems.length"></span>
                        </button>
                        <button type="button" @click="navigateTo('watchlist'); openProfileMenu = false" class="cineverse-dropdown-item">
                            <i class="fa-solid fa-bookmark w-4 text-center text-rose-500"></i><span class="flex-1">İzleme Listem</span><span class="text-[10px] opacity-60" x-text="watchlist.length"></span>
                        </button>
                        <button type="button" @click="navigateTo('stats'); openProfileMenu = false" class="cineverse-dropdown-item">
                            <i class="fa-solid fa-chart-simple w-4 text-center text-rose-500"></i><span class="flex-1">İstatistikler</span>
                        </button>
                        <div class="cineverse-dropdown-divider my-2"></div>
                        <p class="px-4 pb-1 text-[10px] font-extrabold uppercase tracking-[.16em] opacity-55">Görünüm teması</p>
                        <button type="button" @click="setTheme('ivory'); openProfileMenu = false;" class="cineverse-dropdown-item">
                            <i class="fa-solid fa-sun w-4 text-center text-amber-500"></i><span class="flex-1">Fil Dişi (Sıcak Krem)</span><i x-show="theme === 'ivory'" class="fa-solid fa-check ml-auto text-rose-500"></i>
                        </button>
                        <button type="button" @click="setTheme('slate'); openProfileMenu = false;" class="cineverse-dropdown-item">
                            <i class="fa-solid fa-circle-half-stroke w-4 text-center text-sky-500"></i><span class="flex-1">Modern Gri (Slate)</span><i x-show="theme === 'slate'" class="fa-solid fa-check ml-auto text-rose-500"></i>
                        </button>
                        <button type="button" @click="setTheme('dark'); openProfileMenu = false;" class="cineverse-dropdown-item">
                            <i class="fa-solid fa-moon w-4 text-center text-indigo-400"></i><span class="flex-1">Karanlık Mod</span><i x-show="theme === 'dark'" class="fa-solid fa-check ml-auto text-rose-500"></i>
                        </button>
                        <div class="cineverse-dropdown-divider my-2"></div>
                        <a href="admin/" class="cineverse-admin-shortcut">
                            <span class="cineverse-admin-icon"><i class="fa-solid fa-shield-halved"></i></span>
                            <span class="flex-1"><strong class="block text-xs">Admin Paneli</strong><small class="block mt-0.5 text-[10px] opacity-60">Yönetim merkezini aç</small></span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-55"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div x-cloak x-show="headerConfig.showMobileMenu !== false && mobileMenuOpen" x-transition.origin.top.right @click.away="mobileMenuOpen = false" class="xl:hidden absolute top-full right-3 left-3 sm:left-auto sm:w-80 mt-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#161922] shadow-2xl p-3 z-50">
            <nav class="grid grid-cols-1 gap-1 text-sm font-bold text-gray-700 dark:text-gray-200">
                <a x-show="headerConfig.showHome !== false" href="#" @click.prevent="navigateTo('home'); mobileMenuOpen = false"  :class="isHeaderMenuActive('home') ? 'is-active' : ''" class="rounded-lg px-3 py-3"><span x-text="headerConfig.homeLabel || 'Ana Sayfa'">Ana Sayfa</span></a>
                <a x-show="headerConfig.showExplore !== false" href="#" @click.prevent="navigateTo('explore'); mobileMenuOpen = false"  :class="isHeaderMenuActive('explore') ? 'is-active' : ''" class="rounded-lg px-3 py-3"><span x-text="headerConfig.exploreLabel || 'Keşfet'">Keşfet</span></a>
                <a x-show="headerConfig.showFranchises !== false" href="#" @click.prevent="navigateTo('franchises'); mobileMenuOpen = false"  :class="isHeaderMenuActive('franchises') ? 'is-active' : ''" class="rounded-lg px-3 py-3" x-text="headerConfig.franchisesLabel || 'Seri Filmler'">Seri Filmler</a>
                <a x-show="headerConfig.showVideo !== false" href="#" @click.prevent="navigateTo('video-links'); mobileMenuOpen = false"  :class="isHeaderMenuActive('video-links') ? 'is-active' : ''" class="rounded-lg px-3 py-3 flex items-center justify-between"><span x-text="headerConfig.videoLabel || 'Video Bağlantıları'">Video Bağlantıları</span><span class="text-xs text-rose-500" x-text="watchableCatalog.length"></span></a>
                <template x-for="(link,index) in (headerConfig.customLinks || [])" :key="'mobile-header-custom-'+index">
                    <a href="#" @click.prevent="navigateTo(link.page); mobileMenuOpen = false"  :class="isHeaderMenuActive(link.page) ? 'is-active' : ''" class="rounded-lg px-3 py-3" x-text="link.label"></a>
                </template>
            </nav>
        </div>
    </header>
