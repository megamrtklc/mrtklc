<!--
  Perde ana sayfa parçası: Son Eklenenler bölümünün HTML içeriği.
  Ana kapsayıcı homepage.html içinde kalır; bu dosya görünür alana yaklaşınca yüklenir.
-->

                    <div class="home-new-arrivals-heading flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 pb-4">
                        <div>
                            <p class="text-[10px] font-black uppercase tracking-[0.22em] text-rose-700 dark:text-rose-400 mb-1">CINEVERSE • ARŞİVE YENİ KATILANLAR</p>
                            <h2 class="text-xl sm:text-2xl font-black uppercase tracking-wider text-gray-900 dark:text-white">Son Eklenenler</h2>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Kataloğa en son eklenen film ve diziler</p>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="text-[10px] font-bold text-gray-500 dark:text-gray-400 tabular-nums" x-text="homeSectionReady['new-arrivals'] ? homeNewArrivals.length + ' yeni yapım' : ''"></span>
                            <button type="button" @click="scrollHomeCards('home-new-arrivals-rail',-1)" aria-label="Önceki yeni eklenen yapımlar" class="home-rail-arrow"><i class="fa-solid fa-chevron-left"></i></button>
                            <button type="button" @click="scrollHomeCards('home-new-arrivals-rail',1)" aria-label="Sonraki yeni eklenen yapımlar" class="home-rail-arrow"><i class="fa-solid fa-chevron-right"></i></button>
                            <button type="button" @click="navigateTo('new-arrivals')" class="text-[10px] font-black text-rose-700 dark:text-rose-400 hover:text-rose-800 dark:hover:text-rose-300 ml-1">Tümünü Gör <i class="fa-solid fa-arrow-right ml-1"></i></button>
                        </div>
                    </div>
                    <div id="home-new-arrivals-rail" class="home-card-rail home-new-arrivals-rail">
                        <template x-for="(item,index) in (homeSectionReady['new-arrivals'] ? homeNewArrivals.slice(0, window.matchMedia('(max-width: 767px)').matches ? 8 : 15) : [])" :key="'new-arrival-' + item.id">
                            <div class="contents">
                                <template x-if="index === 0">
                                    <button type="button" @click="openWatchPage(item)" :class="getCardClass() + (index === 0 ? ' home-new-arrival-feature' : '')" class="home-rail-card home-new-arrival-card group min-w-0 text-left rounded-xl overflow-hidden border transition-all duration-300">
                                <div class="home-new-arrival-poster relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
                                    <img :alt="item.title" @error="handleImageError($event)" decoding="async" loading="lazy" fetchpriority="auto" :src="index === 0 ? (item.backdrop || item.poster || item.image || item.tmdbPoster) : (item.poster || item.image || item.tmdbPoster || item.backdrop)" :srcset="getTmdbImageSrcSet(index === 0 ? (item.backdrop || item.poster || item.image || item.tmdbPoster) : (item.poster || item.image || item.tmdbPoster || item.backdrop), index === 0 ? [500, 780, 1280] : [154, 185, 342, 500])" :sizes="index === 0 ? '(max-width:639px) min(calc(82vw - 39px), 310px), (max-width:767px) calc(42vw - 40px), (max-width:1023px) calc(31vw - 30px), (max-width:1275px) 29vw, 370px' : '(max-width:639px) calc(44vw - 21px), (max-width:767px) calc(29vw - 28px), (max-width:1023px) calc(23vw - 22px), (max-width:1087px) 174px, (max-width:1312px) 16vw, 210px'" class="w-full h-full object-cover transition-transform duration-700">
                                    <div class="home-new-arrival-shade absolute inset-0"></div>
                                    <span x-show="index === 0" class="absolute top-3 left-3 z-[4] inline-flex items-center gap-1 rounded-md border border-amber-300/40 bg-black/80 px-2 py-1.5 text-[8px] font-black text-amber-300 shadow-lg"><i class="fa-solid fa-star"></i><span class="home-feature-rating-value" x-text="((item.rating || item.tmdbRating) ? Number(item.rating || item.tmdbRating).toFixed(1) : '—')"></span></span>
                                    <span x-show="index !== 0" class="home-new-arrival-badge absolute top-3 left-3 rounded-md bg-rose-600 text-white text-[8px] font-black uppercase tracking-wider px-2 py-1.5 shadow-lg">YENİ EKLENDİ</span>
                                    <div class="absolute top-3 right-3 flex max-w-[72%] items-center justify-end gap-1.5">
                                        <span class="rounded-md bg-black/75 text-white text-[8px] font-black uppercase tracking-wider px-2 py-1.5 backdrop-blur-md" x-text="item.type === 'tv' || item.type === 'series' ? 'DİZİ' : 'FİLM'"></span><span class="rounded-md border border-white/15 bg-black/75 text-white/90 text-[8px] font-bold px-2 py-1.5 backdrop-blur-md" x-text="(item.category || item.genre || '').split(/[\\/,]/).map(g => g.trim()).filter(Boolean).slice(0,2).join(' • ') || 'TÜR'"></span>

                                    </div>
                                    <span x-show="index !== 0" class="absolute bottom-3 right-3 rounded-md bg-black/75 text-amber-400 text-[10px] font-black px-2 py-1.5 backdrop-blur-md"><i class="fa-solid fa-star mr-1"></i><span class="home-feature-rating-value" x-text="((item.rating || item.tmdbRating) ? Number(item.rating || item.tmdbRating).toFixed(1) : '—')"></span></span>
                                </div>
                                <div class="home-new-arrival-copy p-3 space-y-2">
                                    <img x-show="index === 0" :src="item.poster || item.image || item.tmdbPoster || item.backdrop" :srcset="getTmdbImageSrcSet(item.poster || item.image || item.tmdbPoster || item.backdrop, [92, 154, 185, 342])" sizes="(max-width: 639px) 88px, 108px" :alt="item.title + ' afişi'" @error="handleImageError($event)" loading="lazy" decoding="async" class="home-new-arrival-feature-poster">
                                    <div x-show="index === 0" class="home-new-arrival-feature-title-row flex items-center gap-2 min-w-0">
                                        <h3 class="min-w-0 flex-1 text-[11px] sm:text-xs font-extrabold text-white line-clamp-2" :style="'font-size:' + Math.max(8.5, Math.min(18, 18 - Math.max(0, (String(item.title || '').length - 16) * 0.32))) + 'px'" x-text="item.title"></h3>

                                    </div>
                                    <h3 x-show="index !== 0" class="text-[11px] sm:text-xs font-extrabold text-gray-900 dark:text-white line-clamp-2" x-text="item.title"></h3>
                                     <p x-show="index === 0" x-text="(item.desc || item.tmdbOverview || item.overview || item.plot || item.description || item.synopsis || item.summary || &quot;Bu yapımın konu açıklaması henüz eklenmemiş.&quot;).trim().slice(0,180)"></p>
                                    <div class="flex items-center justify-start gap-2 text-[9px] text-gray-500 dark:text-gray-400">
                                        <span class="truncate" x-text="item.year || item.tmdbReleaseDate?.slice(0,4) || '—'"></span><span class="opacity-60">•</span><span class="truncate" x-show="item.type === 'tv' || item.type === 'series'" x-text="(item.seasons ? item.seasons + ' Sezon' : '') + (item.seasons && item.episodes ? ' • ' : '') + (item.episodes ? item.episodes + ' Bölüm' : '')"></span><span class="truncate" x-show="item.type !== 'tv' && item.type !== 'series' && item.duration && item.duration !== 'Dizi' && item.duration !== 'Bilinmiyor'" x-text="item.duration"></span>
                                    </div>
                                </div>
                            </button>
                                </template>
                                <template x-if="index !== 0">
                                <div @click="openWatchPage(item)" :class="getCardClass()" class="home-rail-card home-catalog-card group rounded-xl overflow-hidden border hover:border-rose-600 transition-all duration-300 cursor-pointer flex flex-col shadow-sm">
                                    <div class="relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
                                        <span class="absolute top-2 left-2 z-[3] inline-flex items-center gap-1 rounded-md border border-amber-300/35 bg-black/85 px-2 py-1 text-[9px] font-black text-amber-300 shadow-lg backdrop-blur-sm"><i class="fa-solid fa-star text-[8px]"></i><span x-text="(item.rating || item.tmdbRating) ? Number(item.rating || item.tmdbRating).toFixed(1) : '—'"></span></span>
                                        <img :alt="item.title" @error="handleImageError($event)" decoding="async" loading="lazy" :src="getTmdbImageSrcSet(item.poster || item.image || item.tmdbPoster || item.backdrop, [154]).split(' ')[0] || item.poster || item.image || item.tmdbPoster || item.backdrop" :srcset="getTmdbImageSrcSet(item.poster || item.image || item.tmdbPoster || item.backdrop, [154, 185, 260, 312, 342])" sizes="(max-width: 639px) 148px, 178px" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                        <span class="absolute top-2 right-2 rounded-md border border-white/20 bg-black/80 px-2 py-1 text-[9px] font-black tracking-wide text-white shadow-lg backdrop-blur-sm" x-text="item.type === 'tv' || item.type === 'series' ? 'DİZİ' : 'FİLM'"></span>
                                    </div>
                                    <div class="p-3 flex flex-col flex-grow justify-between space-y-1">
                                        <div>
                                            <span class="text-[9px] font-bold text-rose-700 dark:text-rose-400 uppercase" x-text="item.genre || item.category"></span>
                                            <h3 class="font-bold text-xs text-gray-900 dark:text-white line-clamp-1 group-hover:text-rose-500 transition-colors" x-text="item.title"></h3>
                                        </div>
                                        <div class="flex items-center justify-between text-[10px] text-gray-500 dark:text-gray-400 pt-1 border-t border-gray-200 dark:border-gray-800/60">
                                            <span x-text="item.year"></span>
                                            <span x-text="item.duration"></span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            </div>
                        </template>
                    </div>
