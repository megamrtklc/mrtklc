<!--
  Perde ana sayfa parçası: İzlediklerim bölümünün HTML içeriği.
  Ana kapsayıcı homepage.html içinde kalır; bu dosya görünür alana yaklaşınca yüklenir.
-->

                    <div class="flex items-end justify-between gap-3 border-b border-gray-200 dark:border-gray-800 pb-3"><div><p class="text-[10px] font-black uppercase tracking-[0.2em] text-emerald-600 dark:text-emerald-400">İZLEME GEÇMİŞİ</p><h2 class="mt-1 text-xl sm:text-2xl font-black text-gray-900 dark:text-white">İzlediklerim</h2><p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Tamamladığın film ve diziler</p></div><span class="text-[10px] font-bold text-gray-500 dark:text-gray-400" x-text="watchedItems.length + ' yapım'"></span></div>
                    <div id="home-watched-rail" class="home-card-rail home-new-arrivals-rail">
                        <template x-for="(item,index) in watchedItems.slice(0,12)" :key="'home-watched-' + item.id">
                            <div class="contents">
                                <template x-if="index === 0">
                                    <button type="button" @click="openWatchPage(item)" :class="getCardClass() + ' home-new-arrival-feature'" class="home-rail-card home-new-arrival-card group min-w-0 text-left rounded-xl overflow-hidden border transition-all duration-300">
                                        <div class="home-new-arrival-poster relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
                                            <img :alt="item.title" @error="handleImageError($event)" decoding="async" loading="lazy" fetchpriority="auto" :src="item.backdrop || item.poster || item.image || item.tmdbPoster" :srcset="getTmdbImageSrcSet(item.backdrop || item.poster || item.image || item.tmdbPoster, [500, 780, 1280])" sizes="(max-width:639px) min(calc(82vw - 39px), 310px), (max-width:767px) calc(42vw - 40px), (max-width:1023px) calc(31vw - 30px), (max-width:1275px) 29vw, 370px" class="w-full h-full object-cover transition-transform duration-700">
                                            <div class="home-new-arrival-shade absolute inset-0"></div>
                                            <span class="absolute top-3 left-3 z-[4] inline-flex items-center gap-1 rounded-md border border-amber-300/50 bg-black/80 px-2 py-1.5 text-[8px] font-black text-amber-300 shadow-lg"><i class="fa-solid fa-star"></i><span class="home-feature-rating-value" x-text="((item.rating || item.tmdbRating) ? Number(item.rating || item.tmdbRating).toFixed(1) : '—')"></span></span>
                                            <div class="absolute top-3 right-3 flex max-w-[72%] items-center justify-end gap-1.5">
                                                <span class="rounded-md bg-black/75 text-white text-[8px] font-black uppercase tracking-wider px-2 py-1.5 backdrop-blur-md" x-text="item.type === 'tv' || item.type === 'series' ? 'DİZİ' : 'FİLM'"></span><span class="rounded-md border border-white/15 bg-black/75 text-white/90 text-[8px] font-bold px-2 py-1.5 backdrop-blur-md" x-text="(item.category || item.genre || '').split(/[\\/,]/).map(g => g.trim()).filter(Boolean).slice(0,2).join(' • ') || 'TÜR'"></span>

                                            </div>
                                        </div>
                                        <div class="home-new-arrival-copy p-3 space-y-2">
                                            <img :src="item.poster || item.image || item.tmdbPoster || item.backdrop" :srcset="getTmdbImageSrcSet(item.poster || item.image || item.tmdbPoster || item.backdrop, [92, 154, 185, 342])" sizes="(max-width: 639px) 88px, 108px" :alt="item.title + ' afişi'" @error="handleImageError($event)" loading="lazy" decoding="async" class="home-new-arrival-feature-poster">
                                            <div class="home-new-arrival-feature-title-row flex items-center gap-2 min-w-0">
                                                <h3 class="min-w-0 flex-1 text-[11px] sm:text-xs font-extrabold text-white line-clamp-2" :style="'font-size:' + Math.max(8.5, Math.min(18, 18 - Math.max(0, (String(item.title || '').length - 16) * 0.32))) + 'px'" x-text="item.title"></h3>
                                            </div>
                                            <p x-text="(item.desc || item.tmdbOverview || item.overview || item.plot || item.description || item.synopsis || item.summary || 'Bu yapımın konu açıklaması henüz eklenmemiş.').trim().slice(0,180)"></p>
                                            <div class="flex items-center justify-start gap-2 text-[9px] text-gray-500 dark:text-gray-400">
                                                <span class="truncate" x-text="item.year || item.tmdbReleaseDate?.slice(0,4) || '—'"></span><span class="opacity-60">•</span><span class="truncate" x-show="item.type === 'tv' || item.type === 'series'" x-text="(item.seasons ? item.seasons + ' Sezon' : '') + (item.seasons && item.episodes ? ' • ' : '') + (item.episodes ? item.episodes + ' Bölüm' : '')"></span><span class="truncate" x-show="item.type !== 'tv' && item.type !== 'series' && item.duration && item.duration !== 'Dizi' && item.duration !== 'Bilinmiyor'" x-text="item.duration"></span>
                                            </div>
                                        </div>
                                    </button>
                                </template>
                                <template x-if="index !== 0">
                                    <div @click="openWatchPage(item)" :class="getCardClass()" class="home-rail-card home-new-arrival-card home-catalog-card group rounded-xl overflow-hidden border transition-all duration-300 cursor-pointer flex flex-col shadow-sm">
                                        <div class="relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
<span class="absolute top-2 left-2 z-[3] inline-flex items-center gap-1 rounded-md border border-amber-300/35 bg-black/85 px-2 py-1 text-[9px] font-black text-amber-300 shadow-lg backdrop-blur-sm"><i class="fa-solid fa-star text-[8px]"></i><span x-text="(item.rating || item.tmdbRating) ? Number(item.rating || item.tmdbRating).toFixed(1) : '—'"></span></span>

                                            <img :alt="item.title" @error="handleImageError($event)" decoding="async" loading="lazy" :src="getTmdbImageSrcSet(item.poster || item.image || item.tmdbPoster || item.backdrop, [154]).split(' ')[0] || item.poster || item.image || item.tmdbPoster || item.backdrop" :srcset="getTmdbImageSrcSet(item.poster || item.image || item.tmdbPoster || item.backdrop, [154, 185, 260, 312, 342])" sizes="(max-width: 639px) 148px, 178px" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                            <span class="absolute top-2 right-2 rounded-md bg-black/80 px-2 py-1 text-[9px] font-black text-white" x-text="item.type === 'tv' || item.type === 'series' ? 'DİZİ' : 'FİLM'"></span>

                                        </div>
                                        <div class="p-3 flex flex-col flex-grow justify-between space-y-1">
                                            <div>
                                                <span class="text-[9px] font-bold text-emerald-600 dark:text-emerald-400 uppercase" x-text="item.genre || item.category || item.tmdbGenres || 'GENEL'"></span>
                                                <h3 class="font-bold text-xs text-gray-900 dark:text-white line-clamp-1 group-hover:text-emerald-500 transition-colors" x-text="item.title"></h3>
                                            </div>
                                            <div class="flex items-center justify-between text-[10px] text-gray-500 dark:text-gray-400 pt-1 border-t border-gray-200 dark:border-gray-800/60">
                                                <span x-text="item.year || item.tmdbReleaseDate?.slice(0,4) || '—'"></span>
                                                <span x-text="item.duration || ''"></span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
