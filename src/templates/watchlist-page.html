<!--
  Perde İzleme Listesi görünümü
  -----------------------------
  Kullanıcının daha sonra izlemek üzere ayırdığı yapımları ve liste işlemlerini içerir.
  Ana uygulamanın Alpine kapsamını kullanır; bağımsız sayfa olarak çalıştırılmaz.
-->
<!-- ==================== WATCHLIST PAGE ==================== -->
        <template x-if="currentPage === 'watchlist'">
            <div class="w-full px-6 sm:px-12 pt-8 space-y-6 pb-16">
                <div>
                    <h2 class="text-2xl font-black uppercase tracking-wide text-gray-900 dark:text-white" x-text="currentProfile.name + ' - İzleme Listem'"></h2>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Seçili profile kaydettiğiniz özel favorileriniz.</p>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4" x-show="currentWatchlist.length > 0">
                    <template x-for="item in currentWatchlist" :key="item.id">
                        <div @click="openWatchPage(item)" :class="getCardClass()" class="group rounded-xl overflow-hidden border hover:border-rose-600 transition-all cursor-pointer flex flex-col shadow-sm">
                            <div class="relative aspect-[2/3] overflow-hidden bg-gray-100 dark:bg-gray-900">
                                <img :alt="item.title" @error="handleImageError($event)" decoding="async" loading="lazy" :src="item.poster" :srcset="getTmdbImageSrcSet(item.poster)" sizes="(max-width: 380px) 42vw, (max-width: 639px) 40vw, (max-width: 767px) 30vw, (max-width: 1023px) 19vw, (max-width: 1279px) 15vw, 14.5vw" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                <button @click.stop="toggleWatchlist(item)" class="absolute top-2 right-2 w-7 h-7 rounded bg-rose-600 text-white flex items-center justify-center shadow">
                                    <i class="fa-solid fa-bookmark text-xs"></i>
                                </button>
                            </div>
                            <div class="p-2.5 space-y-0.5">
                                <span class="text-[9px] font-bold text-rose-700 dark:text-rose-400 uppercase" x-text="item.genre"></span>
                                <h3 class="font-bold text-xs text-gray-900 dark:text-white line-clamp-1" x-text="item.title"></h3>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="currentWatchlist.length === 0" :class="getCardClass()" class="text-center py-16 rounded-2xl border max-w-md mx-auto space-y-4 shadow-sm">
                    <i class="fa-regular fa-bookmark text-4xl text-rose-600"></i>
                    <h3 class="font-bold text-base text-gray-900 dark:text-white">İzleme Listesi Boş</h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400">İzlemek istediğin yapımları “Listeme ekle” simgesiyle burada toplayabilirsin.</p>
                    <button @click="navigateTo('home')" class="px-6 py-2.5 bg-rose-600 text-white rounded-xl text-xs font-bold uppercase tracking-wider shadow hover:bg-rose-700 transition-colors">Ana Sayfaya Dön</button>
                </div>
            </div>
        </template>
