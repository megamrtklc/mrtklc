<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f">
<title>CineVerse TV</title>
<style>
:root{color-scheme:dark;--bg:#08090d;--muted:#aab1bd;--white:#f7f8fb;--gold:#f5c451;--red:#e50918}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}body{min-height:100vh}button,a{font:inherit;color:inherit}button{cursor:pointer}
.topbar{height:82px;position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:55px;padding:0 5.2vw;background:linear-gradient(180deg,#050609ef,transparent)}.brand{font-size:30px;font-weight:950;letter-spacing:-1.7px;white-space:nowrap}.brand span{color:var(--red)}.app-nav{display:flex;align-items:center;gap:12px}.nav-btn{border:0;background:transparent;color:#c4c8d0;font-size:17px;font-weight:700;padding:12px 17px;border-radius:30px}.nav-btn.active,.nav-btn:focus{background:#ffffff1c;color:#fff;outline:2px solid #ffffff35}.nav-right{margin-left:auto;color:#c4c8d0;font-size:15px}
.hero{height:76vh;min-height:600px;max-height:850px;position:relative;display:flex;align-items:flex-end;padding:0 6vw 82px;overflow:hidden;background:#10131b}.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 28%;opacity:.92;transform:scale(1.015)}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08090df2 0%,#08090dca 25%,#08090d50 58%,#08090d12 100%),linear-gradient(0deg,#08090d 0%,#08090dce 9%,transparent 56%),linear-gradient(180deg,#08090d90 0%,transparent 27%)}.hero-content{position:relative;z-index:1;max-width:710px;padding-top:85px}.eyebrow{font-size:13px;letter-spacing:3px;color:var(--gold);font-weight:850;margin-bottom:15px}.hero h1{font-size:clamp(44px,5.2vw,76px);line-height:1.02;margin:0 0 16px;font-weight:950;text-shadow:0 4px 25px #0008}.meta{display:flex;gap:13px;align-items:center;color:#e1e4e9;font-size:16px;margin-bottom:16px;font-weight:650;flex-wrap:wrap}.rating{color:#17130a;background:var(--gold);padding:5px 9px;border-radius:4px;font-weight:950}.hero p{font-size:19px;line-height:1.5;color:#e1e3e8;margin:0 0 24px;max-width:620px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 12px #000}.action{min-height:55px;padding:0 28px;border:1px solid #ffffff30;border-radius:7px;background:#ffffff20;font-size:17px;font-weight:850}.action.primary{background:#fff;color:#101116;border-color:#fff}.action:focus{outline:3px solid var(--gold);outline-offset:4px}
main{padding:0 5.2vw 55px;position:relative;margin-top:-20px}.rail{margin:25px 0 38px;scroll-margin-top:18px}.rail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.rail h2{font-size:25px;margin:0;font-weight:850;letter-spacing:-.3px}.rail-hint{font-size:12px;color:#818997;letter-spacing:1.5px}.cards{display:flex;gap:20px;overflow-x:auto;overflow-y:hidden;padding:12px 8px 20px;scrollbar-width:none;scroll-snap-type:x proximity}.cards::-webkit-scrollbar{display:none}.movie-card{flex:0 0 178px;width:178px;border:0;background:transparent;padding:0;text-align:left;border-radius:9px;scroll-snap-align:start;position:relative;transition:transform .16s ease}.poster-wrap{height:260px;border-radius:8px;overflow:hidden;background:#1b202b;position:relative;border:2px solid transparent;box-shadow:0 7px 22px #0006}.movie-card img{width:100%;height:100%;display:block;object-fit:cover}.card-rating{position:absolute;left:8px;top:8px;padding:4px 7px;border-radius:4px;background:#05070ddd;color:var(--gold);font-size:12px;font-weight:900}.card-type{position:absolute;right:7px;bottom:7px;background:#05070ddd;padding:5px 7px;border-radius:4px;font-size:10px;font-weight:850;letter-spacing:.5px}.card-title{display:block;font-size:15px;line-height:1.35;font-weight:750;color:#e9edf3;margin:10px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.movie-card:focus{outline:none;transform:scale(1.075);z-index:2}.movie-card:focus .poster-wrap{border:3px solid var(--gold);box-shadow:0 0 0 4px #f5c45135,0 15px 30px #000b}.movie-card:focus .card-title{color:#fff}
button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.detail{display:none;min-height:100vh;padding:0 5.2vw 65px;background:#08090d}.detail.active{display:block}.home.hidden{display:none}.backline{height:82px;display:flex;align-items:center}.back-btn{border:0;background:#ffffff12;padding:12px 19px;border-radius:25px;font-weight:800}.player-shell{width:100%;height:min(66vh,740px);min-height:420px;background:#000;overflow:hidden;position:relative}.player-shell video,.player-shell iframe{width:100%;height:100%;display:block;border:0;background:#000}.player-placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;text-align:center;padding:25px;background:radial-gradient(ellipse at center,#202735,#050609 70%)}.player-placeholder strong{font-size:25px}.player-placeholder p{color:#b7bfcc;margin:0;max-width:650px;line-height:1.5}.source-link{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;background:var(--red);border-radius:7px;text-decoration:none;font-weight:850}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:38px;margin-top:30px;align-items:start}.detail-title{font-size:clamp(32px,4vw,49px);margin:0 0 12px;font-weight:950}.detail-copy{font-size:19px;line-height:1.65;color:#d0d6df;max-width:1100px;margin:16px 0 0}.detail-poster{width:100%;border-radius:8px;display:block;box-shadow:0 12px 35px #0008}.section-title{font-size:25px;margin:34px 0 13px;font-weight:850}.similar .movie-card{flex-basis:160px;width:160px}.similar .poster-wrap{height:232px}.empty-note{color:#9da6b4;padding:35px 0}.footer-note{color:#626b79;font-size:12px;padding:15px 0}
@media(max-width:1000px){.topbar{height:68px;padding:0 24px;gap:20px}.brand{font-size:24px}.nav-btn{font-size:14px;padding:9px 11px}.hero{min-height:480px;height:68vh;padding:0 25px 55px}.hero-content{max-width:90%}main{padding:0 24px 40px}.detail{padding:0 24px 45px}.detail-grid{grid-template-columns:1fr}.detail-poster{display:none}.movie-card{flex-basis:135px;width:135px}.poster-wrap{height:198px}.player-shell{min-height:300px}}
</style></head>
<body>
<header class="topbar"><div class="brand">CINE<span>VERSE</span></div><nav class="app-nav" aria-label="Ana menü"><button class="nav-btn active" data-rail="top">Ana Sayfa</button><button class="nav-btn" data-rail="movies">Filmler</button><button class="nav-btn" data-rail="series">Diziler</button><button class="nav-btn" data-rail="popular">Popüler</button></nav><div class="nav-right">TV</div></header>
<div class="home" id="home">
<section class="hero" id="top"><div class="hero-bg" id="heroBg"></div><div class="hero-content"><div class="eyebrow">CINEVERSE • ÖNE ÇIKAN</div><h1 id="heroTitle">CineVerse</h1><div class="meta" id="heroMeta"></div><p id="heroDesc">Film ve diziler dünyasını keşfet.</p><button class="action primary" id="heroOpen">▶　Şimdi İzle</button></div></section>
<main id="rails"><div class="empty-note">CineVerse TV hazırlanıyor…</div></main></div>
<section class="detail" id="detail" aria-live="polite"><div class="backline"><button class="back-btn" id="backHome">‹　Ana Sayfaya Dön</button></div><div class="player-shell" id="playerShell"><div class="player-placeholder"><strong>Yapım seçiliyor…</strong></div></div><div class="detail-grid"><div><h1 class="detail-title" id="detailTitle"></h1><div class="meta" id="detailMeta"></div><div class="eyebrow" style="margin-top:25px">YAPIM KÜNYESİ</div><div class="meta" id="detailCredits"></div><h2 class="section-title">Filmin Konusu</h2><p class="detail-copy" id="detailDesc"></p></div><aside><img class="detail-poster" id="detailPoster" alt=""></aside></div><h2 class="section-title">Benzer Yapımlar</h2><div class="cards similar" id="similarCards"></div></section>
<script>
(function(){
'use strict';
var catalog=[],heroItems=[],heroIndex=0,currentItem=null,homeFocus=null;
var $=function(id){return document.getElementById(id)};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rating(x){var n=Number(x&&x.rating);return Number.isFinite(n)&&n>0?n.toFixed(1):'—'}
function meta(x){return [x.year,x.type==='tv'?'Dizi':'Film',x.duration,x.category].filter(Boolean).join('　•　')}
function img(x){return x&&(x.backdrop||x.poster)||''}
function card(x){return '<button class="movie-card" data-item="'+esc(x.id)+'" aria-label="'+esc(x.title)+' yapımını aç"><span class="poster-wrap"><img loading="lazy" decoding="async" src="'+esc(x.poster||x.backdrop||'')+'" alt="'+esc(x.title)+'"><span class="card-rating">★ '+rating(x)+'</span><span class="card-type">'+(x.type==='tv'?'DİZİ':'FİLM')+'</span></span><span class="card-title">'+esc(x.title)+'</span></button>'}
function rail(title,items,id,hint){return items.length?'<section class="rail" id="'+id+'"><div class="rail-head"><h2>'+title+'</h2><span class="rail-hint">'+hint+'</span></div><div class="cards">'+items.map(card).join('')+'</div></section>':''}
function showHero(){var x=heroItems[heroIndex];if(!x)return;$('heroBg').style.backgroundImage='url("'+img(x).replace(/"/g,'%22')+'")';$('heroTitle').textContent=x.title||'Öne Çıkan Yapım';$('heroMeta').innerHTML='<span class="rating">★ '+rating(x)+'</span><span>'+esc(meta(x))+'</span>';$('heroDesc').textContent=x.desc||'CineVerse kütüphanesinde keşfetmeye hazır.';$('heroOpen').dataset.item=x.id}
function render(data){
 catalog=Array.isArray(data.catalog)?data.catalog:[];var cfg=data.homepageConfig||{},slides=cfg.desktopHeroSlides||cfg.heroSlides||[];
 heroItems=slides.filter(function(s){return s.active!==false}).map(function(s){return catalog.find(function(x){return String(x.id)===String(s.id)})}).filter(Boolean);if(!heroItems.length)heroItems=catalog.slice(0,8);showHero();
 var newest=catalog.slice().sort(function(a,b){var aa=(String(a.id||'').match(/^(?:cv-|perde-)(\d+)/)||[])[1],bb=(String(b.id||'').match(/^(?:cv-|perde-)(\d+)/)||[])[1];if(aa&&bb)return Number(bb)-Number(aa);if(aa)return -1;if(bb)return 1;return catalog.indexOf(b)-catalog.indexOf(a)});
 var movies=catalog.filter(function(x){return x.type==='movie'}),series=catalog.filter(function(x){return x.type==='tv'}),popular=catalog.slice().sort(function(a,b){return Number(b.rating||0)-Number(a.rating||0)});
 $('rails').innerHTML=rail('Son Eklenenler',newest.slice(0,20),'new','YENİ YAPIMLAR')+rail('Popüler Yapımlar',popular.slice(0,20),'popular','EN ÇOK BEĞENİLENLER')+rail('Filmler',movies.slice(0,30),'movies','FİLM ARŞİVİ')+rail('Diziler',series.slice(0,20),'series','DİZİ ARŞİVİ')+'<div class="footer-note">CineVerse TV • Yön tuşlarıyla gezin, OK ile açın, geri tuşuyla ana sayfaya dönün.</div>';
}
function youtubeEmbed(url){try{var u=new URL(url);if(u.hostname.includes('youtu.be'))return 'https://www.youtube-nocookie.com/embed/'+u.pathname.slice(1);if(u.hostname.includes('youtube.com')){var id=u.searchParams.get('v');if(!id&&u.pathname.includes('/embed/'))id=u.pathname.split('/embed/')[1];return id?'https://www.youtube-nocookie.com/embed/'+id:''}}catch(e){}return ''}
function openDetail(item){
 if(!item)return;currentItem=item;homeFocus=document.activeElement;$('home').classList.add('hidden');$('detail').classList.add('active');$('detailTitle').textContent=item.title||'';$('detailMeta').innerHTML='<span class="rating">★ '+rating(item)+'</span><span>'+esc(meta(item))+'</span>';$('detailCredits').textContent=[item.director?'Yönetmen: '+item.director:'',item.country?'Ülke: '+item.country:'',item.platform?'Platform: '+item.platform:'',item.seasons?'Sezon: '+item.seasons:'',item.episodes?'Bölüm: '+item.episodes:''].filter(Boolean).join('　•　')||'Künye bilgisi bulunmuyor.';$('detailDesc').textContent=item.desc||'Bu yapım için henüz bir konu açıklaması eklenmemiş.';$('detailPoster').src=item.poster||item.backdrop||'';$('detailPoster').alt=item.title||'';
 var url=item.watchUrl||'',yt=youtubeEmbed(url),shell=$('playerShell');
 if(/\.mp4(?:$|[?#])/i.test(url)){shell.innerHTML='<video id="tvVideo" controls playsinline preload="metadata" poster="'+esc(item.backdrop||item.poster||'')+'"><source src="'+esc(url)+'" type="video/mp4">Tarayıcınız video oynatmayı desteklemiyor.</video>'}
 else if(yt){shell.innerHTML='<iframe src="'+esc(yt)+'?autoplay=0&rel=0" title="'+esc(item.title)+' video oynatıcı" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>'}
 else if(url){shell.innerHTML='<div class="player-placeholder"><strong>İzleme kaynağı hazır</strong><p>Bu bağlantı TV tarayıcısında yerleşik oynatıcıya gömülemiyor olabilir. Kaynağı yeni sekmede açarak izleyebilirsin.</p><a class="source-link" href="'+esc(url)+'" target="_blank" rel="noopener">▶　Kaynağı Aç</a></div>'}
 else {shell.innerHTML='<div class="player-placeholder"><strong>Bu yapım için video kaynağı eklenmemiş</strong><p>Yönetim panelinden izleme bağlantısı eklendiğinde burada oynatılacak.</p></div>'}
 var similar=catalog.filter(function(x){if(x.id===item.id)return false;var sameType=x.type===item.type;var a=String(x.genre||x.category||'').toLocaleLowerCase('tr'),b=String(item.genre||item.category||'').toLocaleLowerCase('tr');return sameType&&(a&&b&&(a===b||a.split(/[ /,]+/).some(function(t){return t.length>2&&b.includes(t)})))}).slice(0,12);
 if(similar.length<6){catalog.filter(function(x){return x.id!==item.id&&x.type===item.type&&!similar.includes(x)}).slice(0,12-similar.length).forEach(function(x){similar.push(x)})}
 $('similarCards').innerHTML=similar.map(card).join('')||'<div class="empty-note">Benzer yapım bulunamadı.</div>';
 window.scrollTo(0,0);$('backHome').focus();
}
function goHome(){var video=$('tvVideo');if(video){video.pause();video.removeAttribute('src')}var frame=$('playerShell').querySelector('iframe');if(frame)frame.src='about:blank';$('detail').classList.remove('active');$('home').classList.remove('hidden');window.scrollTo(0,0);if(homeFocus&&homeFocus.focus)homeFocus.focus();currentItem=null}
function visible(){return Array.prototype.slice.call(document.querySelectorAll('.nav-btn,#home button[data-item],#heroOpen,#backHome,#detail button[data-item]')).filter(function(n){return n.getClientRects().length>0})}
function move(key){var nodes=visible(),cur=document.activeElement;if(!nodes.length)return;if(nodes.indexOf(cur)<0){nodes[0].focus();return}var a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,best=null,score=Infinity;nodes.forEach(function(n){if(n===cur)return;var r=n.getBoundingClientRect(),dx=r.left+r.width/2-ax,dy=r.top+r.height/2-ay,p=key==='ArrowRight'?dx:key==='ArrowLeft'?-dx:key==='ArrowDown'?dy:-dy;if(p<=5)return;var q=p+Math.abs((key==='ArrowLeft'||key==='ArrowRight')?dy:dx)*1.7;if(q<score){score=q;best=n}});if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest'})}else if(key==='ArrowDown'||key==='ArrowUp')window.scrollBy(0,key==='ArrowDown'?innerHeight*.55:-innerHeight*.55)}
document.addEventListener('keydown',function(e){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();move(e.key);return}if(e.key==='Escape'||e.key==='Backspace'||e.key==='BrowserBack'||e.keyCode===461){if($('detail').classList.contains('active')){e.preventDefault();goHome()}}});
document.addEventListener('click',function(e){var n=e.target.closest('[data-rail]');if(n){var target=n.dataset.rail==='top'?'top':n.dataset.rail;if(target==='top')window.scrollTo(0,0);else{var el=$(target);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.toggle('active',b===n)});return}var b=e.target.closest('[data-item]');if(b){var x=catalog.find(function(x){return String(x.id)===String(b.dataset.item)});openDetail(x)}});
$('backHome').addEventListener('click',goHome);
fetch('./catalog-lite.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw Error('catalog');return r.json()}).then(render).catch(function(){$('rails').innerHTML='<div class="empty-note">Katalog yüklenemedi. Bağlantıyı kontrol edip sayfayı yenileyin.</div>'});
})();
</script></body></html>
